# =============================================================================
# spine2 - spine SR Linux | AS 65500 | system0 10.0.0.2
# Underlay: eBGP "unnumbered" (IPv6 link-local + RFC 5549) com os leaves.
# =============================================================================
enter candidate

# ---------------------------------------------------------------- jumbo MTU
set / system mtu default-port-mtu 9232
set / system mtu default-l2-mtu 9232
set / system mtu default-ip-mtu 9194
set / system mtu min-path-mtu 9212

# ------------------------------------------------- interfaces para os leaves
# DESVIO (P001-S003): links numerados /31 em vez de unnumbered. O data plane de
# simulacao do SR Linux nao encaminha IPv4 em links unnumbered (next-hop IPv6
# link-local nao e resolvido); numerado funciona. Ver P001-S003-results.md.
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to leaf1"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.255.2.0/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv6 router-advertisement router-role admin-state enable
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to leaf2"
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.255.4.0/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv6 router-advertisement router-role admin-state enable
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "to leaf3"
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.255.6.0/31
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv6 router-advertisement router-role admin-state enable

# ------------------------------------------------------------------ loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.2/32
# P002-S001 S3: loopback IPv6 (alcançavel do fabric p/ teste de rota)
set / interface system0 subinterface 0 ipv6 admin-state enable
set / interface system0 subinterface 0 ipv6 address fd00:100::2/128

# --------------------------------------------------------- network-instance
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0

# ------------------------------------------------------------------ policies
set / routing-policy policy all default-action policy-result accept

# ----------------------------------------------------------------------- BGP
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65500
set / network-instance default protocols bgp router-id 10.0.0.2

set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ibgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ebgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv6-unicast multipath allow-multiple-as true
set / network-instance default protocols bgp afi-safi ipv6-unicast multipath ibgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv6-unicast multipath ebgp maximum-paths 64
# EVPN so e usado no Cenario C (ver configs/srl/evpn/) - fica habilitado aqui
# porque o spine atuara como route-reflector do overlay.
set / network-instance default protocols bgp afi-safi evpn admin-state enable

set / network-instance default protocols bgp group leafs admin-state enable
set / network-instance default protocols bgp group leafs description "underlay eBGP para leaves"
set / network-instance default protocols bgp group leafs export-policy [ all ]
set / network-instance default protocols bgp group leafs import-policy [ all ]
set / network-instance default protocols bgp group leafs afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group leafs afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group leafs afi-safi evpn admin-state disable
set / network-instance default protocols bgp group leafs timers hold-time 9
set / network-instance default protocols bgp group leafs timers keepalive-interval 3

# vizinhos numerados (IPv4 /31) - desvio do unnumbered (P001-S003)
set / network-instance default protocols bgp neighbor 10.255.2.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.2.1 description "leaf1"
set / network-instance default protocols bgp neighbor 10.255.2.1 peer-group leafs
set / network-instance default protocols bgp neighbor 10.255.2.1 peer-as 65001
set / network-instance default protocols bgp neighbor 10.255.4.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.4.1 description "leaf2"
set / network-instance default protocols bgp neighbor 10.255.4.1 peer-group leafs
set / network-instance default protocols bgp neighbor 10.255.4.1 peer-as 65002
set / network-instance default protocols bgp neighbor 10.255.6.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.6.1 description "leaf3"
set / network-instance default protocols bgp neighbor 10.255.6.1 peer-group leafs
set / network-instance default protocols bgp neighbor 10.255.6.1 peer-as 65003

