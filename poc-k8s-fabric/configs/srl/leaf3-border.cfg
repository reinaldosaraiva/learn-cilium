# =============================================================================
# leaf3 - BORDER LEAF SR Linux | AS 65003 | system0 10.0.1.3
# Conecta o fabric ao roteador de borda FRR (border1, AS 65100) via e1-1.
# Link ponto-a-ponto numerado: 10.255.0.0/31 (leaf3 .0 / border1 .1)
# Recebe a rota default do FRR e a propaga para o fabric e para o cluster.
# =============================================================================
enter candidate

# ----------------------------------------------------------------- jumbo MTU
set / system mtu default-port-mtu 9232
set / system mtu default-l2-mtu 9232
set / system mtu default-ip-mtu 9194
set / system mtu min-path-mtu 9212

# ------------------------------------------- uplinks para os spines (numerados)
# DESVIO (P001-S003): links numerados /31 em vez de unnumbered (data plane de
# simulacao nao encaminha IPv4 em unnumbered). Ver P001-S003-results.md.
set / interface ethernet-1/49 admin-state enable
set / interface ethernet-1/49 description "to spine1"
set / interface ethernet-1/49 subinterface 0 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 address 10.255.5.1/31
set / interface ethernet-1/49 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv6 router-advertisement router-role admin-state enable
set / interface ethernet-1/50 admin-state enable
set / interface ethernet-1/50 description "to spine2"
set / interface ethernet-1/50 subinterface 0 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 address 10.255.6.1/31
set / interface ethernet-1/50 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv6 router-advertisement router-role admin-state enable

# ------------------------------------------------------------------- loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.1.3/32

# ----------------------------------------- link roteado (numerado) para o FRR
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to border1 (FRR)"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.255.0.0/31

# ----------------------------------------------------- network-instance default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/49.0
set / network-instance default interface ethernet-1/50.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface system0.0

# -------------------------------------------------------------------- policies
set / routing-policy policy all default-action policy-result accept

# ------------------------------------------------------------------------- BGP
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65003
set / network-instance default protocols bgp router-id 10.0.1.3

set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ibgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ebgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp afi-safi evpn admin-state enable

# --- underlay: eBGP numerado com os spines (desvio P001-S003) ---------------
set / network-instance default protocols bgp group spines admin-state enable
set / network-instance default protocols bgp group spines peer-as 65500
set / network-instance default protocols bgp group spines export-policy [ all ]
set / network-instance default protocols bgp group spines import-policy [ all ]
set / network-instance default protocols bgp group spines afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group spines afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group spines afi-safi evpn admin-state disable
set / network-instance default protocols bgp group spines timers hold-time 9
set / network-instance default protocols bgp group spines timers keepalive-interval 3
set / network-instance default protocols bgp neighbor 10.255.5.0 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.5.0 description "spine1"
set / network-instance default protocols bgp neighbor 10.255.5.0 peer-group spines
set / network-instance default protocols bgp neighbor 10.255.6.0 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.6.0 description "spine2"
set / network-instance default protocols bgp neighbor 10.255.6.0 peer-group spines

# --- eBGP com o roteador de borda FRR ---------------------------------------
set / network-instance default protocols bgp group border admin-state enable
set / network-instance default protocols bgp group border description "eBGP para border1 (FRR)"
set / network-instance default protocols bgp group border peer-as 65100
set / network-instance default protocols bgp group border export-policy [ all ]
set / network-instance default protocols bgp group border import-policy [ all ]
set / network-instance default protocols bgp group border afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group border afi-safi evpn admin-state disable
set / network-instance default protocols bgp group border timers hold-time 9
set / network-instance default protocols bgp group border timers keepalive-interval 3
set / network-instance default protocols bgp neighbor 10.255.0.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.0.1 description "border1 FRR"
set / network-instance default protocols bgp neighbor 10.255.0.1 peer-group border

commit now
