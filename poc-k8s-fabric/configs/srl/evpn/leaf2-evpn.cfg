# =============================================================================
# CENARIO C - leaf2: move o rack2 para a tenant VRF "k8s" com EVPN/VXLAN
# Aplicar POR CIMA da config base (leaf2.cfg):
#   docker exec -i clab-poc-k8s-fabric-leaf2 sr_cli < configs/srl/evpn/leaf2-evpn.cfg
#
# Resultado:
#   - underlay (network-instance default) segue igual: eBGP unnumbered + loopbacks
#   - overlay iBGP EVPN (AS 65000) com os spines como RR
#   - ip-vrf "k8s"   -> VNI 1000, EVI 1000, RT target:65000:1000  (L3 EVPN / IFL)
#   - mac-vrf rack2  -> VNI 102,  EVI 102,  RT target:65000:102
#   - irb1.2 vira anycast gateway (mesmo IP/MAC em qualquer leaf)
#   - o peering com o Cilium passa a viver DENTRO da VRF k8s
# =============================================================================
enter candidate

# --- 1) tira o IRB e o peering do Cilium da network-instance default ---------
delete / network-instance default interface irb1.2
delete / network-instance default protocols bgp neighbor 10.10.2.11
delete / network-instance default protocols bgp group rack2-k8s

# --- 2) overlay iBGP EVPN com os spines (RR) --------------------------------
set / network-instance default protocols bgp group overlay admin-state enable
set / network-instance default protocols bgp group overlay description "EVPN overlay"
set / network-instance default protocols bgp group overlay peer-as 65000
set / network-instance default protocols bgp group overlay local-as as-number 65000
set / network-instance default protocols bgp group overlay export-policy [ all ]
set / network-instance default protocols bgp group overlay import-policy [ all ]
set / network-instance default protocols bgp group overlay afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group overlay afi-safi evpn admin-state enable
set / network-instance default protocols bgp neighbor 10.0.0.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.0.1 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.1 transport local-address 10.0.1.2
set / network-instance default protocols bgp neighbor 10.0.0.2 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.0.2 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.2 transport local-address 10.0.1.2

# --- 3) tunel VXLAN: um vxlan-interface bridged (rack2) e um routed (ip-vrf) -
set / tunnel-interface vxlan1 vxlan-interface 102 type bridged
set / tunnel-interface vxlan1 vxlan-interface 102 ingress vni 102
set / tunnel-interface vxlan1 vxlan-interface 1000 type routed
set / tunnel-interface vxlan1 vxlan-interface 1000 ingress vni 1000

# --- 4) IRB como anycast gateway --------------------------------------------
set / interface irb1 subinterface 2 ipv4 address 10.10.2.1/24 anycast-gw true
set / interface irb1 subinterface 2 ipv4 address 10.10.2.1/24 primary
set / interface irb1 subinterface 2 anycast-gw virtual-router-id 2
set / interface irb1 subinterface 2 ipv4 arp evpn advertise dynamic
set / interface irb1 subinterface 2 ip-mtu 1500

# --- 5) mac-vrf rack2 com EVPN ----------------------------------------------
set / network-instance rack2 vxlan-interface vxlan1.102
set / network-instance rack2 protocols bgp-evpn bgp-instance 1 admin-state enable
set / network-instance rack2 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.102
set / network-instance rack2 protocols bgp-evpn bgp-instance 1 evi 102
set / network-instance rack2 protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance rack2 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:102
set / network-instance rack2 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:102

# --- 6) ip-vrf "k8s" (tenant do cluster) ------------------------------------
set / network-instance k8s type ip-vrf
set / network-instance k8s admin-state enable
set / network-instance k8s description "tenant VRF do cluster Kubernetes"
set / network-instance k8s interface irb1.2
set / network-instance k8s mtu path-mtu-discovery true
set / network-instance k8s protocols bgp-evpn bgp-instance 1 admin-state enable
set / network-instance k8s protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.1000
set / network-instance k8s protocols bgp-evpn bgp-instance 1 evi 1000
set / network-instance k8s protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance k8s protocols bgp-evpn bgp-instance 1 routes route-table mac-ip advertise-gateway-mac true
set / network-instance k8s protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:1000
set / network-instance k8s protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:1000

# --- 7) peering eBGP com o Cilium DENTRO da VRF -----------------------------
set / network-instance k8s protocols bgp admin-state enable
set / network-instance k8s protocols bgp autonomous-system 65002
set / network-instance k8s protocols bgp router-id 10.10.2.1
set / network-instance k8s protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance k8s protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true
set / network-instance k8s protocols bgp afi-safi ipv4-unicast multipath ibgp maximum-paths 64
set / network-instance k8s protocols bgp group rack2-k8s admin-state enable
set / network-instance k8s protocols bgp group rack2-k8s peer-as 65102
set / network-instance k8s protocols bgp group rack2-k8s export-policy [ all ]
set / network-instance k8s protocols bgp group rack2-k8s import-policy [ all ]
set / network-instance k8s protocols bgp group rack2-k8s afi-safi ipv4-unicast admin-state enable
set / network-instance k8s protocols bgp group rack2-k8s timers hold-time 9
set / network-instance k8s protocols bgp group rack2-k8s timers keepalive-interval 3
set / network-instance k8s protocols bgp group rack2-k8s graceful-restart admin-state enable
set / network-instance k8s protocols bgp neighbor 10.10.2.11 admin-state enable
set / network-instance k8s protocols bgp neighbor 10.10.2.11 peer-group rack2-k8s

