# =============================================================================
# CENARIO C - spine2 como Route Reflector do overlay EVPN
# Aplicar POR CIMA da config base:
#   docker exec -i clab-poc-k8s-fabric-spine2 sr_cli < configs/srl/evpn/spine2-rr.cfg
# Overlay iBGP: AS 65000 (local-as nos spines), clientes = loopbacks dos leaves
# =============================================================================
enter candidate

set / network-instance default protocols bgp group overlay admin-state enable
set / network-instance default protocols bgp group overlay description "EVPN overlay RR"
set / network-instance default protocols bgp group overlay peer-as 65000
set / network-instance default protocols bgp group overlay local-as as-number 65000
set / network-instance default protocols bgp group overlay export-policy [ all ]
set / network-instance default protocols bgp group overlay import-policy [ all ]
set / network-instance default protocols bgp group overlay afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group overlay afi-safi evpn admin-state enable
set / network-instance default protocols bgp group overlay route-reflector client true
set / network-instance default protocols bgp group overlay route-reflector cluster-id 10.0.0.2

set / network-instance default protocols bgp neighbor 10.0.1.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.1.1 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.1.1 transport local-address 10.0.0.2
set / network-instance default protocols bgp neighbor 10.0.1.2 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.1.2 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.1.2 transport local-address 10.0.0.2
set / network-instance default protocols bgp neighbor 10.0.1.3 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.1.3 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.1.3 transport local-address 10.0.0.2

commit now
