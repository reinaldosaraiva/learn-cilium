# =============================================================================
# OPCIONAL (recomendado para producao) - filtro de import vindo do cluster.
# A config base usa a policy permissiva "all" para facilitar o troubleshooting.
# Este snippet troca o import do grupo rack1-k8s por um filtro explicito:
# so PodCIDR (10.244.0.0/16) e VIPs (10.201.255.0/24) entram no fabric.
#
# ATENCAO: a sintaxe de prefix-set/match mudou entre versoes do SR Linux.
# Confirme no seu release com:  set / routing-policy policy X statement 10 match ?
# Aplicar em leaf1 (e o equivalente rack2-k8s em leaf2).
# =============================================================================
enter candidate

set / routing-policy prefix-set k8s-pods prefix 10.244.0.0/16 mask-length-range 24..32
set / routing-policy prefix-set k8s-vips prefix 10.201.255.0/24 mask-length-range 32..32

set / routing-policy policy k8s-import statement 10 match prefix-set k8s-pods
set / routing-policy policy k8s-import statement 10 action policy-result accept
set / routing-policy policy k8s-import statement 20 match prefix-set k8s-vips
set / routing-policy policy k8s-import statement 20 action policy-result accept
set / routing-policy policy k8s-import default-action policy-result reject

# exporta para o cluster apenas a rota default (o no nao precisa da tabela toda)
set / routing-policy prefix-set default-only prefix 0.0.0.0/0 mask-length-range 0..0
set / routing-policy policy k8s-export statement 10 match prefix-set default-only
set / routing-policy policy k8s-export statement 10 action policy-result accept
set / routing-policy policy k8s-export default-action policy-result reject

set / network-instance default protocols bgp group rack1-k8s import-policy [ k8s-import ]
set / network-instance default protocols bgp group rack1-k8s export-policy [ k8s-export ]

commit now
