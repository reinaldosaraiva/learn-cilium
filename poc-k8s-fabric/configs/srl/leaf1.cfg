# =============================================================================
# leaf1 - SR Linux | AS 65001 | system0 10.0.1.1 | rack1
# Sub-rede dos nos k8s do rack1: 10.10.1.0/24  (gateway 10.10.1.1 em irb1.1)
# Nos: node1 10.10.1.11 (e1-1), node2 10.10.1.12 (e1-2)
# Peering eBGP com o Cilium BGP Control Plane -> AS 65101
# =============================================================================
enter candidate

# ----------------------------------------------------------------- jumbo MTU
set / system mtu default-port-mtu 9232
set / system mtu default-l2-mtu 9232
set / system mtu default-ip-mtu 9194
set / system mtu min-path-mtu 9212

# ------------------------------------------- uplinks para os spines (numerados)
# DESVIO (P001-S003): links numerados /31 em vez de unnumbered (data plane de
# simulacao nao encaminha IPv4 em unnumbered). Ver P001-S003-results.md.
set / interface ethernet-1/49 admin-state enable
set / interface ethernet-1/49 description "to spine1"
set / interface ethernet-1/49 subinterface 0 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 address 10.255.1.1/31
set / interface ethernet-1/49 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv6 router-advertisement router-role admin-state enable
set / interface ethernet-1/50 admin-state enable
set / interface ethernet-1/50 description "to spine2"
set / interface ethernet-1/50 subinterface 0 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 address 10.255.2.1/31
set / interface ethernet-1/50 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv6 router-advertisement router-role admin-state enable

# ------------------------------------------------------------------- loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.1.1/32

# ---------------------------------------------- portas de acesso (nos do k8s)
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "node1"
set / interface ethernet-1/1 vlan-tagging false
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 type bridged
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "node2"
set / interface ethernet-1/2 vlan-tagging false
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 type bridged

# ---------------- IRB: gateway L3 do rack (vira anycast-gw no cenario EVPN) --
set / interface irb1 subinterface 1 admin-state enable
set / interface irb1 subinterface 1 ipv4 admin-state enable
set / interface irb1 subinterface 1 ipv4 address 10.10.1.1/24
set / interface irb1 subinterface 1 ipv4 arp learn-unsolicited true
set / interface irb1 subinterface 1 ipv4 arp host-route populate dynamic
# P002-S001 S3: dual-stack - prefixo IPv6 do rack1 (nos: fd00:10:1::11/12)
set / interface irb1 subinterface 1 ipv6 admin-state enable
set / interface irb1 subinterface 1 ipv6 address fd00:10:1::1/64
# MTU 1500: e o que a VPC da Magalu entrega (medido 2026-09-16, maxmtu 1500 na NIC).
# O underlay leaf-spine segue jumbo porque e veth dentro da VM e o VXLAN do
# cenario C precisa da folga de 50 bytes.
set / interface irb1 subinterface 1 ip-mtu 1500

# ----------------------------- mac-vrf do rack (dominio L2 dos nos do cluster)
set / network-instance rack1 type mac-vrf
set / network-instance rack1 admin-state enable
set / network-instance rack1 interface ethernet-1/1.0
set / network-instance rack1 interface ethernet-1/2.0
set / network-instance rack1 interface irb1.1
set / network-instance rack1 bridge-table mac-learning admin-state enable

# ----------------------------------------------------- network-instance default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/49.0
set / network-instance default interface ethernet-1/50.0
set / network-instance default interface system0.0
set / network-instance default interface irb1.1

# -------------------------------------------------------------------- policies
set / routing-policy policy all default-action policy-result accept

# ------------------------------------------------------------------------- BGP
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65001
set / network-instance default protocols bgp router-id 10.0.1.1

set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ibgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ebgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp afi-safi evpn admin-state enable

# --- underlay: eBGP numerado com os spines (desvio P001-S003) ---------------
set / network-instance default protocols bgp group spines admin-state enable
set / network-instance default protocols bgp group spines description "underlay eBGP para spines"
set / network-instance default protocols bgp group spines peer-as 65500
set / network-instance default protocols bgp group spines export-policy [ all ]
set / network-instance default protocols bgp group spines import-policy [ all ]
set / network-instance default protocols bgp group spines afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group spines afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group spines afi-safi evpn admin-state disable
set / network-instance default protocols bgp group spines timers hold-time 9
set / network-instance default protocols bgp group spines timers keepalive-interval 3
set / network-instance default protocols bgp neighbor 10.255.1.0 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.1.0 description "spine1"
set / network-instance default protocols bgp neighbor 10.255.1.0 peer-group spines
set / network-instance default protocols bgp neighbor 10.255.2.0 admin-state enable
set / network-instance default protocols bgp neighbor 10.255.2.0 description "spine2"
set / network-instance default protocols bgp neighbor 10.255.2.0 peer-group spines

# --- peering com o Cilium BGP Control Plane (um neighbor por no) -------------
set / network-instance default protocols bgp group rack1-k8s admin-state enable
set / network-instance default protocols bgp group rack1-k8s description "Cilium BGP Control Plane - rack1"
set / network-instance default protocols bgp group rack1-k8s peer-as 65101
set / network-instance default protocols bgp group rack1-k8s export-policy [ all ]
set / network-instance default protocols bgp group rack1-k8s import-policy [ all ]
set / network-instance default protocols bgp group rack1-k8s afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group rack1-k8s afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group rack1-k8s afi-safi evpn admin-state disable
set / network-instance default protocols bgp group rack1-k8s timers hold-time 9
set / network-instance default protocols bgp group rack1-k8s timers keepalive-interval 3
set / network-instance default protocols bgp group rack1-k8s graceful-restart admin-state enable

set / network-instance default protocols bgp neighbor 10.10.1.11 admin-state enable
set / network-instance default protocols bgp neighbor 10.10.1.11 description "node1"
set / network-instance default protocols bgp neighbor 10.10.1.11 peer-group rack1-k8s
set / network-instance default protocols bgp neighbor 10.10.1.12 admin-state enable
set / network-instance default protocols bgp neighbor 10.10.1.12 description "node2"
set / network-instance default protocols bgp neighbor 10.10.1.12 peer-group rack1-k8s

commit now
