! =============================================================================
! border1 - roteador de borda FRR | AS 65100
! Papel na PoC:
!   - origina a rota default (0.0.0.0/0) para o fabric SR Linux
!   - anuncia a rede "externa" 203.0.113.0/24 (onde vive o client-ext)
!   - recebe do fabric os PodCIDRs (10.244.0.0/16) e os VIPs (10.201.255.0/24)
!     com ECMP, provando o caminho fim-a-fim externo -> servico do Kubernetes
! =============================================================================
frr defaults datacenter
hostname border1
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.254/32
!
interface eth1
 description to-leaf3
 ip address 10.255.0.1/31
 mtu 9216
!
interface eth2
 description to-client-ext
 ip address 203.0.113.1/24
 ipv6 address fd00:203:113::1/64
 mtu 1500
!
! CAMINHO B+ : porta para o netns do host da vm-cilium.
! O host roteia entre a VNIC da VPC (ens3) e este /30.
interface eth3
 description to-host-vm-cilium
 ip address 10.100.0.2/30
 mtu 1500
!
! caminho de volta para a VPC: tudo que for 172.18.0.0/16 sai pelo host
ip route 172.18.0.0/16 10.100.0.1
!
ip prefix-list PL-FROM-FABRIC seq 10 permit 10.244.0.0/16 le 32
ip prefix-list PL-FROM-FABRIC seq 20 permit 10.201.255.0/24 le 32
ip prefix-list PL-FROM-FABRIC seq 30 permit 10.10.0.0/16 le 24
ip prefix-list PL-FROM-FABRIC seq 40 permit 10.0.0.0/16 le 32
!
ip prefix-list PL-TO-FABRIC seq 10 permit 0.0.0.0/0
ip prefix-list PL-TO-FABRIC seq 20 permit 203.0.113.0/24
ip prefix-list PL-TO-FABRIC seq 30 permit 172.18.0.0/16
!
route-map RM-FROM-FABRIC permit 10
 match ip address prefix-list PL-FROM-FABRIC
!
route-map RM-TO-FABRIC permit 10
 match ip address prefix-list PL-TO-FABRIC
!
! P002-S001 S3: dual-stack - PodCIDR IPv6 (fd13::/48) e VIP IPv6 (fd14::/64)
ipv6 prefix-list PL6-FROM-FABRIC seq 10 permit fd13::/48 le 128
ipv6 prefix-list PL6-FROM-FABRIC seq 20 permit fd14::/64 le 128
ipv6 prefix-list PL6-FROM-FABRIC seq 30 permit fd00:10::/32 le 64
ipv6 prefix-list PL6-FROM-FABRIC seq 40 permit fd00:100::/32 le 128
!
ipv6 prefix-list PL6-TO-FABRIC seq 10 permit fd00:203:113::/64
!
route-map RM6-FROM-FABRIC permit 10
 match ipv6 address prefix-list PL6-FROM-FABRIC
!
route-map RM6-TO-FABRIC permit 10
 match ipv6 address prefix-list PL6-TO-FABRIC
!
router bgp 65100
 bgp router-id 10.0.1.254
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.255.0.0 remote-as 65003
 neighbor 10.255.0.0 description leaf3-border
 neighbor 10.255.0.0 timers 3 9
 neighbor 10.255.0.0 bfd
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 172.18.0.0/16          ! VPC da Magalu, via host da vm-cilium
  maximum-paths 16
  neighbor 10.255.0.0 activate
  neighbor 10.255.0.0 soft-reconfiguration inbound
  neighbor 10.255.0.0 default-originate
  neighbor 10.255.0.0 route-map RM-FROM-FABRIC in
  neighbor 10.255.0.0 route-map RM-TO-FABRIC out
 exit-address-family
!
 address-family ipv6 unicast
  network fd00:203:113::/64
  maximum-paths 16
  neighbor 10.255.0.0 activate
  neighbor 10.255.0.0 route-map RM6-FROM-FABRIC in
  neighbor 10.255.0.0 route-map RM6-TO-FABRIC out
 exit-address-family
!
line vty
!
