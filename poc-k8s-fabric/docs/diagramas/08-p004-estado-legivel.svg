<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="150.857mm" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">P004: checkpoint das sessões S001 a S008</title>
<desc id="desc">Resumo visual de registros históricos das sessões P004. Os rótulos PASS, gates, valores e limitações permanecem descrições daquele checkpoint, não disponibilidade atual; as 41 inscrições originais são transcritas junto da figura no guia.</desc>
