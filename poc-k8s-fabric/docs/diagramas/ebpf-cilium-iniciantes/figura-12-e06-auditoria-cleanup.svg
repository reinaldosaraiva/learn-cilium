<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Recibo local e limpeza guardada</title>
<desc id="desc">A sequência registra intenção, revisão, hashes, UTC, comando e código de saída, esperado e observado e conclusão limitada. Antes da limpeza, confere de novo endpoint do API server, UIDs e run-id, apaga apenas o namespace próprio e espera a remoção. Um recibo local é distinto do audit log produzido pelo API server se estiver configurado.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">E06 · registrar evidência e limpar com cuidado</text>
<rect x="55" y="125" width="610" height="470" rx="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="95" y="180" font-family="Arial" font-size="35" font-weight="700" fill="#1e3a8a">Recibo local do exercício</text><rect x="95" y="215" width="530" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="125" y="265" font-family="Arial" font-size="30" fill="#0f172a">1 · revisão + hashes dos manifests</text><path d="M360 295 L360 325" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="335" width="530" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="125" y="385" font-family="Arial" font-size="29" fill="#0f172a">2 · UTC + comando + exit code</text><path d="M360 415 L360 445" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="455" width="530" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="125" y="505" font-family="Arial" font-size="29" fill="#0f172a">3 · esperado / observado / limite</text><text x="95" y="565" font-family="Arial" font-size="28" font-weight="700" fill="#7f1d1d">Não prova autoria nem audit log</text>
<rect x="735" y="125" width="610" height="470" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="775" y="180" font-family="Arial" font-size="35" font-weight="700" fill="#7c2d12">Limpeza da namespace própria</text><rect x="775" y="215" width="530" height="78" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="805" y="265" font-family="Arial" font-size="28" fill="#0f172a">4 · conferir API, UIDs e run-id</text><path d="M1040 295 L1040 325" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="775" y="335" width="530" height="78" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="805" y="385" font-family="Arial" font-size="29" fill="#0f172a">5 · apagar namespace nomeada</text><path d="M1040 415 L1040 445" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="775" y="455" width="530" height="78" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="805" y="505" font-family="Arial" font-size="29" fill="#0f172a">6 · esperar remoção normal</text><text x="775" y="565" font-family="Arial" font-size="28" font-weight="700" fill="#7f1d1d">Divergência ou timeout: parar, sem force</text>
<rect x="55" y="635" width="610" height="105" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="90" y="680" font-family="Arial" font-size="29" font-weight="700" fill="#14532d">Audit log Kubernetes</text><text x="90" y="720" font-family="Arial" font-size="28" fill="#0f172a">eventos do API server, se configurado</text><rect x="735" y="635" width="610" height="105" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><text x="775" y="680" font-family="Arial" font-size="29" font-weight="700" fill="#0f172a">São evidências diferentes</text><text x="775" y="720" font-family="Arial" font-size="28" fill="#334155">recibo local não substitui auditoria</text>
</svg>
