<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Lugares de execução e kernel compartilhado</title>
<desc id="desc">O computador pessoal contém uma VM Linux autorizada com terminal, Bash, cliente kubectl e kernel Linux da VM. Uma caixa separada representa o API server que recebe a chamada. No nó Linux do cluster, o Pod frontend contém o processo curl executado depois de dois hifens; namespaces isolam uma visão e cgroups organizam recursos. A seta liga a chamada da VM ao processo remoto, que usa o kernel do nó.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="64" font-family="Arial,DejaVu Sans,sans-serif" font-size="44" font-weight="700" fill="#0f172a">Onde cada processo roda</text>
<rect x="50" y="115" width="400" height="585" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="80" y="165" font-family="Arial" font-size="35" font-weight="700" fill="#1e3a8a">Computador pessoal</text><text x="80" y="210" font-family="Arial" font-size="30" fill="#0f172a">host: macOS ou Windows</text>
<rect x="85" y="250" width="330" height="390" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><text x="130" y="298" font-family="Arial" font-size="31" font-weight="700" fill="#1e3a8a">VM Linux</text><text x="130" y="332" font-family="Arial" font-size="31" font-weight="700" fill="#1e3a8a">autorizada</text><rect x="115" y="350" width="270" height="115" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="140" y="396" font-family="Arial" font-size="31" fill="#0f172a">Terminal + Bash</text><text x="140" y="440" font-family="Arial" font-size="31" font-weight="700" fill="#0f172a">kubectl client</text><rect x="115" y="500" width="270" height="85" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="145" y="535" font-family="Arial" font-size="28" fill="#0f172a">kernel Linux</text><text x="145" y="571" font-family="Arial" font-size="28" fill="#0f172a">da VM</text>
<rect x="520" y="355" width="230" height="130" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="555" y="410" font-family="Arial" font-size="34" font-weight="700" fill="#7c2d12">API server</text><text x="550" y="450" font-family="Arial" font-size="28" fill="#0f172a">recebe a</text><text x="550" y="478" font-family="Arial" font-size="28" fill="#0f172a">chamada</text>
<path d="M420 400 L510 400" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><text x="425" y="375" font-family="Arial" font-size="28" fill="#0f172a">API</text>
<rect x="825" y="115" width="525" height="585" rx="24" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/><text x="860" y="165" font-family="Arial" font-size="35" font-weight="700" fill="#14532d">Nó Linux do cluster</text><rect x="870" y="205" width="435" height="280" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="905" y="255" font-family="Arial" font-size="34" font-weight="700" fill="#14532d">Pod frontend</text><rect x="905" y="280" width="365" height="110" rx="15" fill="#ffffff" stroke="#166534" stroke-width="3"/><text x="940" y="327" font-family="Arial" font-size="31" fill="#0f172a">contêiner curl</text><text x="940" y="370" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">comando depois de --</text><text x="905" y="445" font-family="Arial" font-size="29" fill="#14532d">namespace: visão isolada</text><rect x="870" y="535" width="435" height="100" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="910" y="580" font-family="Arial" font-size="31" font-weight="700" fill="#0f172a">kernel Linux do nó</text><text x="910" y="618" font-family="Arial" font-size="28" fill="#334155">cgroups: recursos por grupo</text>
<path d="M750 420 L860 420" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><text x="765" y="390" font-family="Arial" font-size="28" fill="#0f172a">exec</text>
<text x="55" y="755" font-family="Arial" font-size="29" font-weight="700" fill="#0f172a">O processo remoto usa o kernel do nó, não o kernel da VM cliente.</text>
</svg>
