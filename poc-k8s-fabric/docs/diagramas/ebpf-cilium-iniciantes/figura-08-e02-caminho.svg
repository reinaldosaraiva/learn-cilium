<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Comparação de caminho via proxy e direto</title>
<desc id="desc">Dois caminhos partem do frontend. No caminho A pela API, uma frase informa que a resposta retorna pelos mesmos trechos, e uma caixa mostra o cabeçalho X-Lab-Route: via-api-proxy. No caminho B direto ao backend, uma seta tracejada rotulada resposta direta volta ao frontend; essa resposta não contém o header X-Lab-Route.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker><marker id="back" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#64748b"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">E02 · dois caminhos, duas evidências</text>
<text x="55" y="125" font-family="Arial" font-size="33" font-weight="700" fill="#14532d">CAMINHO A · via API</text>
<rect x="55" y="150" width="215" height="145" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="95" y="202" font-family="Arial" font-size="32" font-weight="700" fill="#1e3a8a">frontend</text><text x="90" y="250" font-family="Arial" font-size="29" fill="#0f172a">curl manual</text><path d="M275 220 L315 220" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="325" y="150" width="195" height="145" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="360" y="202" font-family="Arial" font-size="29" fill="#0f172a">Service api</text><text x="365" y="250" font-family="Arial" font-size="28" fill="#334155">porta 80</text><path d="M525 220 L555 220" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="565" y="150" width="220" height="145" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="605" y="202" font-family="Arial" font-size="30" fill="#0f172a">Pod api</text><text x="600" y="250" font-family="Arial" font-size="28" fill="#334155">NGINX :8080</text><path d="M790 220 L820 220" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="830" y="150" width="230" height="145" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="865" y="202" font-family="Arial" font-size="28" fill="#0f172a">Service</text><text x="865" y="250" font-family="Arial" font-size="28" fill="#334155">backend :80</text><path d="M1065 220 L1095 220" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1105" y="150" width="240" height="145" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1135" y="202" font-family="Arial" font-size="28" fill="#0f172a">Pod backend</text><text x="1135" y="250" font-family="Arial" font-size="28" fill="#334155">BusyBox :8080</text>
<rect x="455" y="325" width="590" height="65" rx="14" fill="#ffffff" stroke="#475569" stroke-width="3"/><text x="490" y="368" font-family="Arial" font-size="29" font-weight="700" fill="#0f172a">X-Lab-Route: via-api-proxy</text><text x="415" y="430" font-family="Arial" font-size="28" fill="#334155">A resposta retorna pelos trechos da mesma cadeia.</text>
<text x="55" y="495" font-family="Arial" font-size="33" font-weight="700" fill="#7c2d12">CAMINHO B · direto ao backend</text>
<rect x="55" y="520" width="215" height="110" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="95" y="563" font-family="Arial" font-size="31" font-weight="700" fill="#1e3a8a">frontend</text><text x="90" y="605" font-family="Arial" font-size="28" fill="#0f172a">curl manual</text><path d="M275 575 L325 575" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="335" y="520" width="260" height="110" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="375" y="563" font-family="Arial" font-size="29" fill="#0f172a">Service backend</text><text x="400" y="605" font-family="Arial" font-size="28" fill="#334155">porta 80</text><path d="M600 575 L650 575" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="520" width="300" height="110" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="700" y="563" font-family="Arial" font-size="30" fill="#0f172a">Pod backend</text><text x="700" y="605" font-family="Arial" font-size="28" fill="#334155">BusyBox :8080</text>
<rect x="1000" y="510" width="345" height="130" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><text x="1025" y="550" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">resposta direta</text><text x="1025" y="590" font-family="Arial" font-size="28" fill="#334155">sem header</text><text x="1025" y="625" font-family="Arial" font-size="28" fill="#334155">X-Lab-Route</text>
<path d="M960 650 C850 720 350 720 170 650" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#back)"/><text x="585" y="680" font-family="Arial" font-size="28" fill="#334155">resposta direta</text>
</svg>
