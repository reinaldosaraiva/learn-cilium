<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img" aria-labelledby="title desc">
<title id="title">Nome, rede e conversa de aplicação</title>
<desc id="desc">Quatro painéis: A separa enlace, IP, TCP e HTTP; B mostra o exemplo CIDR 10.20.0.0/24 e seus 24 bits de prefixo; C liga o nome DNS api ao Service na porta 80 e targetPort 8080. D mostra o tempo descendo entre A, cliente, e B, servidor: SYN A para B, SYN-ACK B para A e ACK A para B abrem TCP; no fechamento normal FIN A para B encerra o envio de A, ACK B para A confirma, FIN B para A encerra o envio de B e ACK A para B confirma. Um painel separado mostra RST A para B como interrupção alternativa, não como etapa após FIN. Modelo didático, não captura.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#334155"/></marker><marker id="tcp-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#334155"/></marker></defs><rect width="1400" height="1360" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">Uma conversa tem camadas e etapas</text>
<rect x="45" y="105" width="400" height="320" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="75" y="155" font-family="Arial" font-size="36" font-weight="700" fill="#1e3a8a">A · pacote</text><rect x="82" y="185" width="325" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="105" y="222" font-family="Arial" font-size="29" fill="#0f172a">enlace: quadro local</text><rect x="82" y="247" width="325" height="52" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="105" y="284" font-family="Arial" font-size="29" fill="#0f172a">IP: origem → destino</text><rect x="82" y="309" width="325" height="52" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="105" y="346" font-family="Arial" font-size="29" fill="#0f172a">TCP: portas e controle</text><rect x="82" y="371" width="325" height="40" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="105" y="401" font-family="Arial" font-size="28" fill="#0f172a">HTTP: pedido/dados</text>
<rect x="470" y="105" width="300" height="320" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/><text x="500" y="155" font-family="Arial" font-size="36" font-weight="700" fill="#14532d">B · CIDR</text><text x="500" y="225" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">10.20.0.0/24</text><rect x="500" y="250" width="240" height="52" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="520" y="286" font-family="Arial" font-size="29" fill="#0f172a">24 bits de prefixo</text><text x="500" y="345" font-family="Arial" font-size="29" fill="#0f172a">/24 ≠ porta</text><text x="500" y="388" font-family="Arial" font-size="29" fill="#0f172a">exemplo ilustrativo</text>
<rect x="795" y="105" width="560" height="320" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="825" y="155" font-family="Arial" font-size="36" font-weight="700" fill="#7c2d12">C · nome e porta</text><rect x="820" y="195" width="210" height="95" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><text x="845" y="237" font-family="Arial" font-size="30" fill="#0f172a">nome DNS</text><text x="845" y="274" font-family="Arial" font-size="29" fill="#0f172a">api</text><path d="M1038 242 L1064 242" stroke="#334155" stroke-width="4" marker-end="url(#small-arrow)"/><rect x="1070" y="195" width="240" height="95" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="1090" y="237" font-family="Arial" font-size="30" fill="#0f172a">Service :80</text><text x="1090" y="274" font-family="Arial" font-size="29" fill="#0f172a">targetPort :8080</text><text x="835" y="350" font-family="Arial" font-size="29" fill="#0f172a">DNS dá um nome/endereço;</text><text x="835" y="390" font-family="Arial" font-size="29" fill="#0f172a">o Service encaminha a conexão.</text>
<rect x="45" y="465" width="1310" height="870" rx="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><text x="75" y="515" font-family="Arial" font-size="36" font-weight="700" fill="#0f172a">D · sequência TCP (tempo ↓)</text>
<rect x="75" y="540" width="1250" height="225" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/><text x="100" y="578" font-family="Arial" font-size="31" font-weight="700" fill="#1e3a8a">Abertura</text><text x="230" y="620" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">A · cliente</text><text x="1035" y="620" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">B · servidor</text><path d="M280 630 L280 750 M1120 630 L1120 750" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8"/><path d="M300 650 L1100 650" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="650" y="640" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">SYN</text><path d="M1100 696 L300 696" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="610" y="686" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">SYN-ACK</text><path d="M300 742 L1100 742" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="650" y="732" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">ACK</text>
<rect x="75" y="775" width="1250" height="300" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="100" y="814" font-family="Arial" font-size="31" font-weight="700" fill="#7c2d12">Fechamento normal por direção</text><text x="230" y="858" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">A · cliente</text><text x="1035" y="858" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">B · servidor</text><path d="M280 870 L280 1054 M1120 870 L1120 1054" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8"/><path d="M300 900 L1100 900" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="640" y="890" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">FIN</text><path d="M1100 948 L300 948" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="640" y="938" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">ACK</text><path d="M1100 996 L300 996" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="640" y="986" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">FIN</text><path d="M300 1044 L1100 1044" stroke="#334155" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="640" y="1034" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">ACK</text>
<rect x="75" y="1085" width="1250" height="190" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/><text x="100" y="1128" font-family="Arial" font-size="31" font-weight="700" fill="#7f1d1d">Interrupção alternativa</text><text x="230" y="1167" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">A · cliente</text><text x="1035" y="1167" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">B · servidor</text><path d="M280 1177 L280 1240 M1120 1177 L1120 1240" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8"/><path d="M300 1205 L1100 1205" stroke="#b91c1c" stroke-width="3" marker-end="url(#tcp-arrow)"/><text x="640" y="1195" font-family="Arial" font-size="30" font-weight="700" fill="#7f1d1d">RST</text><text x="100" y="1260" font-family="Arial" font-size="30" fill="#0f172a">Interrompe; não vem depois do fechamento normal.</text><text x="100" y="1320" font-family="Arial" font-size="30" fill="#334155">Setas mostram direção · modelo didático, não captura</text>
</svg>
