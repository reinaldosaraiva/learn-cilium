<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Policies de ingresso e contraprova</title>
<desc id="desc">Fluxo com três Pods. Setas sólidas mostram frontend para Pod api, onde a policy permite ingresso TCP 8080 de app=frontend, e Pod api para Pod backend, onde a policy permite ingresso TCP 8080 de app=api. Uma seta vermelha tracejada mostra a tentativa direta frontend para backend sem regra de ingresso. A caixa inferior reúne a resposta positiva via API e a contraprova recente por flow/verdict. Egress fica livre neste recorte, e policies aplicáveis são aditivas.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">E04 · regras de ingresso selecionam destinos</text>
<rect x="55" y="145" width="300" height="180" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="95" y="200" font-family="Arial" font-size="34" font-weight="700" fill="#1e3a8a">frontend</text><text x="95" y="250" font-family="Arial" font-size="29" fill="#0f172a">app=frontend</text><text x="95" y="295" font-family="Arial" font-size="28" fill="#334155">cliente curl</text>
<rect x="550" y="145" width="320" height="180" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="590" y="200" font-family="Arial" font-size="34" font-weight="700" fill="#7c2d12">Pod api</text><text x="590" y="250" font-family="Arial" font-size="28" fill="#0f172a">from app=frontend</text><text x="590" y="295" font-family="Arial" font-size="28" fill="#0f172a">Ingress TCP/8080</text>
<rect x="1045" y="145" width="300" height="180" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/><text x="1085" y="200" font-family="Arial" font-size="34" font-weight="700" fill="#14532d">Pod backend</text><text x="1085" y="250" font-family="Arial" font-size="28" fill="#0f172a">from app=api</text><text x="1085" y="295" font-family="Arial" font-size="28" fill="#0f172a">Ingress TCP/8080</text>
<path d="M360 215 L540 215" stroke="#15803d" stroke-width="7" marker-end="url(#arrow)"/><text x="380" y="185" font-family="Arial" font-size="28" font-weight="700" fill="#14532d">permitido</text><path d="M875 215 L1035 215" stroke="#15803d" stroke-width="7" marker-end="url(#arrow)"/><text x="895" y="185" font-family="Arial" font-size="28" font-weight="700" fill="#14532d">permitido</text>
<path d="M200 335 C300 465 1100 465 1195 335" fill="none" stroke="#b91c1c" stroke-width="6" stroke-dasharray="15 10" marker-end="url(#arrow)"/><rect x="365" y="365" width="670" height="100" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="410" y="408" font-family="Arial" font-size="28" font-weight="700" fill="#7f1d1d">direto frontend → backend:</text><text x="410" y="447" font-family="Arial" font-size="28" font-weight="700" fill="#7f1d1d">sem regra de ingresso</text>
<rect x="55" y="525" width="1290" height="210" rx="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><text x="90" y="575" font-family="Arial" font-size="33" font-weight="700" fill="#0f172a">Contraprovas</text><rect x="90" y="600" width="520" height="85" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="125" y="635" font-family="Arial" font-size="28" font-weight="700" fill="#14532d">API segue HTTP 200</text><text x="125" y="672" font-family="Arial" font-size="28" fill="#0f172a">pedido novo pelo proxy</text><rect x="635" y="600" width="665" height="85" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="670" y="635" font-family="Arial" font-size="28" font-weight="700" fill="#7c2d12">Direto precisa de flow/verdict recente</text><text x="670" y="672" font-family="Arial" font-size="28" fill="#0f172a">destino + horário correlacionados</text><text x="90" y="720" font-family="Arial" font-size="28" fill="#334155">Egress livre neste recorte; policies aplicáveis são aditivas.</text>
</svg>
