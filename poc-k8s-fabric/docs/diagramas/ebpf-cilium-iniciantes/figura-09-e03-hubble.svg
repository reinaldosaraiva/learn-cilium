<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Janela curta de observação Hubble</title>
<desc id="desc">Linha do tempo com T0 UTC, T+request e T+2 min. Terminal A anota UTC, faz dois pedidos manuais e consulta Hubble; Terminal B mantém o port-forward ao Relay em TLS verificado ou plaintext loopback autorizado, e Ctrl-C aparece somente nessa janela. A faixa inferior reúne UTC e namespace, origem e destino, protocolo e verdict; um aviso diz que payload completo e audit log do API server não são mostrados.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">E03 · observar poucos fluxos em uma janela</text>
<line x1="155" y1="170" x2="1240" y2="170" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><circle cx="230" cy="170" r="25" fill="#1d4ed8"/><circle cx="720" cy="170" r="25" fill="#c2410c"/><circle cx="1170" cy="170" r="25" fill="#15803d"/><text x="145" y="130" font-family="Arial" font-size="31" font-weight="700" fill="#1e3a8a">T0 · UTC</text><text x="580" y="130" font-family="Arial" font-size="31" font-weight="700" fill="#7c2d12">T+request</text><text x="1040" y="130" font-family="Arial" font-size="31" font-weight="700" fill="#14532d">T+2 min</text>
<rect x="55" y="230" width="360" height="260" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="90" y="285" font-family="Arial" font-size="34" font-weight="700" fill="#1e3a8a">Terminal A · VM</text><text x="90" y="345" font-family="Arial" font-size="29" fill="#0f172a">anotar UTC</text><text x="90" y="390" font-family="Arial" font-size="29" fill="#0f172a">2 requests manuais</text><text x="90" y="440" font-family="Arial" font-size="29" fill="#0f172a">hubble observe</text>
<rect x="520" y="230" width="360" height="260" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="555" y="285" font-family="Arial" font-size="34" font-weight="700" fill="#7c2d12">Terminal B · VM</text><text x="555" y="345" font-family="Arial" font-size="28" fill="#0f172a">port-forward ao Relay</text><text x="555" y="385" font-family="Arial" font-size="28" fill="#0f172a">TLS verificado ou</text><text x="555" y="425" font-family="Arial" font-size="28" fill="#0f172a">plaintext loopback</text><text x="555" y="465" font-family="Arial" font-size="29" font-weight="700" fill="#0f172a">Ctrl-C só aqui</text>
<rect x="985" y="230" width="360" height="260" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/><text x="1020" y="285" font-family="Arial" font-size="34" font-weight="700" fill="#14532d">Relay / Hubble</text><text x="1020" y="345" font-family="Arial" font-size="28" fill="#0f172a">filtro: namespace</text><text x="1020" y="390" font-family="Arial" font-size="28" fill="#0f172a">janela: 2 minutos</text><text x="1020" y="440" font-family="Arial" font-size="28" fill="#334155">flow e verdict</text>
<path d="M415 360 L510 360" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><path d="M880 360 L975 360" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="55" y="545" width="1290" height="185" rx="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><text x="90" y="595" font-family="Arial" font-size="33" font-weight="700" fill="#0f172a">Anote e correlacione</text><rect x="90" y="625" width="260" height="65" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="110" y="668" font-family="Arial" font-size="28" fill="#0f172a">UTC + namespace</text><rect x="365" y="625" width="250" height="65" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="385" y="668" font-family="Arial" font-size="28" fill="#0f172a">origem + destino</text><rect x="640" y="625" width="250" height="65" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="660" y="668" font-family="Arial" font-size="28" fill="#0f172a">proto + verdict</text><text x="930" y="650" font-family="Arial" font-size="28" fill="#7f1d1d">Não prova payload completo</text><text x="930" y="690" font-family="Arial" font-size="28" fill="#7f1d1d">nem audit log do API server</text>
</svg>
