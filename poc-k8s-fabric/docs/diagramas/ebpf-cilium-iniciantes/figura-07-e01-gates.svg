<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Gates de admissão do E01</title>
<desc id="desc">Quatro etapas em sequência: VM Linux autorizada e revisão conferida; reserva, Cilium/Hubble, baseline e policies confirmadas; contexto, API server, UIDs, versão e memória conferem; namespace com run-id ainda não existe. Setas SIM ligam a etapa 3 à 4 e a etapa 4 à criação da namespace, que guarda UID e run-id. Uma caixa vermelha separada é um aviso geral para parar e chamar o instrutor se algum item for desconhecido.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">E01 · conferir antes de criar recursos</text>
<rect x="55" y="105" width="1290" height="105" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><circle cx="105" cy="157" r="31" fill="#1d4ed8"/><text x="95" y="169" font-family="Arial" font-size="31" font-weight="700" fill="#ffffff">1</text><text x="160" y="148" font-family="Arial" font-size="33" font-weight="700" fill="#0f172a">VM Linux autorizada + mesma revisão de guia e manifests</text><text x="160" y="188" font-family="Arial" font-size="29" fill="#334155">kubeconfig e arquivos foram fornecidos pelo instrutor</text>
<path d="M700 215 L700 245" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="55" y="255" width="1290" height="105" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/><circle cx="105" cy="307" r="31" fill="#15803d"/><text x="95" y="319" font-family="Arial" font-size="31" font-weight="700" fill="#ffffff">2</text><text x="160" y="298" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Reserva exclusiva; Cilium/Hubble prontos; baseline e policies confirmadas</text><text x="160" y="338" font-family="Arial" font-size="28" fill="#334155">o instrutor confirma os recursos protegidos no contexto correto</text>
<path d="M700 365 L700 395" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="55" y="405" width="1290" height="105" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><circle cx="105" cy="457" r="31" fill="#c2410c"/><text x="95" y="469" font-family="Arial" font-size="31" font-weight="700" fill="#ffffff">3</text><text x="160" y="448" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Contexto, API server, UIDs, versão e MemAvailable conferem</text><text x="160" y="488" font-family="Arial" font-size="28" fill="#334155">uma divergência encerra E01 antes de qualquer objeto</text>
<path d="M700 515 L700 530 L650 530 L650 545" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><text x="710" y="540" font-family="Arial" font-size="28" font-weight="700" fill="#14532d">SIM</text>
<rect x="55" y="555" width="600" height="105" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="4"/><circle cx="105" cy="607" r="31" fill="#475569"/><text x="95" y="619" font-family="Arial" font-size="31" font-weight="700" fill="#ffffff">4</text><text x="160" y="598" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Namespace com run-id</text><text x="160" y="638" font-family="Arial" font-size="28" fill="#334155">ainda não existe</text>
<path d="M660 607 L725 607" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><text x="670" y="590" font-family="Arial" font-size="28" font-weight="700" fill="#14532d">SIM</text><rect x="735" y="555" width="610" height="105" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="785" y="600" font-family="Arial" font-size="32" font-weight="700" fill="#14532d">CREATE · namespace nova</text><text x="785" y="640" font-family="Arial" font-size="28" fill="#0f172a">guardar UID devolvido + run-id</text>
<rect x="180" y="690" width="1040" height="70" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="225" y="736" font-family="Arial" font-size="31" font-weight="700" fill="#7f1d1d">Qualquer item desconhecido: PARE e chame o instrutor</text>
</svg>
