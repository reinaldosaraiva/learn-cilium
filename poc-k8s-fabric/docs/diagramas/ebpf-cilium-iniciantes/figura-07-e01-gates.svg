<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="103mm" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">E01: gates antes da namespace da prática</title>
<desc id="desc">A pessoa estudante usa uma cópia completa coerente, passa preflight, up, status e verify, registra uma identidade com lab-session, captura lab-env, confirma que a namespace ainda não existe e a cria em E01. Erro, consulta inconclusiva ou gate recusado leva a parar e preservar o estado.</desc>
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
    <path d="M0,0 L14,7 L0,14 z" fill="#1f2937"/>
  </marker>
  <marker id="gapArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto">
    <path d="M0,0 L18,9 L0,18 z" fill="#1f2937"/>
  </marker>
</defs>
<rect width="1400" height="800" fill="#ffffff"/>
<text x="60" y="66" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827">E01 · preparar antes de criar objetos</text>
<text x="60" y="112" font-family="Arial, sans-serif" font-size="30" fill="#1f2937">Ubuntu 24.04 limpa · clone Git do repositório · conta não-root com sudo</text>

<rect x="60" y="155" width="590" height="170" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="4"/>
<circle cx="108" cy="205" r="32" fill="#111827"/>
<text x="99" y="217" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">1</text>
<text x="160" y="209" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Mesmo clone do repositório</text>
<text x="92" y="260" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">livro + manifests + Makefiles + automação</text>
<text x="92" y="299" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">git rev-parse HEAD e hashes locais</text>

<path d="M665 240 L725 240" stroke="#1f2937" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="750" y="155" width="590" height="170" rx="18" fill="#eef2ff" stroke="#1d4ed8" stroke-width="4"/>
<circle cx="798" cy="205" r="32" fill="#1d4ed8"/>
<text x="789" y="217" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">2</text>
<text x="850" y="209" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Preflight próprio</text>
<text x="782" y="260" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">capacidade, dependências, colisões</text>
<text x="782" y="299" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">consulta falha ou gate recusa → parar</text>

<path d="M1045 335 L1045 390" stroke="#1f2937" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="750" y="405" width="590" height="170" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="4"/>
<circle cx="798" cy="455" r="32" fill="#047857"/>
<text x="789" y="467" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">3</text>
<text x="850" y="459" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Criar e verificar perfil</text>
<text x="782" y="510" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">lab-up → lab-status → lab-verify</text>
<text x="782" y="549" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">estado e UIDs vêm do perfil próprio</text>

<path d="M735 490 L675 490" stroke="#1f2937" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="60" y="405" width="590" height="195" rx="18" fill="#fff7ed" stroke="#9a3412" stroke-width="4"/>
<circle cx="108" cy="455" r="32" fill="#9a3412"/>
<text x="99" y="467" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">4</text>
<text x="160" y="459" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Sessão e ambiente</text>
<text x="92" y="510" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">lab-session registra LAB_RUN_ID</text>
<text x="92" y="548" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">lab-env carrega valores locais</text>
<text x="92" y="586" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">namespace ainda ausente</text>

<path d="M350 606 L350 638" stroke="#1f2937" stroke-width="5" marker-end="url(#gapArrow)"/>
<rect x="60" y="650" width="1280" height="92" rx="16" fill="#fef2f2" stroke="#991b1b" stroke-width="4"/>
<text x="92" y="690" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7f1d1d">E01 cria namespace somente após conferir identidade, ausência, UID e run-id.</text>
<text x="92" y="728" font-family="Arial, sans-serif" font-size="29" fill="#1f2937">Erro, colisão ou resultado incerto: pare, preserve o estado e use status/down próprios.</text>
</svg>
