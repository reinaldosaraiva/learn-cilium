<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Criação de Pod e seleção de Service</title>
<desc id="desc">Três quadros em ordem: declarar Deployment api com uma réplica e label app=api; reconciliar o Pod desejado, que contém o contêiner e executa no Node, enquanto CNI prepara a rede; selecionar labels e registrar destinos prontos na EndpointSlice. Na faixa inferior, frontend chama Service api na porta 80, Pod api executa NGINX na 8080, Service backend recebe na 80 e Pod backend recebe na 8080. Endereços de Pod são dinâmicos.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<rect width="1400" height="800" fill="#f8fafc"/><text x="55" y="62" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">Objetos Kubernetes fazem trabalhos diferentes</text>
<rect x="55" y="120" width="330" height="230" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/><text x="90" y="175" font-family="Arial" font-size="36" font-weight="700" fill="#1e3a8a">1 · declarar</text><text x="90" y="232" font-family="Arial" font-size="32" fill="#0f172a">Deployment api</text><text x="90" y="280" font-family="Arial" font-size="30" fill="#0f172a">1 réplica desejada</text><text x="90" y="322" font-family="Arial" font-size="29" fill="#334155">label: app=api</text>
<path d="M390 235 L465 235" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><rect x="475" y="120" width="380" height="230" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/><text x="510" y="175" font-family="Arial" font-size="36" font-weight="700" fill="#14532d">2 · reconciliar</text><text x="510" y="232" font-family="Arial" font-size="31" fill="#0f172a">controller mantém Pod</text><text x="510" y="280" font-family="Arial" font-size="30" fill="#0f172a">Node + contêiner</text><text x="510" y="322" font-family="Arial" font-size="29" fill="#334155">CNI prepara a rede</text>
<path d="M860 235 L935 235" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><rect x="945" y="120" width="400" height="230" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="980" y="175" font-family="Arial" font-size="36" font-weight="700" fill="#7c2d12">3 · selecionar</text><text x="980" y="232" font-family="Arial" font-size="31" fill="#0f172a">Service escolhe labels</text><text x="980" y="280" font-family="Arial" font-size="29" fill="#0f172a">EndpointSlice registra</text><text x="980" y="322" font-family="Arial" font-size="29" fill="#334155">destino(s) prontos</text>
<rect x="55" y="405" width="1290" height="290" rx="22" fill="#ffffff" stroke="#475569" stroke-width="4"/><text x="85" y="455" font-family="Arial" font-size="35" font-weight="700" fill="#0f172a">Caminho do laboratório — portas do exemplo</text>
<rect x="85" y="500" width="180" height="125" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="115" y="550" font-family="Arial" font-size="31" fill="#0f172a">frontend</text><text x="115" y="592" font-family="Arial" font-size="28" fill="#334155">cliente curl</text><path d="M270 562 L325 562" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="335" y="500" width="190" height="125" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="365" y="550" font-family="Arial" font-size="29" fill="#0f172a">Service api</text><text x="365" y="592" font-family="Arial" font-size="28" fill="#334155">porta 80</text><path d="M530 562 L585 562" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="595" y="500" width="210" height="125" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="625" y="550" font-family="Arial" font-size="30" fill="#0f172a">Pod api</text><text x="625" y="592" font-family="Arial" font-size="28" fill="#334155">NGINX :8080</text><path d="M810 562 L865 562" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="875" y="500" width="210" height="125" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="905" y="543" font-family="Arial" font-size="28" fill="#0f172a">Service</text><text x="905" y="586" font-family="Arial" font-size="28" fill="#334155">backend :80</text><path d="M1090 562 L1145 562" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1155" y="500" width="160" height="125" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1172" y="537" font-family="Arial" font-size="28" fill="#0f172a">Pod</text><text x="1172" y="574" font-family="Arial" font-size="28" fill="#334155">backend</text><text x="1172" y="611" font-family="Arial" font-size="28" fill="#334155">:8080</text>
<text x="85" y="665" font-family="Arial" font-size="29" fill="#334155">Cada Service usa selector e EndpointSlice; IPs concretos são dinâmicos.</text>
</svg>
