<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Estado público de P004 em 23 de outubro de 2026</title>
  <desc id="desc">P004-S001 (labctl) e P004-S002 (MGC M01 a M03, X05 com CIDRs sobrepostos e capacidade) fecharam com PASS. Os braços OVN-Kubernetes (S003), Cilium + KubeVirt (S004) e a matriz final INV (S005) seguem nas próximas sessões.</desc>
