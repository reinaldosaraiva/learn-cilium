<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="162mm" viewBox="0 0 1400 1260" role="img" aria-labelledby="title desc">
<title id="title">M11 híbrido planejado, ainda não executado</title>
<desc id="desc">Arquitetura prevista, NOT_RUN. O Terminal A alcança os dois guests QEMU irmãos por SSH com hostkeys verificadas, loopback e SLIRP; esse plano de gestão é separado do tenant. No fluxo tenant, CirrOS usa DHCP Neutron e uma ligação stream Unix até Ubuntu tenant0; a porta entra em OVS br-int com Security Group, segue por qrouter e br-ex/external0, pela TAP no netns do border, FRR, fabric BGP, worker Cilium, CNP e Pod. Neutron NDR anuncia o prefixo tenant ao border FRR e o endereço externo do qrouter é o next-hop. Retorno, tráfego e controles não foram validados em runtime.</desc>
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
    <path d="M0,0 L14,7 L0,14 z" fill="#111827"/>
  </marker>
  <marker id="management" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
    <path d="M0,0 L14,7 L0,14 z" fill="#1d4ed8"/>
