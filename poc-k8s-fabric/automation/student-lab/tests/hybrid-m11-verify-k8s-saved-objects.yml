---
- name: Re-read all saved M11 objects without creating replacements
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    run_id: 20261030-0123456789abcdef0123456789abcdef
    owner_token: '11111111111141118111111111111111'
    student_hybrid_test_uids:
      server_deployment: 11111111-1111-4111-8111-111111111111
      client_deployment: 22222222-2222-4222-8222-222222222222
      cluster_rack1: 33333333-3333-4333-8333-333333333333
      cluster_rack2: 44444444-4444-4444-8444-444444444444
      advertisement: 55555555-5555-4555-8555-555555555555
      peer_config: 66666666-6666-4666-8666-666666666666
      namespace: 77777777-7777-4777-8777-777777777777
    student_tool_dir: "{{ lookup('env', 'P010_HYBRID_API_TEST_SCRATCH') }}/k8s-verify-bin"
    student_state:
      profile: hibrido
      status: up
      run_id: "{{ run_id }}"
      owner_token: "{{ owner_token }}"
      kubeconfig: /private/kubeconfig
      context: p010-hibrido
      hybrid:
        schema: 4
        m11:
          verification:
            gates:
              k8s_pending: {}
              k8s_delete_pending: {}
              k8s_resources: {}
    ansible_become_exe: "{{ lookup('env', 'P010_HYBRID_TEST_BECOME_EXE') }}"
  tasks:
    - ansible.builtin.include_tasks: ../tasks/hybrid-m11-build-delete-k8s-specs.yml

    - name: Build saved object records from the reviewed M11 resource contract
      ansible.builtin.set_fact:
        student_hybrid_test_k8s_resources: >-
          {{ student_hybrid_test_k8s_resources | default({}) | combine({item.key: {
            'name': item.name, 'uid': student_hybrid_test_uids[item.key],
            'kind': item.kind, 'api_version': item.api_version_full, 'namespace': item.namespace}}) }}
      loop: "{{ student_hybrid_m11_delete_k8s_specs }}"
      no_log: true

    - name: Retain the seven exact UIDs produced by this run
      ansible.builtin.set_fact:
        student_state: >-
          {{ student_state | combine({'hybrid': {'m11': {'verification': {'gates': {
            'k8s_resources': student_hybrid_test_k8s_resources}}}}}, recursive=true) }}
      no_log: true

    - ansible.builtin.include_tasks: ../tasks/hybrid-m11-verify-k8s-objects.yml

    - name: Require exactly seven reads of the saved resources and no create action
      ansible.builtin.assert:
        that:
          - lookup('file', lookup('env', 'P010_HYBRID_K8S_VERIFY_CALLS')).splitlines() | length == 7
        fail_msg: "A revisão M11 deve consultar apenas os sete objetos já salvos."
