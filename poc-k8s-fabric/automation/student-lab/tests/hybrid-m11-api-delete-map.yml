---
- name: Delete one saved API resource and persist only its cleared ID
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    student_uid: "{{ ansible_user_uid | int }}"
    student_state_file: "{{ lookup('env', 'P010_HYBRID_API_TEST_SCRATCH') }}/api-delete-map-state.json"
    resource_id: 11111111-2222-4333-8444-555555555555
    other_id: 22222222-3333-4444-8555-666666666666
    student_state:
      status: partial
      run_id: 20261029-0123456789abcdef0123456789abcdef
      hybrid:
        m11:
          api:
            neutron_endpoint: "http://127.0.0.1:{{ lookup('env', 'P010_FAKE_NEUTRON_PORT') }}"
            pending: {}
            resources:
              tenant_network:
                primary:
                  id: "{{ resource_id }}"
                  name: p010-hyb-tenant-network
              bgp_speaker:
                primary:
                  id: "{{ other_id }}"
                  name: unrelated-owned-speaker
  tasks:
    - name: Keep the synthetic token only in the local verification process
      ansible.builtin.set_fact:
        student_hybrid_api_token: local-test-token
        student_hybrid_api_mode: remove-resources
      no_log: true

    - name: Persist the seeded API identities before the exact DELETE
      ansible.builtin.copy:
        dest: "{{ student_state_file }}"
        content: "{{ student_state | to_nice_json }}\n"
        owner: "{{ student_uid }}"
        mode: '0600'

    - name: Delete the recorded tenant network ID
      ansible.builtin.include_tasks: ../tasks/hybrid-m11-api-delete.yml
      vars:
        student_hybrid_api_resource_key: tenant_network
        student_hybrid_api_slot: primary
        student_hybrid_api_collection_path: /networks
        student_hybrid_api_envelope: network
        student_hybrid_api_delete_expected:
          name: p010-hyb-tenant-network

    - name: Reload the exact durable resource map
      ansible.builtin.set_fact:
        student_state: "{{ lookup('file', student_state_file) | from_json }}"

    - name: Require the target ID to be cleared and the unrelated identity to remain intact
      ansible.builtin.assert:
        that:
          - student_state.hybrid.m11.api.pending == {}
          - student_state.hybrid.m11.api.resources.keys() | list | sort == ['bgp_speaker', 'tenant_network']
          - student_state.hybrid.m11.api.resources.tenant_network.keys() | list == ['primary']
          - student_state.hybrid.m11.api.resources.tenant_network.primary.id == ''
          - student_state.hybrid.m11.api.resources.tenant_network.primary.name == 'p010-hyb-tenant-network'
          - student_state.hybrid.m11.api.resources.bgp_speaker.primary.id == other_id
