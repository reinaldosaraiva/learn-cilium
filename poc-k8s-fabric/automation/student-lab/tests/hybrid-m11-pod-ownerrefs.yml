---
- name: Exercise real Pod to ReplicaSet to Deployment ownership checks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_uid: "{{ ansible_user_uid | int }}"
    student_tool_dir: "{{ lookup('env', 'P010_HYBRID_POD_TEST_SCRATCH') }}/bin"
    student_hybrid_m11_namespace: p010-hyb-0123456789ab
    student_state:
      owner_token: '11111111111141118111111111111111'
      run_id: 20261030-0123456789abcdef0123456789abcdef
      kubeconfig: /unused/kubeconfig
      context: p010-hibrido
      hybrid:
        m11:
          verification:
            gates:
              k8s_resources:
                client_deployment:
                  name: p010-hyb-0123456789ab-client
                  uid: 11111111-1111-4111-8111-111111111111
                server_deployment:
                  name: p010-hyb-0123456789ab-server
                  uid: 22222222-2222-4222-8222-222222222222
    student_profile:
      labels:
        rack1: [rack1-node]
        rack2: [rack2-node]
    student_hybrid_m11_workload_pods:
      results:
        - item: {key: client, app: p010-hyb-client, deployment_key: client_deployment}
          stdout: "{{ lookup('file', lookup('env', 'P010_HYBRID_POD_TEST_SCRATCH') ~ '/client-pods.json') }}"
        - item: {key: server, app: p010-hyb-server, deployment_key: server_deployment}
          stdout: "{{ lookup('file', lookup('env', 'P010_HYBRID_POD_TEST_SCRATCH') ~ '/server-pods.json') }}"
    ansible_become_exe: "{{ lookup('env', 'P010_HYBRID_TEST_BECOME_EXE') }}"
  tasks:
    - name: Accept normal kubectl List and ReplicaSet controller responses
      block:
        - ansible.builtin.include_tasks: ../tasks/hybrid-m11-validate-pod-ownership.yml
      rescue:
        - ansible.builtin.set_fact:
            student_hybrid_m11_owner_chain_rejected: true

    - name: Match the acceptance result to the fixture ownership chain
      ansible.builtin.assert:
        that:
          - (lookup('env', 'P010_HYBRID_POD_TEST_MODE') == 'foreign') == (student_hybrid_m11_owner_chain_rejected | default(false) | bool)
          - lookup('env', 'P010_HYBRID_POD_TEST_MODE') != 'owned' or student_hybrid_m11_client_pod.metadata.name == 'client-pod'
          - lookup('env', 'P010_HYBRID_POD_TEST_MODE') != 'owned' or student_hybrid_m11_server_pod.metadata.name == 'server-pod'
        fail_msg: "Uma ReplicaSet própria deve passar e uma ReplicaSet alheia deve ser recusada."
