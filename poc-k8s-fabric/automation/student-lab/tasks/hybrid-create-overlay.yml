---
- name: Refuse a pre-existing path for the reserved guest overlay
  ansible.builtin.stat:
    path: "{{ student_state.hybrid.guests[student_hybrid_overlay_guest_name].overlay_path }}"
    follow: false
  register: student_hybrid_overlay_before
  no_log: true

- name: Require the reserved overlay path to be absent before creation
  ansible.builtin.assert:
    that:
      - not (student_hybrid_overlay_before.stat.exists | default(false))
      - not (student_hybrid_overlay_before.stat.islnk | default(false))
    fail_msg: "Overlay {{ student_hybrid_overlay_guest_name }} já existe sem identidade desta execução."
  no_log: true

- name: Create one per-run copy-on-write overlay from its verified base image
  ansible.builtin.command:
    argv: >-
      {{ [
        student_hybrid_qemu_img_bin | default('/usr/bin/qemu-img'),
        'create', '-f', 'qcow2', '-F', 'qcow2', '-b',
        student_state.hybrid.sources[student_hybrid_overlay_guest_name].path,
        student_state.hybrid.guests[student_hybrid_overlay_guest_name].overlay_path
      ] + (
        [student_hybrid_ubuntu_overlay_size_bytes | string]
        if student_hybrid_overlay_guest_name == 'ubuntu' else []
      ) }}
  register: student_hybrid_overlay_create
  changed_when: true

- name: Inspect the successfully created overlay without following symlinks
  ansible.builtin.stat:
    path: "{{ student_state.hybrid.guests[student_hybrid_overlay_guest_name].overlay_path }}"
    follow: false
  register: student_hybrid_created_overlay
  no_log: true

- name: Require a private regular overlay before saving its identity
  ansible.builtin.assert:
    that:
      - student_hybrid_created_overlay.stat.isreg | default(false)
      - not (student_hybrid_created_overlay.stat.islnk | default(false))
      - student_hybrid_created_overlay.stat.uid | int == student_uid
      - student_hybrid_created_overlay.stat.inode | int > 0
      - student_hybrid_created_overlay.stat.dev | int >= 0
    fail_msg: "Overlay {{ student_hybrid_overlay_guest_name }} não tem identidade privada verificável."
  no_log: true

- name: Save this overlay identity before creating the next
  ansible.builtin.set_fact:
    student_state: "{{ student_state | combine({'hybrid': {'guests': {student_hybrid_overlay_guest_name: {'overlay_device': student_hybrid_created_overlay.stat.dev, 'overlay_inode': student_hybrid_created_overlay.stat.inode}}}, 'updated_utc': ansible_date_time.iso8601}, recursive=true) }}"
  no_log: true

- name: Persist this overlay checkpoint before creating the next
  ansible.builtin.copy:
    dest: "{{ student_state_file }}"
    content: "{{ student_state | to_nice_json }}\n"
    owner: "{{ student_uid }}"
    mode: '0600'
  no_log: true

- name: Inspect the created overlay after its durable ownership checkpoint
  ansible.builtin.command:
    argv:
      - "{{ student_hybrid_qemu_img_bin | default('/usr/bin/qemu-img') }}"
      - info
      - --output=json
      - "{{ student_state.hybrid.guests[student_hybrid_overlay_guest_name].overlay_path }}"
  register: student_hybrid_overlay_info
  changed_when: false
  no_log: true

- name: Require qcow2 and the exact absolute backing image for this overlay
  ansible.builtin.assert:
    that:
      - (student_hybrid_overlay_info.stdout | from_json).get('format') == 'qcow2'
      - student_state.hybrid.sources[student_hybrid_overlay_guest_name].path is match('^/')
      - (student_hybrid_overlay_info.stdout | from_json).get('backing-filename') == student_state.hybrid.sources[student_hybrid_overlay_guest_name].path
      - student_hybrid_overlay_guest_name != 'ubuntu' or (student_hybrid_overlay_info.stdout | from_json).get('virtual-size') == student_hybrid_ubuntu_overlay_size_bytes
    fail_msg: "Overlay {{ student_hybrid_overlay_guest_name }} divergiu do formato, backing ou tamanho virtual esperado."
  no_log: true
