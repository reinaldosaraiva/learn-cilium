---
- name: Refuse a pre-existing destination for the pinned guest image
  ansible.builtin.stat:
    path: "{{ student_hybrid_source_item.value.path }}"
    follow: false
  register: student_hybrid_image_before
  no_log: true

- name: Require the image destination to be absent before transfer
  ansible.builtin.assert:
    that:
      - not (student_hybrid_image_before.stat.exists | default(false))
      - not (student_hybrid_image_before.stat.islnk | default(false))
    fail_msg: "Destino da imagem {{ student_hybrid_source_item.key }} já existe sem identidade desta execução."
  no_log: true

- name: Download one pinned guest image with SHA-256 verification
  ansible.builtin.get_url:
    url: "{{ student_hybrid_sources[student_hybrid_source_item.key].url }}"
    dest: "{{ student_hybrid_source_item.value.path }}"
    checksum: "sha256:{{ student_hybrid_source_item.value.sha256 }}"
    owner: "{{ student_uid }}"
    mode: '0600'
    timeout: 120

- name: Inspect the downloaded guest image without following symlinks
  ansible.builtin.stat:
    path: "{{ student_hybrid_source_item.value.path }}"
    follow: false
  register: student_hybrid_downloaded_image
  no_log: true

- name: Require a private regular downloaded image
  ansible.builtin.assert:
    that:
      - student_hybrid_downloaded_image.stat.isreg | default(false)
      - not (student_hybrid_downloaded_image.stat.islnk | default(false))
      - student_hybrid_downloaded_image.stat.uid | int == student_uid
      - student_hybrid_downloaded_image.stat.mode == '0600'
      - student_hybrid_downloaded_image.stat.inode | int > 0
      - student_hybrid_downloaded_image.stat.dev | int >= 0
    fail_msg: "Imagem {{ student_hybrid_source_item.key }} não é arquivo privado verificável."
  no_log: true

- name: Save this image identity before downloading the next
  ansible.builtin.set_fact:
    student_state: "{{ student_state | combine({'hybrid': {'sources': {student_hybrid_source_item.key: {'device': student_hybrid_downloaded_image.stat.dev, 'inode': student_hybrid_downloaded_image.stat.inode}}}, 'updated_utc': ansible_date_time.iso8601}, recursive=true) }}"
  no_log: true

- name: Persist the image checkpoint before downloading the next
  ansible.builtin.copy:
    dest: "{{ student_state_file }}"
    content: "{{ student_state | to_nice_json }}\n"
    owner: "{{ student_uid }}"
    mode: '0600'
  no_log: true
