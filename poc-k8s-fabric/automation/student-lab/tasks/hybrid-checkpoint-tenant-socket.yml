---
- name: Wait for Ubuntu's QEMU stream listener to create the reserved socket path
  ansible.builtin.wait_for:
    path: "{{ student_state.hybrid.network.tenant_socket.path }}"
    state: started
    timeout: 30

- name: Inspect the newly bound stream listener without following links
  ansible.builtin.stat:
    path: "{{ student_state.hybrid.network.tenant_socket.path }}"
    follow: false
  register: student_hybrid_new_tenant_socket_stat
  no_log: true

- name: Require a private student-owned stream socket under the private QMP directory
  ansible.builtin.assert:
    that:
      - student_hybrid_new_tenant_socket_stat.stat.issock | default(false)
      - not (student_hybrid_new_tenant_socket_stat.stat.islnk | default(false))
      - student_hybrid_new_tenant_socket_stat.stat.uid | int == student_uid
      - student_hybrid_new_tenant_socket_stat.stat.dev | int >= 0
      - student_hybrid_new_tenant_socket_stat.stat.inode | int > 0
      - student_hybrid_new_tenant_socket_stat.stat.mode | length == 4
      - student_hybrid_new_tenant_socket_stat.stat.mode[2] in ['0', '1', '4', '5']
      - student_hybrid_new_tenant_socket_stat.stat.mode[3] == '0'
      - student_state.hybrid.network.tenant_socket.device | int == 0
      - student_state.hybrid.network.tenant_socket.inode | int == 0
    fail_msg: "Socket do stream não é privado ou não tem identidade própria; CirrOS não será iniciado."
  no_log: true

- name: Record the stream socket identity before starting CirrOS
  ansible.builtin.set_fact:
    student_state: "{{ student_state | combine({'hybrid': {'phase': 'guests-booting', 'network': {'tenant_socket': {'device': student_hybrid_new_tenant_socket_stat.stat.dev, 'inode': student_hybrid_new_tenant_socket_stat.stat.inode}}}, 'phase': 'hybrid-ubuntu-started', 'updated_utc': ansible_date_time.iso8601}, recursive=true) }}"
  no_log: true

- name: Persist the stream socket checkpoint before starting its client
  ansible.builtin.copy:
    dest: "{{ student_state_file }}"
    content: "{{ student_state | to_nice_json }}\n"
    owner: "{{ student_uid }}"
    mode: '0600'
  no_log: true
