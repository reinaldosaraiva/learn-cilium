---
- name: Inspect the private owner token without following symlinks
  ansible.builtin.stat:
    path: "{{ student_owner_token_file }}"
    follow: false
  register: student_owner_token_stat
  no_log: true

- name: Require a private regular owner token for the invoking user
  ansible.builtin.assert:
    that:
      - student_owner_token_stat.stat.isreg | default(false)
      - not (student_owner_token_stat.stat.islnk | default(false))
      - student_owner_token_stat.stat.uid | int == student_uid
      - student_owner_token_stat.stat.mode == '0400'
    fail_msg: "Arquivo privado de ownership ausente ou inseguro."
  no_log: true

- name: Read the private owner token as data
  ansible.builtin.slurp:
    src: "{{ student_owner_token_file }}"
  register: student_owner_token_data
  no_log: true

- name: Require the private token file to match the nonempty state token
  ansible.builtin.assert:
    that:
      - student_state.owner_token is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - student_owner_token_data.content | b64decode | trim == student_state.owner_token
    fail_msg: "Arquivo de ownership vazio ou divergente do estado privado."
  no_log: true
