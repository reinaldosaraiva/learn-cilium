- name: Parse the final stopped streams and build a receipt only from measured headers
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -B
      - -c
      - "{{ student_hybrid_m11_c1_parser_script }}"
    stdin: "{{ student_hybrid_m11_c1_receipt_input | to_json }}"
    stdin_add_newline: false
  register: student_hybrid_m11_c1_receipt_result
  changed_when: false
  no_log: true

- name: Require measured normalized packet evidence before saving the receipt
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_receipt_result.rc | int == 0
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).schema | int == 1
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).check_id == student_state.hybrid.m11.verification.gates.positive.c1.check_id
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).waves.pod_to_cirros.phase == 'observed'
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).waves.cirros_to_pod.phase == 'observed'
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).waves.pod_to_cirros.icmp.sequences | length == 2
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).waves.cirros_to_pod.icmp.sequences | length == 2
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).waves.pod_to_cirros.observers | length >= 7
      - (student_hybrid_m11_c1_receipt_result.stdout | from_json).waves.cirros_to_pod.observers | length >= 7
    fail_msg: "A parser C1 não produziu duas ondas a partir dos headers e estatísticas efetivamente capturados."
  no_log: true

- name: Retain only the normalized measured C1 receipt body
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_receipt_body: "{{ student_hybrid_m11_c1_receipt_result.stdout | from_json }}"
  no_log: true

- ansible.builtin.include_tasks: hybrid-m11-save-positive-result.yml
