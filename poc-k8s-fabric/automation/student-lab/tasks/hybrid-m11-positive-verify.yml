      - ((student_hybrid_m11_c1_server_recheck.stdout | from_json).status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).ready | bool
      - ((student_hybrid_m11_c1_server_recheck.stdout | from_json).status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).containerID == 'containerd://' ~ (student_hybrid_m11_server_pod.status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).containerID | regex_replace('^containerd://', '')
