- name: Build the sanitized source inventory for the two-wave measured receipt
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_receipt_input:
      stage: final
      check_id: "{{ student_state.hybrid.m11.verification.gates.positive.c1.check_id }}"
      run_id: "{{ student_state.run_id }}"
      context: "{{ student_state.context }}"
