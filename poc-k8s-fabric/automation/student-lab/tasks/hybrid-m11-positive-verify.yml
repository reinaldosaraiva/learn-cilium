  become: true
  register: student_hybrid_m11_ciliumnodes
  changed_when: false
  no_log: true

- ansible.builtin.include_tasks: hybrid-m11-resolve-ciliumnodes.yml

- name: Require both racks to have distinct allocated PodCIDRs from the private cluster pool
  ansible.builtin.assert:
