                name: "{{ student_hybrid_m11_client_pod.metadata.name }}"
                uid: "{{ student_hybrid_m11_client_pod.metadata.uid }}"
                ip: "{{ student_hybrid_m11_client_pod.status.podIP }}"
                node: "{{ student_hybrid_m11_client_pod.spec.nodeName }}"
                pod_cidr: "{{ student_hybrid_m11_client_node.spec.ipam.podCIDRs[0] }}"
              server_pod:
                name: "{{ student_hybrid_m11_server_pod.metadata.name }}"
                uid: "{{ student_hybrid_m11_server_pod.metadata.uid }}"
                ip: "{{ student_hybrid_m11_server_pod.status.podIP }}"
                node: "{{ student_hybrid_m11_server_pod.spec.nodeName }}"
                pod_cidr: "{{ student_hybrid_m11_server_node.spec.ipam.podCIDRs[0] }}"

- name: Wait for the three expected Cilium BGP sessions to reach Established
  ansible.builtin.command:
    argv:
      - "{{ student_tool_dir }}/cilium"
      - --kubeconfig
      - "{{ student_state.kubeconfig }}"
      - --context
      - "{{ student_state.context }}"
      - bgp
      - peers
  become: true
  register: student_hybrid_m11_bgp_peers
  changed_when: false
  retries: 60
  delay: 5
  until: >-
    student_hybrid_m11_bgp_peers.rc == 0 and
    (student_hybrid_m11_bgp_peers.stdout | default('') | regex_findall('(?i)established') | length) == 3 and
    student_hybrid_m11_bgp_peers.stdout is search('10\.30\.1\.1') and
    student_hybrid_m11_bgp_peers.stdout is search('10\.30\.2\.1')
  no_log: true

- name: Require exactly three sessions with both selected leaf peers
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_bgp_peers.stdout | regex_findall('(?i)established') | length == 3
      - student_hybrid_m11_bgp_peers.stdout is search('10\.30\.1\.1')
      - student_hybrid_m11_bgp_peers.stdout is search('10\.30\.2\.1')
    fail_msg: "Cilium não confirmou os três peers BGP esperados para rack1/rack2."
  no_log: true

- name: Read the border's FRR RIB by the saved container identity
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - exec
      - "{{ student_state.fabric_node_ids[student_profile.fabric_nodes | select('search', 'border1$') | first] }}"
      - vtysh
      - -c
      - show ip bgp
  become: true
  register: student_hybrid_m11_border_bgp_rib
  changed_when: false
  retries: 60
  delay: 5
  until: >-
    student_hybrid_m11_border_bgp_rib.rc == 0 and
    student_hybrid_m11_border_bgp_rib.stdout is search('(?m)^\*>?\s*' ~ (student_state.hybrid.m11.network.tenant_cidr | regex_escape) ~ '\s+198\.18\.48\.3(?:\s|$)') and
    student_hybrid_m11_border_bgp_rib.stdout is search('(?m)^\*>?\s*' ~ (student_state.hybrid.m11.verification.gates.client_pod.pod_cidr | regex_escape) ~ '\s') and
    student_hybrid_m11_border_bgp_rib.stdout is search('(?m)^\*>?\s*' ~ (student_state.hybrid.m11.verification.gates.server_pod.pod_cidr | regex_escape) ~ '\s')
  no_log: true

- name: Read the tenant return route and both exact PodCIDRs at each fabric leaf by saved ID
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec',
          student_state.fabric_node_ids[item.node], 'sr_cli'] + item.arguments }}
  become: true
  register: student_hybrid_m11_fabric_routes
  changed_when: false
  loop:
    - node: "{{ student_profile.fabric_nodes | select('search', 'leaf1$') | first }}"
      prefix: "{{ student_state.hybrid.m11.network.tenant_cidr }}"
      arguments: ["show network-instance default route-table ipv4-unicast prefix {{ student_state.hybrid.m11.network.tenant_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'leaf1$') | first }}"
      prefix: "{{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"
      arguments: ["show network-instance default route-table ipv4-unicast prefix {{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'leaf1$') | first }}"
      prefix: "{{ student_state.hybrid.m11.verification.gates.server_pod.pod_cidr }}"
      arguments: ["show network-instance default route-table ipv4-unicast prefix {{ student_state.hybrid.m11.verification.gates.server_pod.pod_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'leaf2$') | first }}"
      prefix: "{{ student_state.hybrid.m11.network.tenant_cidr }}"
      arguments: ["show network-instance default route-table ipv4-unicast prefix {{ student_state.hybrid.m11.network.tenant_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'leaf2$') | first }}"
      prefix: "{{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"
      arguments: ["show network-instance default route-table ipv4-unicast prefix {{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'leaf2$') | first }}"
      prefix: "{{ student_state.hybrid.m11.verification.gates.server_pod.pod_cidr }}"
      arguments: ["show network-instance default route-table ipv4-unicast prefix {{ student_state.hybrid.m11.verification.gates.server_pod.pod_cidr }}"]
  loop_control:
    label: "{{ item.node }} {{ item.prefix }}"
  no_log: true

- name: Require every tenant and PodCIDR route on both selected leaves
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout is search(item.item.prefix | regex_escape)
    fail_msg: "A rota do tenant ou de uma PodCIDR não chegou aos dois leaves próprios."
  loop: "{{ student_hybrid_m11_fabric_routes.results }}"
  no_log: true

- name: Read the border FIB for the qrouter tenant next-hop and both PodCIDRs
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec',
          student_state.fabric_node_ids[item.node], item.cli] + item.arguments }}
  become: true
  register: student_hybrid_m11_server_routes
  changed_when: false
  loop:
    - node: "{{ student_profile.fabric_nodes | select('search', 'border1$') | first }}"
      prefix: "{{ student_state.hybrid.m11.network.tenant_cidr }}"
      cli: vtysh
      arguments: ["-c", "show ip route {{ student_state.hybrid.m11.network.tenant_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'border1$') | first }}"
      prefix: "{{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"
      cli: vtysh
      arguments: ["-c", "show ip route {{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"]
    - node: "{{ student_profile.fabric_nodes | select('search', 'border1$') | first }}"
      prefix: "{{ student_state.hybrid.m11.verification.gates.server_pod.pod_cidr }}"
      cli: vtysh
      arguments: ["-c", "show ip route {{ student_state.hybrid.m11.verification.gates.server_pod.pod_cidr }}"]
  loop_control:
    label: "{{ item.node }} {{ item.prefix }}"
  no_log: true

- name: Require the border FIB to use the qrouter as tenant next-hop and hold both PodCIDRs
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout is search(item.item.prefix | regex_escape)
      - item.item.prefix != student_state.hybrid.m11.network.tenant_cidr or item.stdout is search(student_state.hybrid.m11.network.provider_router_ip | regex_escape)
    fail_msg: "A FIB do border não contém o next-hop do qrouter e as duas PodCIDRs."
  loop: "{{ student_hybrid_m11_server_routes.results }}"
  no_log: true

- name: Require one ready container identity on each exact Pod
  ansible.builtin.assert:
    that:
      - item.pod.status.containerStatuses is sequence
      - item.pod.status.containerStatuses is not string
      - item.pod.status.containerStatuses | selectattr('name', 'equalto', item.container_name) | list | length == 1
      - container_status.ready | bool
      - container_status.restartCount | int >= 0
      - container_status.containerID is match('^containerd://[0-9a-f]{64}$')
      - item.pod.metadata.uid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - item.pod.status.podIP is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - item.pod.spec.nodeName in student_state.kind_node_ids
      - student_state.kind_node_ids[item.pod.spec.nodeName] is match('^[0-9a-f]{64}$')
    fail_msg: "O endpoint C1 não possui Pod, container ou node próprios, prontos e identificáveis."
  loop:
    - {key: pod_to_cirros, pod: "{{ student_hybrid_m11_client_pod }}", container_name: netshoot}
    - {key: cirros_to_pod, pod: "{{ student_hybrid_m11_server_pod }}", container_name: agnhost}
  vars:
    container_status: "{{ item.pod.status.containerStatuses | selectattr('name', 'equalto', item.container_name) | first }}"
  no_log: true

- name: Retain only the two Pod-to-container identities selected by UID and container name
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_pod_targets:
      - key: pod_to_cirros
        pod: "{{ student_hybrid_m11_client_pod }}"
        container_name: netshoot
        container_id: "{{ (student_hybrid_m11_client_pod.status.containerStatuses | selectattr('name', 'equalto', 'netshoot') | first).containerID | regex_replace('^containerd://', '') }}"
        worker_id: "{{ student_state.kind_node_ids[student_hybrid_m11_client_pod.spec.nodeName] }}"
      - key: cirros_to_pod
        pod: "{{ student_hybrid_m11_server_pod }}"
        container_name: agnhost
        container_id: "{{ (student_hybrid_m11_server_pod.status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).containerID | regex_replace('^containerd://', '') }}"
        worker_id: "{{ student_state.kind_node_ids[student_hybrid_m11_server_pod.spec.nodeName] }}"
  no_log: true

- name: Read each selected Kind node's host PID from its saved Docker ID
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - inspect
      - --format={{ '{{.State.Pid}}' }}
      - "{{ item.worker_id }}"
  become: true
  register: student_hybrid_m11_c1_worker_pids
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_pod_targets }}"
  no_log: true

- name: Require distinct live Kind worker init PIDs
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout is match('^[1-9][0-9]*$')
      - item.stdout | int > 1
      - student_hybrid_m11_c1_worker_pids.results | map(attribute='stdout') | list | unique | list | length == 2
    fail_msg: "O ID Docker salvo não resolveu em exatamente dois processos Kind ativos."
  loop: "{{ student_hybrid_m11_c1_worker_pids.results }}"
  no_log: true

- name: Locate each kubelet's effective CRI endpoint and the node-local crictl executable
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - exec
      - "{{ item.worker_id }}"
      - /bin/sh
      - -s
    stdin: |-
      set -eu
      kubelet_pids=''
      kubelet_cmd=''
      set -- /proc/[0-9]*/cmdline
      set -f
      for cmdfile do
        [ "$cmdfile" != '/proc/[0-9]*/cmdline' ] || continue
        [ -r "$cmdfile" ] || continue
        first="$(tr '\000' '\n' <"$cmdfile" | /usr/bin/sed -n '1p')"
        [ "${first##*/}" = kubelet ] || continue
        pid="${cmdfile#/proc/}"
        pid="${pid%/cmdline}"
        kubelet_pids="$kubelet_pids $pid"
        kubelet_cmd="$cmdfile"
      done
      [ "$(printf '%s\n' "$kubelet_pids" | /usr/bin/awk '{print NF}')" = 1 ]
      kubelet_pid="${kubelet_pids# }"
      endpoint=''
      config=''
      endpoint_flags=0
      config_flags=0
      next_flag=''
      args_file="$(mktemp /tmp/p010-c1-kubelet-args.XXXXXXXX)"
      chmod 600 "$args_file"
      /usr/bin/tr '\000' '\n' <"$kubelet_cmd" >"$args_file"
      while IFS= read -r arg; do
        if [ -n "$next_flag" ]; then
          [ -n "$arg" ] || exit 74
          if [ "$next_flag" = endpoint ]; then endpoint="$arg"; else config="$arg"; fi
          next_flag=''
          continue
        fi
        case "$arg" in
          --container-runtime-endpoint=*) endpoint_flags=$((endpoint_flags + 1)); endpoint="${arg#*=}" ;;
          --container-runtime-endpoint) endpoint_flags=$((endpoint_flags + 1)); next_flag=endpoint ;;
          --config=*) config_flags=$((config_flags + 1)); config="${arg#*=}" ;;
          --config) config_flags=$((config_flags + 1)); next_flag=config ;;
        esac
      done <"$args_file"
      /bin/rm -f -- "$args_file"
      [ -z "$next_flag" ] || exit 74
      [ "$endpoint_flags" -le 1 ] || exit 74
      [ "$config_flags" -le 1 ] || exit 74
      [ "$endpoint_flags" = 0 ] || [ -n "$endpoint" ] || exit 74
      [ "$config_flags" = 0 ] || [ -n "$config" ] || exit 74
      source='flag'
      if [ -z "$endpoint" ]; then
        [ -n "$config" ] && [ -r "$config" ]
        count="$(/usr/bin/awk -F: '$1 == "containerRuntimeEndpoint" {n++} END {print n+0}' "$config")"
        [ "$count" = 1 ]
        endpoint="$(/usr/bin/awk 'index($0, ":") { key=substr($0, 1, index($0, ":") - 1); if (key == "containerRuntimeEndpoint") { value=substr($0, index($0, ":") + 1); sub(/^[[:space:]]*/, "", value); sub(/[[:space:]]*$/, "", value); print value } }' "$config")"
        [ -n "$endpoint" ]
        source='config'
      fi
      case "$endpoint" in unix:///*) ;; *) exit 71 ;; esac
      case "$endpoint" in *[!A-Za-z0-9._:/-]*) exit 72 ;; esac
      crictl="$(command -v crictl)"
      [ -x "$crictl" ]
      crictl="$(readlink -f -- "$crictl")"
      crictl_hash="$(sha256sum "$crictl" | /usr/bin/awk '{print $1}')"
      [ "$(printf '%s' "$crictl_hash" | /usr/bin/awk '{print length($0)}')" = 64 ]
      kubelet_start="$(/usr/bin/awk '{sub(/^.*\) /, ""); print $20}' "/proc/$kubelet_pid/stat")"
      boot_id="$(cat /proc/sys/kernel/random/boot_id)"
      [ "$kubelet_start" -gt 0 ]
      case "$boot_id" in ????????-????-????-????-????????????) ;; *) exit 73 ;; esac
      config_id='0:0'
      if [ "$source" = config ]; then config_id="$(stat -Lc '%d:%i' "$config")"; fi
      printf '%s|%s|%s|%s|%s|%s|%s|%s\n' "$endpoint" "$source" "$config" "$config_id" "$crictl" "$crictl_hash" "$kubelet_pid:$kubelet_start" "$boot_id"
    stdin_add_newline: false
  become: true
  register: student_hybrid_m11_c1_runtime_discoveries
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_pod_targets }}"
  no_log: true

- name: Require a single recognized CRI discovery record from each own worker
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split('|') | length == 8
      - item.stdout.split('|')[0] is match('^unix:///[^| ]+$')
      - item.stdout.split('|')[1] in ['flag', 'config']
      - item.stdout.split('|')[4] is match('^/[^| ]+/crictl$')
      - item.stdout.split('|')[5] is match('^[0-9a-f]{64}$')
      - item.stdout.split('|')[6] is match('^[1-9][0-9]*:[1-9][0-9]*$')
      - item.stdout.split('|')[7] is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
    fail_msg: "O worker não publicou um endpoint CRI, crictl ou domínio kubelet inequívoco."
  loop: "{{ student_hybrid_m11_c1_runtime_discoveries.results }}"
  no_log: true

- name: Keep the observed worker CRI discovery fields only in protected memory
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_runtime_by_key: >-
      {{ dict(student_hybrid_m11_c1_runtime_discoveries.results
        | map(attribute='item.key')
        | zip(student_hybrid_m11_c1_runtime_discoveries.results | map(attribute='stdout') | map('split', '|') | list)) }}
  no_log: true

- name: Ask each observed crictl binary for its client and runtime versions with explicit endpoints
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - exec
      - "{{ item.worker_id }}"
      - "{{ student_hybrid_m11_c1_runtime_by_key[item.key][4] }}"
      - --version
  become: true
  register: student_hybrid_m11_c1_crictl_client_versions
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_pod_targets }}"
  no_log: true

- name: Require the source-backed crictl client version without inferring it from the node image
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | regex_findall('(?m)^crictl version v?1\.33\.0\s*$') | length == 1
    fail_msg: "O cliente CRI não corresponde à versão v1.33.0 fonteada para este adapter."
  loop: "{{ student_hybrid_m11_c1_crictl_client_versions.results }}"
  no_log: true

- name: Read the server runtime version with explicit runtime and image endpoints
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec', item.item.worker_id,
          item.stdout.split('|')[4], '--runtime-endpoint', item.stdout.split('|')[0], '--image-endpoint', item.stdout.split('|')[0],
          '--timeout', '10s', '--debug=false', 'version'] }}
  become: true
  register: student_hybrid_m11_c1_runtime_versions
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_runtime_discoveries.results }}"
  no_log: true

- name: Query the exact container list from each recognized CRI endpoint
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec', item.item.worker_id,
          item.stdout.split('|')[4], '--runtime-endpoint', item.stdout.split('|')[0], '--image-endpoint', item.stdout.split('|')[0],
          '--timeout', '10s', '--debug=false', 'ps', '-o', 'json'] }}
  become: true
  register: student_hybrid_m11_c1_cri_containers
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_runtime_discoveries.results }}"
  no_log: true

- name: Require the source-backed crictl v1.33.0 and containerd 2.1.4 text version record
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - "item.stdout | regex_findall('(?m)^Version:  [A-Za-z0-9.+_-]{1,64}\\s*$') | length == 1"
      - "item.stdout | regex_findall('(?m)^RuntimeName:  containerd\\s*$') | length == 1"
      - "item.stdout | regex_findall('(?m)^RuntimeVersion:  v?2\\.1\\.4(?:[-+][A-Za-z0-9._-]+)?\\s*$') | length == 1"
      - "item.stdout | regex_findall('(?m)^RuntimeApiVersion:  v1\\s*$') | length == 1"
      - item.stdout.splitlines() | reject('equalto', '') | list | length == 4
    fail_msg: "A versão CRI/formatter ou a listagem de containers não corresponde ao adapter fechado."
  loop: "{{ student_hybrid_m11_c1_runtime_versions.results }}"
  no_log: true

- name: Require each explicit CRI container-list response to have the pinned envelope
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | from_json) is mapping
      - (item.stdout | from_json).keys() | list | sort == ['containers']
      - (item.stdout | from_json).containers is sequence
      - (item.stdout | from_json).containers is not string
    fail_msg: "A listagem do endpoint CRI está ausente ou tem um formato não reconhecido."
  loop: "{{ student_hybrid_m11_c1_cri_containers.results }}"
  no_log: true

- name: Require exactly one running CRI container for each current full Pod container ID
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).containers is sequence
      - (item.stdout | from_json).containers is not string
      - (item.stdout | from_json).containers | selectattr('id', 'equalto', student_hybrid_m11_c1_target.container_id) | list | length == 1
      - student_hybrid_m11_c1_candidate.state == 'CONTAINER_RUNNING'
      - student_hybrid_m11_c1_candidate.labels['io.kubernetes.pod.uid'] == student_hybrid_m11_c1_target.pod.metadata.uid
      - student_hybrid_m11_c1_candidate.labels['io.kubernetes.pod.name'] == student_hybrid_m11_c1_target.pod.metadata.name
      - student_hybrid_m11_c1_candidate.labels['io.kubernetes.pod.namespace'] == student_hybrid_m11_c1_target.pod.metadata.namespace
      - student_hybrid_m11_c1_candidate.labels['io.kubernetes.container.name'] == student_hybrid_m11_c1_target.container_name
      - student_hybrid_m11_c1_candidate.metadata.attempt | int >= 0
    fail_msg: "O container CRI não pertence à Pod atual ou não está ativo."
  vars:
    student_hybrid_m11_c1_target: "{{ student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.item.key) | first }}"
    student_hybrid_m11_c1_candidate: "{{ (item.stdout | from_json).containers | selectattr('id', 'equalto', student_hybrid_m11_c1_target.container_id) | first }}"
  loop: "{{ student_hybrid_m11_c1_cri_containers.results }}"
  no_log: true

- name: Parse the two JSON container lists and join each Pod UID/container ID to one running sandbox
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_cri_joined: "{{ student_hybrid_m11_c1_cri_joined | default({}) | combine({item.item.item.key: student_hybrid_m11_c1_match}) }}"
  vars:
    student_hybrid_m11_c1_target: "{{ student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.item.key) | first }}"
    student_hybrid_m11_c1_container_status: "{{ student_hybrid_m11_c1_target.pod.status.containerStatuses | selectattr('name', 'equalto', student_hybrid_m11_c1_target.container_name) | first }}"
    student_hybrid_m11_c1_matches: >-
      {{ (item.stdout | from_json).containers
        | selectattr('id', 'equalto', student_hybrid_m11_c1_target.container_id)
        | list }}
    student_hybrid_m11_c1_match: "{{ student_hybrid_m11_c1_matches | first | combine({'worker_id': student_hybrid_m11_c1_target.worker_id}) }}"
  loop: "{{ student_hybrid_m11_c1_cri_containers.results }}"
  no_log: true

- name: Require each CRI join to identify exactly one full sandbox ID and attempt
  ansible.builtin.assert:
    that:
      - item.value.podSandboxId is match('^[0-9a-f]{64}$')
      - item.value.metadata.attempt | int >= 0
      - item.value.labels['io.kubernetes.pod.uid'] == (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.key) | first).pod.metadata.uid
    fail_msg: "O container não se juntou a um sandbox único da Pod atual."
  loop: "{{ student_hybrid_m11_c1_cri_joined | dict2items }}"
  no_log: true

- name: Inspect each complete sandbox ID using the selected worker's explicit CRI endpoint
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec', item.value.worker_id,
          student_hybrid_m11_c1_runtime_by_key[item.key][4], '--runtime-endpoint', student_hybrid_m11_c1_runtime_by_key[item.key][0],
          '--image-endpoint', student_hybrid_m11_c1_runtime_by_key[item.key][0], '--timeout', '10s', '--debug=false',
          'inspectp', '-o', 'json', item.value.podSandboxId] }}
  become: true
  register: student_hybrid_m11_c1_sandbox_inspections
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_cri_joined | dict2items }}"
  no_log: true

- name: Require the containerd sandbox schema to match the current Pod UID and network namespace
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | from_json).keys() | list | sort == ['info', 'status']
      - (item.stdout | from_json).status.id == item.item.value.podSandboxId
      - (item.stdout | from_json).status.metadata.uid == (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.uid
      - (item.stdout | from_json).status.metadata.name == (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.name
      - (item.stdout | from_json).status.metadata.namespace == (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.namespace
      - (item.stdout | from_json).status.state == 'SANDBOX_READY'
      - (item.stdout | from_json).status.metadata.attempt is defined
      - (item.stdout | from_json).status.metadata.attempt | int >= 0
      - (item.stdout | from_json).status.network.ip == (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.status.podIP
      - (item.stdout | from_json).status.linux.namespaces.options.network == 'POD'
      - (item.stdout | from_json).status.runtimeHandler == 'runc'
      - (item.stdout | from_json).info.pid | int > 1
      - (item.stdout | from_json).info.processStatus == 'running'
      - not (item.stdout | from_json).info.netNamespaceClosed | bool
      - (item.stdout | from_json).info.runtimeType == 'io.containerd.runc.v2'
    fail_msg: "O adapter containerd não identificou sandbox Linux READY da Pod atual; nenhum PID de sandbox será sinalizado."
  loop: "{{ student_hybrid_m11_c1_sandbox_inspections.results }}"
  no_log: true

- name: Keep only the validated sandbox PID and worker host PID for the proc bridge
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_sandbox_targets: >-
      {{ student_hybrid_m11_c1_sandbox_targets | default({}) | combine({item.item.key: {
        'worker_id': item.item.value.worker_id,
        'worker_host_pid': (student_hybrid_m11_c1_worker_pids.results | selectattr('item.key', 'equalto', item.item.key) | first).stdout | int,
        'container_id': item.item.value.id,
        'sandbox_id': item.item.value.podSandboxId,
        'pod_uid': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.uid,
        'pod_name': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.name,
        'namespace': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.namespace,
        'pod_ip': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.status.podIP,
        'sandbox_pid': (item.stdout | from_json).info.pid | int,
        'container_attempt': item.item.value.metadata.attempt | int,
        'sandbox_attempt': (item.stdout | from_json).status.metadata.attempt | int,
        'runtime_handler': (item.stdout | from_json).status.runtimeHandler,
        'runtime_type': (item.stdout | from_json).info.runtimeType,
        'runtime_version': (student_hybrid_m11_c1_runtime_versions.results | selectattr('item.item.key', 'equalto', item.item.key) | first).stdout
      }}) }}
  loop: "{{ student_hybrid_m11_c1_sandbox_inspections.results }}"
  no_log: true

- name: Verify each worker PID namespace bridge and inspect the sandbox process and Pod links
  ansible.builtin.command:
    argv: [/bin/sh, -s]
    stdin: |-
      set -eu
      proc_root=/proc
      worker_pid={{ item.value.worker_host_pid | int }}
      sandbox_pid={{ item.value.sandbox_pid | int }}
      proc_starttime() {
        line="$(/bin/cat "$1")" || return 1
        case "$line" in *") "*) rest="$(printf '%s\n' "$line" | /usr/bin/sed 's/^.*) //')" ;; *) return 1 ;; esac
        set -- $rest
        [ "$#" -ge 20 ] || return 1
        field=0
        start=''
        for value do
          field=$((field + 1))
          if [ "$field" -eq 20 ]; then start="$value"; break; fi
        done
        case "$start" in ''|*[!0-9]*) return 1 ;; esac
        [ "$start" -gt 0 ] || return 1
        printf '%s\n' "$start"
      }
      worker_proc="$proc_root/$worker_pid"
      worker_root="$worker_proc/root/proc"
      sandbox_proc="$worker_root/$sandbox_pid"
      [ -r "$worker_proc/stat" ] && [ -r "$worker_proc/ns/pid" ]
      [ -r "$worker_root/1/ns/pid" ]
      worker_pidns="$(/usr/bin/stat -Lc '%d:%i' "$worker_proc/ns/pid")"
      root_pidns="$(/usr/bin/stat -Lc '%d:%i' "$worker_root/1/ns/pid")"
      [ "$worker_pidns" = "$root_pidns" ]
      worker_start="$(proc_starttime "$worker_proc/stat")"
      worker_uid="$(/usr/bin/stat -Lc '%u' "$worker_proc")"
      [ "$worker_start" -gt 0 ] && [ "$worker_uid" -ge 0 ]
      [ -r "$sandbox_proc/stat" ] && [ -r "$sandbox_proc/status" ] && [ -r "$sandbox_proc/ns/net" ]
      sandbox_start="$(proc_starttime "$sandbox_proc/stat")"
      sandbox_uid="$(/usr/bin/stat -Lc '%u' "$sandbox_proc")"
      sandbox_netns="$(/usr/bin/stat -Lc '%d:%i' "$sandbox_proc/ns/net")"
      [ "$sandbox_start" -gt 0 ] && [ "$sandbox_uid" -ge 0 ]
      boot_id="$(/bin/cat "$worker_root/sys/kernel/random/boot_id")"
      case "$boot_id" in ????????-????-????-????-????????????) ;; *) exit 71 ;; esac
      links="$(/usr/bin/nsenter --net="$sandbox_proc/ns/net" -- /usr/sbin/ip -j address show)"
      [ "$(proc_starttime "$worker_proc/stat")" = "$worker_start" ]
      [ "$(proc_starttime "$sandbox_proc/stat")" = "$sandbox_start" ]
      printf 'P010_C1_POD_IDENTITY=%s|%s|%s|%s|%s|%s|%s|%s|%s\n' "$worker_pid" "$worker_start" "$worker_uid" "$worker_pidns" "$sandbox_pid" "$sandbox_start" "$sandbox_uid" "$sandbox_netns" "$boot_id"
      printf 'P010_C1_POD_LINKS=%s\n' "$links"
    stdin_add_newline: false
  become: true
  register: student_hybrid_m11_c1_pod_links
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_sandbox_targets | dict2items }}"
  no_log: true

- name: Require each proc bridge and sandbox identity to remain exact and live
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - c1_identity | length == 9
      - c1_identity[0] | int == item.item.value.worker_host_pid | int
      - c1_identity[1] | int > 0
      - c1_identity[2] is match('^[0-9]+$')
      - c1_identity[3] is match('^[1-9][0-9]*:[1-9][0-9]*$')
      - c1_identity[4] | int == item.item.value.sandbox_pid | int
      - c1_identity[5] | int > 0
      - c1_identity[6] is match('^[0-9]+$')
      - c1_identity[7] is match('^[1-9][0-9]*:[1-9][0-9]*$')
      - c1_identity[8] is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - item.stdout_lines | select('match', '^P010_C1_POD_IDENTITY=') | list | length == 1
      - item.stdout_lines | select('match', '^P010_C1_POD_LINKS=') | list | length == 1
      - c1_links is sequence
      - c1_links is not string
      - c1_links | map(attribute='ifname') | list | unique | length == c1_links | length
      - c1_pod_addresses | length == 1
      - c1_pod_links | length == 1
      - c1_pod_link.address is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
      - c1_pod_link.ifindex | int > 0
      - c1_pod_link.ifname is match('^[A-Za-z0-9_.:-]{1,15}$')
    fail_msg: "O proc bridge ou a identidade atual do sandbox/Pod é ambígua; nenhuma captura ou probe será iniciada."
  vars:
    c1_identity: "{{ (item.stdout_lines | select('match', '^P010_C1_POD_IDENTITY=') | first | regex_replace('^P010_C1_POD_IDENTITY=', '')).split('|') }}"
    c1_links: "{{ item.stdout_lines | select('match', '^P010_C1_POD_LINKS=') | first | regex_replace('^P010_C1_POD_LINKS=', '') | from_json }}"
    c1_target: "{{ student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first }}"
    c1_pod_addresses: >-
      {{ c1_links | map(attribute='addr_info') | flatten
        | selectattr('family', 'equalto', 'inet')
        | selectattr('local', 'equalto', c1_target.pod.status.podIP) | list }}
    c1_pod_links: >-
      {{ c1_links | selectattr('addr_info', 'contains', c1_pod_addresses[0]) | list }}
    c1_pod_link: "{{ c1_pod_links | first }}"
  loop: "{{ student_hybrid_m11_c1_pod_links.results }}"
  no_log: true

- name: Keep the measured Pod and worker process and interface identities
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_pod_observations: >-
      {{ student_hybrid_m11_c1_pod_observations | default({}) | combine({item.item.key: {
        'identity': (item.stdout_lines | select('match', '^P010_C1_POD_IDENTITY=') | first | regex_replace('^P010_C1_POD_IDENTITY=', '')).split('|'),
        'links': (item.stdout_lines | select('match', '^P010_C1_POD_LINKS=') | first | regex_replace('^P010_C1_POD_LINKS=', '') | from_json),
        'pod_uid': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.metadata.uid,
        'container_id': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).container_id,
        'pod_ip': (student_hybrid_m11_c1_pod_targets | selectattr('key', 'equalto', item.item.key) | first).pod.status.podIP
      }}) }}
  loop: "{{ student_hybrid_m11_c1_pod_links.results }}"
  no_log: true

- ansible.builtin.include_tasks: hybrid-validate-border.yml
  vars:
    student_hybrid_ports_to_check: []

- name: Read the border TAP only inside the saved border network namespace
  ansible.builtin.command:
    argv:
      - "{{ student_hybrid_nsenter_bin | default('/usr/bin/nsenter') }}"
      - "--net=/proc/{{ student_state.hybrid.network.border.pid }}/ns/net"
      - --
      - /usr/sbin/ip
      - -d
      - -o
      - link
      - show
      - dev
      - "{{ student_state.hybrid.network.tap.name }}"
  become: true
  register: student_hybrid_m11_c1_border_tap_link
  changed_when: false
  no_log: true

- name: Require the border TAP alias, ifindex, and tap kind to match this run
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_border_tap_link.rc == 0
      - >-
        student_hybrid_m11_c1_border_tap_link.stdout is search('(?m)^' ~ (student_state.hybrid.network.tap.ifindex | string) ~ ': ' ~ (student_state.hybrid.network.tap.name | regex_escape) ~ '(?:@[^:]+)?:')
      - student_hybrid_m11_c1_border_tap_link.stdout is search('(?i)alias ' ~ (student_state.hybrid.network.tap.alias | regex_escape))
      - student_hybrid_m11_c1_border_tap_link.stdout is search('(?i)tun type tap')
      - student_hybrid_m11_c1_border_tap_link.stdout is search('(?i)link/ether [0-9a-f]{2}(:[0-9a-f]{2}){5}')
    fail_msg: "A TAP do border não corresponde ao alias, ifindex e netns salvos."
  no_log: true

- name: Read kernel routes to each exact Cilium PodCIDR inside the saved border namespace
  ansible.builtin.command:
    argv:
      - "{{ student_hybrid_nsenter_bin | default('/usr/bin/nsenter') }}"
      - "--net=/proc/{{ student_state.hybrid.network.border.pid }}/ns/net"
      - --
      - /usr/sbin/ip
      - -j
      - route
      - show
      - exact
      - "{{ item.prefix }}"
  become: true
  register: student_hybrid_m11_c1_border_routes
  changed_when: false
  loop:
    - {direction: pod_to_cirros, prefix: "{{ student_hybrid_m11_client_node.spec.ipam.podCIDRs[0] }}"}
    - {direction: cirros_to_pod, prefix: "{{ student_hybrid_m11_server_node.spec.ipam.podCIDRs[0] }}"}
  no_log: true

- name: Require each border PodCIDR route to have one recognized route record
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | from_json) is sequence
      - (item.stdout | from_json) is not string
      - (item.stdout | from_json) | length == 1
      - ((item.stdout | from_json | first).dst | default(item.item.prefix)) == item.item.prefix
      - (((item.stdout | from_json | first).nexthops | default([(item.stdout | from_json | first)])) | length) >= 1
      - (((item.stdout | from_json | first).nexthops | default([(item.stdout | from_json | first)])) | selectattr('dev', 'defined') | list | length) == (((item.stdout | from_json | first).nexthops | default([(item.stdout | from_json | first)])) | length)
      - (((item.stdout | from_json | first).nexthops | default([(item.stdout | from_json | first)])) | selectattr('gateway', 'defined') | list | length) == (((item.stdout | from_json | first).nexthops | default([(item.stdout | from_json | first)])) | length)
    fail_msg: "A rota de PodCIDR do border não revelou candidatos reais de next-hop/interface."
  loop: "{{ student_hybrid_m11_c1_border_routes.results }}"
  no_log: true

- name: Keep the finite border fabric interfaces selected by the live PodCIDR routes
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_border_route_candidates: >-
      {{ student_hybrid_m11_c1_border_route_candidates | default([]) + [{
        'direction': item.item.direction,
        'prefix': item.item.prefix,
        'hops': (item.stdout | from_json | first).nexthops | default([(item.stdout | from_json | first)])
      }] }}
  loop: "{{ student_hybrid_m11_c1_border_routes.results }}"
  no_log: true

- name: Require border fabric candidates to stay outside the management link and recorded TAP
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_border_route_candidates | length == 2
      - (student_hybrid_m11_c1_border_route_candidates | map(attribute='hops') | flatten | map(attribute='dev') | unique | list | length) >= 1
      - student_state.hybrid.network.tap.name not in (student_hybrid_m11_c1_border_route_candidates | map(attribute='hops') | flatten | map(attribute='dev') | list)
      - student_hybrid_m11_c1_border_route_candidates | map(attribute='hops') | flatten | map(attribute='gateway') | select('match', '^10\\.30\\.') | list | length == (student_hybrid_m11_c1_border_candidates | default(student_hybrid_m11_c1_border_route_candidates | map(attribute='hops') | flatten | list) | length)
    fail_msg: "A rota de retorno do border está ausente, usa management/TAP ou tem next-hop fora do fabric observado."
  vars:
    student_hybrid_m11_c1_border_candidates: "{{ student_hybrid_m11_c1_border_route_candidates | map(attribute='hops') | flatten | list }}"
  no_log: true

- name: Read each finite border fabric candidate interface in the saved border namespace
  ansible.builtin.command:
    argv:
      - "{{ student_hybrid_nsenter_bin | default('/usr/bin/nsenter') }}"
      - "--net=/proc/{{ student_state.hybrid.network.border.pid }}/ns/net"
      - --
      - /usr/sbin/ip
      - -d
      - -o
      - link
      - show
      - dev
      - "{{ item }}"
  become: true
  register: student_hybrid_m11_c1_border_fabric_links
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_border_route_candidates | map(attribute='hops') | flatten | map(attribute='dev') | unique | list }}"
  no_log: true

- name: Require every border fabric interface to have a real ifindex and MAC
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        item.stdout is search('(?m)^[1-9][0-9]*: [A-Za-z0-9_.:-]{1,15}(?:@[^:]+)?:')
      - item.stdout is search('(?i)link/ether [0-9a-f]{2}(:[0-9a-f]{2}){5}')
    fail_msg: "A border route candidate não possui uma interface física observável."
  loop: "{{ student_hybrid_m11_c1_border_fabric_links.results }}"
  no_log: true

- name: Read the live tenant route to CirrOS from both exact Pod workers
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - exec
      - "{{ item.worker_id }}"
      - /usr/sbin/ip
      - -j
      - route
      - get
      - "{{ student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address }}"
  become: true
  register: student_hybrid_m11_c1_worker_routes
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_pod_targets }}"
  no_log: true

- name: Require one live route from each exact worker toward the VM tenant address
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | from_json) is sequence
      - (item.stdout | from_json) is not string
      - (item.stdout | from_json) | length == 1
      - ((item.stdout | from_json | first).dst | default('')) == student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address
      - ((item.stdout | from_json | first).dev | default('')) is match('^[A-Za-z0-9_.:-]{1,15}$')
      - ((item.stdout | from_json | first).gateway | default('')) is match('^10\\.30\\.[0-9]{1,3}\\.[0-9]{1,3}$')
      - ((item.stdout | from_json | first).prefsrc | default('')) is match('^10\\.30\\.[0-9]{1,3}\\.[0-9]{1,3}$')
    fail_msg: "O worker do Pod não revelou uma rota de tenant pelo next-hop fabric real."
  loop: "{{ student_hybrid_m11_c1_worker_routes.results }}"
  no_log: true

- name: Read the exact worker fabric interface selected for the tenant route
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - exec
      - "{{ item.item.worker_id }}"
      - /usr/sbin/ip
      - -d
      - -o
      - link
      - show
      - dev
      - "{{ (item.stdout | from_json | first).dev }}"
  become: true
  register: student_hybrid_m11_c1_worker_links
  changed_when: false
  loop: "{{ student_hybrid_m11_c1_worker_routes.results }}"
  no_log: true

- name: Require each worker uplink to have a current ifindex and MAC
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        item.stdout is search('(?m)^[1-9][0-9]*: [A-Za-z0-9_.:-]{1,15}(?:@[^:]+)?:')
      - item.stdout is search('(?i)link/ether [0-9a-f]{2}(:[0-9a-f]{2}){5}')
    fail_msg: "A interface do worker selecionada pela rota não pode ser identificada."
  loop: "{{ student_hybrid_m11_c1_worker_links.results }}"
  no_log: true

- name: Read the live CirrOS interface identities from its pinned guest session
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_cirros_links_script: |-
      set -eu
      exec 3>&1 4>&2
      exec >/dev/null 2>&1
      links="$(/usr/sbin/ip -j address show)"
      printf 'P010_C1_CIRROS_LINKS=%s\n' "$links" >&3
