      - "{{ student_state.kubeconfig }}"
      - --context
      - "{{ student_state.context }}"
      - get
      - pods
      - --namespace
      - "{{ student_hybrid_m11_namespace }}"
      - --selector
      - "p010-student-owner={{ student_state.owner_token }},p010-student-run={{ student_state.run_id }},app={{ item.app }}"
