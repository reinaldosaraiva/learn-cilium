- name: Render the bounded measured C1 packet-header parser
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_parser_script: |-
      import hashlib
      import ipaddress
      import json
      import re
      import sys

      DATA = json.load(sys.stdin)
      U32 = 0xffffffff
      TIME = re.compile(r'^(?P<stamp>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?)\s')
      ENDPOINT = re.compile(r'(?P<src>(?:[0-9]{1,3}\.){3}[0-9]{1,3})(?:\.(?P<sport>[0-9]+))? > (?P<dst>(?:[0-9]{1,3}\.){3}[0-9]{1,3})(?:\.(?P<dport>[0-9]+))?:')
      IP_PROTOCOL = re.compile(r'\bproto (?:(?P<name>ICMP|TCP) \()?(?P<number>[0-9]+)\)?', re.IGNORECASE)
      STATS = {
          'captured': re.compile(r'^([0-9]+) packets? captured$'),
          'received_by_filter': re.compile(r'^([0-9]+) packets? received by filter$'),
          'dropped_by_kernel': re.compile(r'^([0-9]+) packets? dropped by kernel$'),
      }

      def reject(reason):
          print(json.dumps({'error': reason}, separators=(',', ':')))
          raise SystemExit(2)

      def read_stream(entry, final):
          text = entry.get('text')
          if not isinstance(text, str) or not text:
              reject('capture text is missing')
          if '\x00' in text:
              reject('capture text contains a NUL byte')
          encoded = text.encode('utf-8')
          if len(encoded) != int(entry.get('bytes', -1)) or len(encoded) > 65536:
              reject('capture byte bound or measured length differs')
          if hashlib.sha256(encoded).hexdigest() != entry.get('sha256'):
              reject('capture digest differs from measured file')
          if not text.endswith('\n'):
              reject('capture ends in a truncated line')
          if final:
              rc_fields = ('child_rc', 'supervisor_rc', 'transport_rc')
              if any(not isinstance(entry.get(name), int) for name in rc_fields):
                  reject('capture process and transport statuses are incomplete')
              if entry['child_rc'] not in (0, 130) or entry['supervisor_rc'] not in (0, 130):
                  reject('capture child or supervisor returned an unaccepted status')
              if entry['transport_rc'] != 0:
                  reject('capture transport did not return successfully')
          lines = text.splitlines()
          listening = 0
          frames = []
          current = []
          counters = {}
          for line in lines:
              if line.startswith('tcpdump: listening on '):
                  listening += 1
                  if entry.get('interface') not in line or 'link-type EN10MB' not in line:
                      reject('listener header does not match the selected interface')
                  continue
              stat_match = None
              stat_name = None
              for name, pattern in STATS.items():
                  match = pattern.fullmatch(line)
                  if match:
                      stat_name = name
                      stat_match = match
                      break
              if stat_match:
                  if current:
                      frames.append(current)
                      current = []
                  if stat_name in counters:
                      reject('duplicate tcpdump statistic')
                  counters[stat_name] = int(stat_match.group(1))
                  continue
              if TIME.match(line):
                  if current:
                      frames.append(current)
                  current = [line]
                  continue
              if not line:
                  continue
              if current:
                  current.append(line)
                  continue
              reject('unrecognized tcpdump preamble or statistics')
          if current:
              frames.append(current)
          if listening != 1:
              reject('missing or duplicate tcpdump listener header')
          if len(frames) >= 128:
              reject('record cap reached')
          if final:
              if set(counters) != set(STATS):
                  reject('required tcpdump statistics are missing')
              if counters['dropped_by_kernel'] != 0:
                  reject('kernel dropped captured packets')
              if counters['captured'] != len(frames):
                  reject('captured counter differs from measured headers')
              if counters['received_by_filter'] < counters['captured']:
                  reject('filter counter is smaller than captured counter')
          elif counters:
              reject('statistics appeared while the observer should still be live')
          packets = []
          for frame in frames:
              joined = ' '.join(part.strip() for part in frame)
              endpoint_matches = list(ENDPOINT.finditer(joined))
              if len(endpoint_matches) != 1:
                  reject('packet header has a missing or ambiguous IPv4 tuple')
              protocol_matches = list(IP_PROTOCOL.finditer(joined))
              if len(protocol_matches) != 1:
                  reject('packet header has a missing or ambiguous IPv4 protocol')
              protocol_match = protocol_matches[0]
              protocol_number = int(protocol_match.group('number'))
              if protocol_number > 255:
                  reject('IPv4 protocol number is outside u8')
              protocol_name = protocol_match.group('name')
              if protocol_name and protocol_number != {'ICMP': 1, 'TCP': 6}[protocol_name.upper()]:
                  reject('IPv4 protocol name does not match its measured number')
              endpoint = endpoint_matches[0]
              src = endpoint.group('src')
              dst = endpoint.group('dst')
              try:
                  ipaddress.IPv4Address(src)
                  ipaddress.IPv4Address(dst)
              except ValueError:
                  reject('packet header contains an invalid IPv4 address')
              stamp = TIME.match(frame[0]).group('stamp')
              if 'ICMP ' in joined or 'proto ICMP' in joined:
                  if protocol_number != 1:
                      reject('ICMP text does not match the measured IPv4 protocol number')
                  echo = re.search(r'ICMP echo (request|reply), id ([0-9]+), seq ([0-9]+)', joined)
                  if not echo:
                      reject('ICMP record is not a measured echo request or reply')
                  ident = int(echo.group(2))
                  sequence = int(echo.group(3))
                  if ident > 65535 or sequence > 65535:
                      reject('ICMP identifier or sequence is outside u16')
                  packets.append({
                      'timestamp': stamp, 'protocol': 'icmp', 'src': src, 'dst': dst,
                      'type': echo.group(1), 'id': ident, 'icmp_seq': sequence,
                  })
                  continue
              flags_match = re.search(r'Flags \[([A-Za-z.]+)\]', joined)
              if not flags_match:
                  reject('IPv4 record is not a recognized ICMP or TCP header')
              if protocol_number != 6:
                  reject('TCP flags do not match the measured IPv4 protocol number')
              if endpoint.group('sport') is None or endpoint.group('dport') is None:
                  reject('TCP record is missing a measured port')
              flags = flags_match.group(1)
              seq_match = re.search(r'\bseq ([0-9]+)(?::([0-9]+))?', joined)
              ack_match = re.search(r'\back ([0-9]+)', joined)
              seq = int(seq_match.group(1)) if seq_match else None
              ack = int(ack_match.group(1)) if ack_match else None
              if seq is not None and seq > U32:
                  reject('TCP sequence is outside u32')
              if ack is not None and ack > U32:
                  reject('TCP acknowledgement is outside u32')
              has_ack = '.' in flags or 'A' in flags
              if has_ack and ack is None:
                  reject('TCP ACK flag lacks a measured acknowledgement')
              if not has_ack and ack is not None:
                  reject('TCP acknowledgement is present without an ACK flag')
              if seq is None and flags != '.':
                  reject('only a pure ACK may omit its sequence')
              packets.append({
                  'timestamp': stamp, 'protocol': 'tcp', 'src': src, 'dst': dst,
                  'sport': int(endpoint.group('sport')), 'dport': int(endpoint.group('dport')),
                  'flags': flags, 'seq': seq, 'ack': ack,
              })
          if final and len(frames) == 0:
              reject('no packet headers were captured')
          if len({(packet['protocol'], packet['src'], packet['dst'], packet.get('sport'), packet.get('dport'),
                   packet.get('type'), packet.get('id'), packet.get('icmp_seq'), packet.get('flags'),
                   packet.get('seq'), packet.get('ack')) for packet in packets}) > len(packets):
              reject('packet normalization lost a header record')
          return packets, counters

      def deduplicate(packets):
          unique = {}
          counts = {}
          for packet in packets:
              key = tuple(packet.get(name) for name in (
                  'protocol', 'src', 'dst', 'sport', 'dport', 'type', 'id',
                  'icmp_seq', 'flags', 'seq', 'ack'))
              counts[key] = counts.get(key, 0) + 1
              if key not in unique:
                  unique[key] = dict(packet)
          result = []
          for key, packet in unique.items():
              packet['retransmissions'] = counts[key] - 1
              result.append(packet)
          return result

      def wave_participants(observers, name, packets_by_key, flow):
          common = {'ubuntu-tenant0', 'cirros-endpoint', 'qrouter-tenant',
                    'qrouter-provider', 'border-tap'}
          expected_worker = 'worker-' + name
          expected_pod = 'pod-' + name
          participants = []
          for observer in observers:
              role = observer.get('role')
              key = observer.get('key')
              if role in common or (role == 'worker-fabric' and key == expected_worker) or (
                      role == 'pod-endpoint' and key == expected_pod):
                  participants.append(observer)
          route_cidrs = DATA.get('route_cidrs', {})
          if name not in route_cidrs:
              reject('the actual PodCIDR route for this wave is missing')
          route_tables = [route for observer in observers if observer.get('role') == 'border-fabric'
                          for route in observer.get('route_candidates', [])]
          matching_routes = [route for route in route_tables if route.get('direction') == name]
          if not matching_routes or any(route.get('prefix') != route_cidrs[name] for route in matching_routes):
              reject('the border observer route candidates do not match the current PodCIDR')
          if any(route != matching_routes[0] for route in matching_routes[1:]):
              reject('border observers disagree about the measured route candidates')
          route_candidates = matching_routes[0].get('hops', [])
          if not route_candidates or any(not re.fullmatch(r'[A-Za-z0-9_.:-]{1,15}', hop.get('dev', '')) or
                                         not re.fullmatch(r'10\.30\.[0-9]{1,3}\.[0-9]{1,3}', hop.get('gateway', ''))
                                         for hop in route_candidates):
              reject('the selected border route has a missing or non-fabric ECMP candidate')
          expected_border_devs = {hop['dev'] for hop in route_candidates}
          border_observers = [observer for observer in observers if observer.get('role') == 'border-fabric'
                              and observer.get('interface') in expected_border_devs]
          if {observer.get('interface') for observer in border_observers} != expected_border_devs:
              reject('a finite border route candidate has no measured interface observer')
          flow_endpoints = {flow['source_ip'], flow['destination_ip']}
          selected_border = [observer for observer in border_observers
                             if any(packet['src'] in flow_endpoints and packet['dst'] in flow_endpoints
                                    for packet in packets_by_key.get(observer.get('key'), []))]
          if len(selected_border) != 1:
              reject('the measured flow does not select exactly one observed border ECMP candidate')
          participants.extend(selected_border)
          counts = {
              'ubuntu-tenant0': sum(o.get('role') == 'ubuntu-tenant0' for o in participants),
              'cirros-endpoint': sum(o.get('role') == 'cirros-endpoint' for o in participants),
              'qrouter-tenant': sum(o.get('role') == 'qrouter-tenant' for o in participants),
              'qrouter-provider': sum(o.get('role') == 'qrouter-provider' for o in participants),
              'border-tap': sum(o.get('role') == 'border-tap' for o in participants),
              'border-fabric': sum(o.get('role') == 'border-fabric' for o in participants),
              'worker': sum(o.get('key') == expected_worker and o.get('role') == 'worker-fabric' for o in participants),
              'pod': sum(o.get('key') == expected_pod and o.get('role') == 'pod-endpoint' for o in participants),
          }
          if counts['ubuntu-tenant0'] != 1 or counts['cirros-endpoint'] != 1:
              reject('endpoint observer roles are absent or ambiguous')
          if counts['qrouter-tenant'] != 1 or counts['qrouter-provider'] != 1:
              reject('both measured qrouter port roles are required')
          if counts['border-tap'] != 1 or counts['border-fabric'] != 1:
              reject('measured border TAP and exactly one selected fabric ECMP candidate are required')
          if counts['worker'] != 1 or counts['pod'] != 1:
              reject('the exact direction worker and Pod netns are required')
          return participants

      def flow_events(packets, flow):
          source = flow['source_ip']
          destination = flow['destination_ip']
          service = int(flow['service_port'])
          relevant = []
          for packet in packets:
              if packet['src'] == source and packet['dst'] == destination:
                  if packet['protocol'] == 'tcp' and packet['dport'] != service:
                      reject('forward TCP service port differs from the requested destination')
                  relevant.append(packet)
              elif packet['src'] == destination and packet['dst'] == source:
                  if packet['protocol'] == 'tcp' and packet['sport'] != service:
                      reject('reverse TCP service port differs from the requested destination')
                  relevant.append(packet)
              else:
                  reject('captured tuple is outside the bilateral selected IPv4 filter')
          icmp = [packet for packet in relevant if packet['protocol'] == 'icmp']
          icmp = deduplicate(icmp)
          if any(packet['type'] == 'request' and (packet['src'], packet['dst']) != (source, destination) for packet in icmp):
              reject('ICMP echo request direction differs from the selected flow')
          if any(packet['type'] == 'reply' and (packet['src'], packet['dst']) != (destination, source) for packet in icmp):
              reject('ICMP echo reply direction differs from the selected flow')
          requests = {(packet['id'], packet['icmp_seq']) for packet in icmp if packet['type'] == 'request'}
          replies = {(packet['id'], packet['icmp_seq']) for packet in icmp if packet['type'] == 'reply'}
          if len(requests) != 2 or requests != replies or len({item[0] for item in requests}) != 1:
              reject('two matching ICMP request/reply pairs were not measured')
          tcp = deduplicate([packet for packet in relevant if packet['protocol'] == 'tcp'])
          client_ports = set()
          for packet in tcp:
              if packet['src'] == source:
                  client_ports.add(packet['sport'])
              else:
                  client_ports.add(packet['dport'])
          if len(client_ports) != 1:
              reject('new TCP connection has a missing or ambiguous ephemeral port')
          client_port = next(iter(client_ports))
          forward = [p for p in tcp if p['src'] == source and p['dst'] == destination and
                     p['sport'] == client_port and p['dport'] == service]
          reverse = [p for p in tcp if p['src'] == destination and p['dst'] == source and
                     p['sport'] == service and p['dport'] == client_port]
          syns = [p for p in forward if 'S' in p['flags'] and 'F' not in p['flags'] and 'R' not in p['flags'] and
                  not ('.' in p['flags'] or 'A' in p['flags'])]
          synacks = [p for p in reverse if 'S' in p['flags'] and 'F' not in p['flags'] and 'R' not in p['flags'] and
                     ('.' in p['flags'] or 'A' in p['flags'])]
          if len({p['seq'] for p in syns}) != 1 or len({(p['seq'], p['ack']) for p in synacks}) != 1:
              reject('TCP SYN or SYNACK is absent or ambiguous')
          client_seq = syns[0]['seq']
          server_seq = synacks[0]['seq']
          if client_seq is None or server_seq is None:
              reject('TCP SYN sequence is absent')
          expected_synack_ack = (client_seq + 1) & U32
          expected_client_ack = (server_seq + 1) & U32
          if synacks[0]['ack'] != expected_synack_ack:
              reject('TCP SYNACK acknowledgement does not match wrapped client sequence')
          acknowledgements = [p for p in forward if ('.' in p['flags'] or 'A' in p['flags']) and
                              'S' not in p['flags'] and 'R' not in p['flags'] and
                              p['ack'] == expected_client_ack and
                              (p['seq'] is None or p['seq'] == ((client_seq + 1) & U32))]
          if not acknowledgements:
              reject('TCP final ACK does not match the measured SYN/SYNACK sequence space')
          if len({(p['seq'], p['ack']) for p in acknowledgements}) != 1:
              reject('TCP final ACK is ambiguous across measured sequence values')
          ack_packet = sorted(acknowledgements, key=lambda p: p['timestamp'])[0]
          syn_packet = sorted(syns, key=lambda p: p['timestamp'])[0]
          synack_packet = sorted(synacks, key=lambda p: p['timestamp'])[0]
          selected = [syn_packet, synack_packet, ack_packet]
          if not (syn_packet['timestamp'] <= synack_packet['timestamp'] <= ack_packet['timestamp']):
              reject('TCP handshake headers are not ordered within the observer clock')
          pair_list = sorted([{'id': ident, 'seq': seq} for ident, seq in requests], key=lambda p: p['seq'])
          icmp_selected = []
          seen_icmp = set()
          for packet in icmp:
              key = (packet['type'], packet['id'], packet['icmp_seq'])
              if key not in seen_icmp:
                  seen_icmp.add(key)
                  icmp_selected.append(packet)
          icmp_selected.sort(key=lambda p: (p['icmp_seq'], p['type']))
          return {
              'icmp': {'id': pair_list[0]['id'], 'sequences': [p['seq'] for p in pair_list],
                       'requests': 2, 'replies': 2},
              'tcp': {
                  'client_ip': source, 'client_port': client_port,
                  'server_ip': destination, 'server_port': service,
                  'client_syn_seq': client_seq, 'server_synack_seq': server_seq,
                  'server_synack_ack': synack_packet['ack'],
                  'client_ack_seq': ack_packet['seq'],
                  'client_ack': ack_packet['ack'],
                  'seq_absent': ack_packet['seq'] is None,
              },
              'headers': icmp_selected + selected,
          }

      def validate_stage(entries, observers, flows, stage, final):
          if len(entries) != len(observers) or len({e.get('key') for e in entries}) != len(entries):
              reject('snapshot/capture inventory is incomplete or duplicated')
          by_key = {}
          all_packets = {}
          counters = {}
          for entry in entries:
              key = entry.get('key')
              if key not in {o.get('key') for o in observers}:
                  reject('stream refers to an unknown observer')
              packets, stats = read_stream(entry, final)
              by_key[key] = entry
              all_packets[key] = packets
              counters[key] = stats
          active_flows = ['pod_to_cirros'] if stage == 'pod_to_cirros' else (
              ['pod_to_cirros', 'cirros_to_pod'] if stage in ('cirros_to_pod', 'final') else [])
          if stage == 'pre':
              if any(all_packets.values()):
                  reject('a packet was captured before the first controller dispatch')
              return {'packets': 0}
          results = {}
          for flow_name in active_flows:
              flow = flows[flow_name]
              participants = wave_participants(observers, flow_name, all_packets, flow)
              participant_keys = {o['key'] for o in participants}
              for key, packets in all_packets.items():
                  matching = [p for p in packets if
                              (p['src'] == flow['source_ip'] and p['dst'] == flow['destination_ip']) or
                              (p['src'] == flow['destination_ip'] and p['dst'] == flow['source_ip'])]
                  if key not in participant_keys and matching:
                      reject('a direction-specific worker or Pod role was observed outside its selected wave')
              common_measure = None
              observer_results = []
              for observer in participants:
                  key = observer['key']
                  if final:
                      api = DATA.get('api', {})
                      if observer.get('role') == 'qrouter-tenant' and observer.get('neutron_port_id') != api.get('tenant_port', {}).get('id'):
                          reject('the tenant qrouter observer is not bound to the saved Neutron port ID')
                      if observer.get('role') == 'qrouter-provider' and observer.get('neutron_port_id') != api.get('provider_port', {}).get('id'):
                          reject('the provider qrouter observer is not bound to the saved Neutron port ID')
                      if observer.get('role') == 'cirros-endpoint' and observer.get('neutron_port_id') != api.get('cirros_port_id'):
                          reject('the CirrOS endpoint observer is not bound to the saved Neutron port ID')
                      if observer.get('role') == 'worker-fabric':
                          route = observer.get('route', {})
                          vm_ip = flows['pod_to_cirros']['destination_ip']
                          if route.get('dst') != vm_ip or route.get('dev') != observer.get('interface') or not re.fullmatch(r'10\.30\.[0-9]{1,3}\.[0-9]{1,3}', route.get('gateway', '')) or not re.fullmatch(r'10\.30\.[0-9]{1,3}\.[0-9]{1,3}', route.get('prefsrc', '')):
                              reject('the worker observer is not bound to its measured tenant route')
                  selected_packets = []
                  for packet in all_packets[key]:
                      if ((packet['src'] == flow['source_ip'] and packet['dst'] == flow['destination_ip']) or
                          (packet['src'] == flow['destination_ip'] and packet['dst'] == flow['source_ip'])):
                          selected_packets.append(packet)
                  normalized = flow_events(selected_packets, flow)
                  comparable = {
                      'icmp': normalized['icmp'],
                      'tcp': {name: value for name, value in normalized['tcp'].items()
                              if name != 'client_ack_seq'},
                  }
                  if common_measure is None:
                      common_measure = comparable
                  elif comparable != common_measure:
                      reject('the same packet exchange or TCP tuple was not seen across required roles')
                  observer_results.append({'key': key, 'measurement': normalized, 'observer': observer})
              results[flow_name] = {
                  'flow': flow, 'observers': observer_results, 'measurement': common_measure,
              }
          for flow_name, flow in flows.items():
              if flow_name not in active_flows:
                  for packets in all_packets.values():
                      if any((p['src'] == flow['source_ip'] and p['dst'] == flow['destination_ip']) or
                             (p['src'] == flow['destination_ip'] and p['dst'] == flow['source_ip'])
                             for p in packets):
                          reject('a future flow was captured before its controller dispatch')
          return {'waves': results, 'packets': sum(len(p) for p in all_packets.values()), 'counters': counters}

      def clean_observer(observer, entry, stats, measurement):
          return {
              'key': observer['key'], 'role': observer['role'], 'transport': observer['transport'],
              'interface': observer['interface'], 'ifindex': int(observer['ifindex']),
              'mac': observer['mac'], 'netns': observer['netns'], 'boot_id': observer['boot_id'],
              'started_utc': observer['started_utc'],
              'neutron_port_id': observer.get('neutron_port_id', ''),
              'route': ({name: observer.get('route', {}).get(name) for name in ('dst', 'dev', 'gateway', 'prefsrc')}
                        if observer.get('route') else {}),
              'route_candidates': [
                  {'direction': route['direction'], 'prefix': route['prefix'],
                   'hops': [{'dev': hop['dev'], 'gateway': hop['gateway'],
                             'weight': int(hop.get('weight', 1))} for hop in route.get('hops', [])]}
                  for route in observer.get('route_candidates', [])
              ],
              'supervisor': {'pid': int(observer['supervisor_pid']),
                             'starttime': int(observer['supervisor_starttime']),
                             'uid': int(observer['supervisor_uid']),
                             'rc': int(observer['supervisor_rc'])},
              'transport_rc': int(observer['transport_rc']),
              'tcpdump': {'pid': int(observer['tcpdump_pid']),
                          'starttime': int(observer['tcpdump_starttime']),
                          'uid': int(observer['tcpdump_uid']),
                          'version': observer['tcpdump_version'],
                          'argv': observer['argv'], 'filter': observer['filter'],
                          'rc': int(entry['child_rc'])},
              'supervisor_pidfile': {
                  'device': int(observer['supervisor_file_device']),
                  'inode': int(observer['supervisor_file_inode']),
                  'uid': int(observer['supervisor_file_uid']),
                  'mode': observer['supervisor_file_mode'],
              },
              'tcpdump_pidfile': {
                  'device': int(observer['tcpdump_file_device']),
                  'inode': int(observer['tcpdump_file_inode']),
                  'uid': int(observer['tcpdump_file_uid']),
                  'mode': observer['tcpdump_file_mode'],
              },
              'rc_file': {
                  'device': int(observer['rc_file_device']),
                  'inode': int(observer['rc_file_inode']),
                  'uid': int(observer['rc_file_uid']),
                  'mode': observer['rc_file_mode'],
              },
              'capture_file': {
                  'path': observer['capture_path'], 'device': int(observer['device']),
                  'inode': int(observer['inode']), 'uid': int(observer['file_uid']),
                  'mode': observer['mode'], 'bytes': int(entry['bytes']),
                  'sha256': entry['sha256'], 'stats': stats,
              },
              'selected_headers': measurement['headers'],
          }

      stage = DATA['stage']
      observers = DATA['observers']
      flows = DATA['flows']
      if stage != 'final':
          result = validate_stage(DATA['streams'], observers, flows, stage, False)
          print(json.dumps({'stage': stage, 'packets': result['packets']}, separators=(',', ':')))
          raise SystemExit(0)

      waves_checked = validate_stage(DATA['streams'], observers, flows, 'final', True)
      for pod_name in ('client', 'server'):
          pod = DATA['pods'].get(pod_name, {})
          if pod.get('phase') != 'Running' or pod.get('ready') is not True:
              reject('current Pod/container readiness is absent from the receipt source')
          route_name = 'pod_to_cirros' if pod_name == 'client' else 'cirros_to_pod'
          if pod.get('pod_cidr') != DATA.get('route_cidrs', {}).get(route_name):
              reject('the receipt PodCIDR differs from the measured border route')
          if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', pod.get('uid', '')):
              reject('current Pod UID is missing from the receipt source')
          if not re.fullmatch(r'[0-9a-f]{64}', pod.get('container_id', '')) or not re.fullmatch(r'[0-9a-f]{64}', pod.get('sandbox_id', '')):
              reject('CRI container or sandbox identity is incomplete')
          if pod.get('sandbox_uid') != pod.get('uid') or pod.get('sandbox_state') != 'READY' or pod.get('sandbox_pid_role') != 'identity_only':
              reject('sandbox UID/state/domain is not joined to the current Pod')
          if not isinstance(pod.get('container_attempt'), int) or pod['container_attempt'] < 0:
              reject('running CRI container attempt is absent or invalid')
          if not isinstance(pod.get('sandbox_attempt'), int) or pod['sandbox_attempt'] < 0:
              reject('inspected PodSandbox attempt is absent or invalid')
          if int(pod.get('sandbox_pid', 0)) <= 1 or int(pod.get('worker_host_pid', 0)) <= 1 or int(pod.get('worker_starttime', 0)) <= 0:
              reject('worker or sandbox process identity is incomplete')
          if not re.fullmatch(r'[1-9][0-9]*:[1-9][0-9]*', pod.get('worker_pidns', '')):
              reject('worker PID namespace identity is incomplete')
          if not re.fullmatch(r'[1-9][0-9]*:[1-9][0-9]*', pod.get('sandbox_netns', '')):
              reject('verified sandbox network namespace is incomplete')
          if not re.fullmatch(r'[1-9][0-9]*:[1-9][0-9]*', pod.get('kubelet_identity', '')):
              reject('effective kubelet PID/starttime identity is incomplete')
          if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', pod.get('worker_boot_id', '')):
              reject('worker boot identity is incomplete')
          if int(pod.get('pod_net_ifindex', 0)) <= 0 or not re.fullmatch(r'(?:[0-9a-f]{2}:){5}[0-9a-f]{2}', pod.get('pod_net_mac', '')):
              reject('Pod IP link identity is incomplete')
          if not re.fullmatch(r'unix:///[^| ]+', pod.get('runtime_endpoint', '')) or pod.get('runtime_endpoint_source') not in ('flag', 'config'):
              reject('effective kubelet runtime endpoint identity is incomplete')
          if not re.fullmatch(r'/[^| ]+/crictl', pod.get('crictl_path', '')) or not re.fullmatch(r'[0-9a-f]{64}', pod.get('crictl_sha256', '')):
              reject('observed crictl executable identity is incomplete')
          if pod.get('crictl_client_version_argv') != [pod.get('crictl_path'), '--version']:
              reject('crictl client version argv is not the measured candidate query')
          runtime_base = [pod.get('crictl_path'), '--runtime-endpoint', pod.get('runtime_endpoint'),
                          '--image-endpoint', pod.get('runtime_endpoint'), '--timeout', '10s', '--debug=false']
          if pod.get('server_version_argv') != runtime_base + ['version']:
              reject('CRI server version argv does not use the effective endpoint and bounded flags')
          if pod.get('cri_ps_argv') != runtime_base + ['ps', '-o', 'json']:
              reject('CRI container list argv does not use the effective endpoint and JSON envelope')
          if pod.get('sandbox_inspectp_argv') != runtime_base + ['inspectp', '-o', 'json', pod.get('sandbox_id')]:
              reject('CRI sandbox inspect argv does not use the joined sandbox identity')
          if pod.get('crictl_client_version') != 'crictl version v1.33.0' or int(pod.get('crictl_client_version_rc', -1)) != 0:
              reject('actual crictl client version query is not recognized')
          version_lines = pod.get('server_version', '').splitlines()
          if int(pod.get('server_version_rc', -1)) != 0 or len(version_lines) != 4:
              reject('actual CRI server version query is incomplete')
          if not re.fullmatch(r'Version:  [A-Za-z0-9.+_-]{1,64}', version_lines[0]):
              reject('CRI server Version label is malformed')
          if version_lines[1] != 'RuntimeName:  containerd' or not re.fullmatch(r'RuntimeVersion:  v?2\.1\.4(?:[-+][A-Za-z0-9._-]+)?', version_lines[2]) or version_lines[3] != 'RuntimeApiVersion:  v1':
              reject('actual CRI server version labels differ from the recognized source contract')
          if int(pod.get('cri_ps_rc', -1)) != 0 or int(pod.get('sandbox_inspectp_rc', -1)) != 0:
              reject('CRI list/inspect query did not return successfully')
          if pod.get('runtime_handler') != 'runc' or pod.get('runtime_type') != 'io.containerd.runc.v2':
              reject('observed sandbox runtime handler/type is unsupported')
          chain = pod.get('owner_chain', {})
          for owner_key in ('pod_replicaset_uid', 'replicaset_deployment_uid', 'deployment_uid'):
              if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', chain.get(owner_key, '')):
                  reject('validated Pod owner chain is incomplete')
      controller = DATA['controller']
      if controller['pod_to_cirros']['dispatch']['order'] >= controller['pod_to_cirros']['return']['order']:
          reject('first controller dispatch/return causal order is invalid')
      if controller['pod_to_cirros']['dispatch']['monotonic_ns'] >= controller['pod_to_cirros']['return']['monotonic_ns']:
          reject('first controller dispatch/return monotonic order is invalid')
      if controller['pod_to_cirros']['return']['order'] >= controller['cirros_to_pod']['dispatch']['order']:
          reject('second wave was not dispatched after the first probe returned')
      if controller['pod_to_cirros']['return']['monotonic_ns'] >= controller['cirros_to_pod']['dispatch']['monotonic_ns']:
          reject('second wave monotonic dispatch preceded the first return')
      if controller['cirros_to_pod']['dispatch']['order'] >= controller['cirros_to_pod']['return']['order']:
          reject('second controller dispatch/return causal order is invalid')
      if controller['cirros_to_pod']['dispatch']['monotonic_ns'] >= controller['cirros_to_pod']['return']['monotonic_ns']:
          reject('second controller dispatch/return monotonic order is invalid')
      receipt_waves = {}
      for name in ('pod_to_cirros', 'cirros_to_pod'):
          flow_result = waves_checked['waves'][name]
          control = controller[name]
          if int(control['probe_rc']) != 0:
              reject('one exact endpoint probe returned a failure status')
          identity = flow_result['measurement']
          wave_observers = []
          for item in flow_result['observers']:
              observer = item['observer']
              entry = next(e for e in DATA['streams'] if e['key'] == observer['key'])
              wave_observers.append(clean_observer(observer, entry, waves_checked['counters'][observer['key']], item['measurement']))
          receipt_waves[name] = {
              'phase': 'observed',
              'source_ip': flow_result['flow']['source_ip'],
              'destination_ip': flow_result['flow']['destination_ip'],
              'destination_port': int(flow_result['flow']['service_port']),
              'controller': control,
              'icmp': identity['icmp'],
              'tcp': identity['tcp'],
              'observers': wave_observers,
          }
      receipt = {
          'schema': 1,
          'scope': 'M11 C1 measured two-wave packet observation',
          'check_id': DATA['check_id'],
          'run_id': DATA['run_id'],
          'context': DATA['context'],
          'observed_utc': controller['cirros_to_pod']['return']['utc'],
          'api': DATA['api'],
          'pods': DATA['pods'],
          'waves': receipt_waves,
      }
      print(json.dumps(receipt, separators=(',', ':'), sort_keys=True))
  no_log: true

- name: Reject any stale or incomplete packet record before the first dispatch
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -B
      - -c
      - "{{ student_hybrid_m11_c1_parser_script }}"
    stdin: >-
      {{ {
        'stage': 'pre',
        'streams': student_hybrid_m11_c1_snapshots_before,
