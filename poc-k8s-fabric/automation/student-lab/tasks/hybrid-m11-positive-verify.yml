      - student_hybrid_m11_client_node.spec.ipam.podCIDRs | length == 1
      - student_hybrid_m11_server_node.spec.ipam.podCIDRs | length == 1
      - student_hybrid_m11_client_node.spec.ipam.podCIDRs[0] is match('^10\.246\.[0-9]{1,3}\.0/24$')
      - student_hybrid_m11_server_node.spec.ipam.podCIDRs[0] is match('^10\.246\.[0-9]{1,3}\.0/24$')
      - student_hybrid_m11_client_node.spec.ipam.podCIDRs[0] != student_hybrid_m11_server_node.spec.ipam.podCIDRs[0]
    fail_msg: "As duas réplicas precisam ocupar racks distintos com alocações Cilium próprias."
  no_log: true

- name: Checkpoint the exact workload UIDs, pod IPs, nodes, and PodCIDRs
  ansible.builtin.include_tasks: hybrid-m11-api-save.yml
  vars:
    student_hybrid_api_state_patch:
