      - student_state.hybrid.m11.verification.gates.c1_capture_active.observers | selectattr('phase', 'equalto', 'stopped') | list | length == student_state.hybrid.m11.verification.gates.c1_capture_active.observers | length
      - student_hybrid_m11_c1_capture_streams | length == student_state.hybrid.m11.verification.gates.c1_capture_active.observers | length
    fail_msg: "A tentativa C1 não manteve todos os processos e streams ligados ao check atual."
