          destination_ip: "{{ student_hybrid_m11_server_pod.status.podIP }}"
          service_port: 8080
      controller:
        pod_to_cirros:
          dispatch: "{{ student_hybrid_m11_c1_wave1_dispatch_raw.stdout | from_json }}"
          return: "{{ student_hybrid_m11_c1_wave1_return_raw.stdout | from_json }}"
          probe_rc: "{{ student_hybrid_m11_pod_to_cirros.rc | int }}"
          probe_argv: [kubectl, exec, "pod/{{ student_hybrid_m11_client_pod.metadata.name }}", --container, netshoot, /bin/sh, -ec, "ping -c 2 -W 3 {{ student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address }} >/dev/null && nc -vz -w 4 {{ student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address }} 22"]
        cirros_to_pod:
          dispatch: "{{ student_hybrid_m11_c1_wave2_dispatch_raw.stdout | from_json }}"
          return: "{{ student_hybrid_m11_c1_wave2_return_raw.stdout | from_json }}"
          probe_rc: "{{ student_hybrid_ssh_result.rc | int }}"
          probe_argv: [ssh, cirros, sh, -se, "ping -c 2 -W 3 {{ student_hybrid_m11_server_pod.status.podIP }} >/dev/null && wget -q -T 8 -O /dev/null http://{{ student_hybrid_m11_server_pod.status.podIP }}:8080/"]
      api: >-
        {{ student_state.hybrid.m11.verification.gates.c1_api_paths | combine({
          'cirros_port_id': student_state.hybrid.m11.api.resources.cirros_port.primary.id
        }, recursive=false) }}
      pods:
        client:
          key: pod_to_cirros
          namespace: "{{ student_hybrid_m11_client_pod.metadata.namespace }}"
          name: "{{ student_hybrid_m11_client_pod.metadata.name }}"
          uid: "{{ student_hybrid_m11_client_pod.metadata.uid }}"
          node: "{{ student_hybrid_m11_client_pod.spec.nodeName }}"
          pod_cidr: "{{ student_state.hybrid.m11.verification.gates.client_pod.pod_cidr }}"
          ip: "{{ student_hybrid_m11_client_pod.status.podIP }}"
          phase: "{{ student_hybrid_m11_client_pod.status.phase }}"
          ready: "{{ (student_hybrid_m11_client_pod.status.containerStatuses | selectattr('name', 'equalto', 'netshoot') | first).ready | bool }}"
          restart_count: "{{ (student_hybrid_m11_client_pod.status.containerStatuses | selectattr('name', 'equalto', 'netshoot') | first).restartCount | int }}"
          owner_chain:
            pod_replicaset_name: "{{ (student_hybrid_m11_client_pod.metadata.ownerReferences | selectattr('controller', 'equalto', true) | first).name }}"
            pod_replicaset_uid: "{{ (student_hybrid_m11_client_pod.metadata.ownerReferences | selectattr('controller', 'equalto', true) | first).uid }}"
            replicaset_deployment_name: "{{ (((student_hybrid_m11_workload_replicasets.results | selectattr('item.key', 'equalto', 'client') | first).stdout | from_json).metadata.ownerReferences | selectattr('controller', 'equalto', true) | first).name }}"
            replicaset_deployment_uid: "{{ (((student_hybrid_m11_workload_replicasets.results | selectattr('item.key', 'equalto', 'client') | first).stdout | from_json).metadata.ownerReferences | selectattr('controller', 'equalto', true) | first).uid }}"
            deployment_name: "{{ student_state.hybrid.m11.verification.gates.k8s_resources.client_deployment.name }}"
            deployment_uid: "{{ student_state.hybrid.m11.verification.gates.k8s_resources.client_deployment.uid }}"
