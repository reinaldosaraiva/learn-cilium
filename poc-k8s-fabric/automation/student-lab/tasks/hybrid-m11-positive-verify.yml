      pod_ip={{ student_hybrid_m11_server_pod.status.podIP | quote }}
      ping -c 2 -W 3 "$pod_ip" >/dev/null
      wget -q -T 8 -O /dev/null "http://$pod_ip:8080/"
      printf 'P010_C1_REVERSE_PROBE=ok\n'
  no_log: true

