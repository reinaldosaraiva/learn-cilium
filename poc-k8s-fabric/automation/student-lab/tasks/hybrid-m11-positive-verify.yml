      - student_hybrid_m11_c1_server_recheck.rc | int == 0
      - (student_hybrid_m11_c1_server_recheck.stdout | from_json).metadata.uid == student_hybrid_m11_server_pod.metadata.uid
      - (student_hybrid_m11_c1_server_recheck.stdout | from_json).spec.nodeName == student_hybrid_m11_server_pod.spec.nodeName
