          },
          'cirros_to_pod': {
            'source_ip': student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address,
            'destination_ip': student_hybrid_m11_server_pod.status.podIP,
            'service_port': 8080
          }
        }
      } | to_json }}
    stdin_add_newline: false
  register: student_hybrid_m11_c1_preflight_parse
  changed_when: false
  no_log: true

- name: Require a clean baseline before any C1 traffic probe
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_preflight_parse.rc | int == 0
      - (student_hybrid_m11_c1_preflight_parse.stdout | from_json).stage == 'pre'
      - (student_hybrid_m11_c1_preflight_parse.stdout | from_json).packets | int == 0
    fail_msg: "O baseline C1 contém tráfego anterior ao dispatch; a tentativa permanece parcial."
  no_log: true

- name: Record the controller dispatch for the exact client Pod probe
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -B
      - -c
      - "import datetime,json,time; n=time.monotonic_ns(); print(json.dumps({'order':1,'monotonic_ns':n,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='microseconds').replace('+00:00','Z')}))"
  register: student_hybrid_m11_c1_wave1_dispatch_raw
  changed_when: false
  no_log: true

- name: Run ICMP and a new TCP/22 connection from the exact client Pod container
  ansible.builtin.command:
    argv:
      - "{{ student_tool_dir }}/kubectl"
      - --kubeconfig
      - "{{ student_state.kubeconfig }}"
      - --context
      - "{{ student_state.context }}"
      - exec
      - --namespace
      - "{{ student_state.hybrid.m11.verification.gates.namespace }}"
      - "pod/{{ student_hybrid_m11_client_pod.metadata.name }}"
      - --container
      - netshoot
      - --
      - /bin/sh
      - -ec
      - "ping -c 2 -W 3 {{ student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address }} >/dev/null && nc -vz -w 4 {{ student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address }} 22"
  become: true
  register: student_hybrid_m11_pod_to_cirros
  changed_when: false
  no_log: true

- name: Record the controller return from the exact client Pod probe
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -B
      - -c
      - "import datetime,json,time; n=time.monotonic_ns(); print(json.dumps({'order':2,'monotonic_ns':n,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='microseconds').replace('+00:00','Z')}))"
  register: student_hybrid_m11_c1_wave1_return_raw
  changed_when: false
  no_log: true

- name: Require the exact client probe to return successfully
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_pod_to_cirros.rc | int == 0
      - (student_hybrid_m11_c1_wave1_dispatch_raw.stdout | from_json).monotonic_ns | int < (student_hybrid_m11_c1_wave1_return_raw.stdout | from_json).monotonic_ns | int
    fail_msg: "A sondagem do container netshoot exato falhou; a observação C1 permanece parcial."
  no_log: true

- name: Revalidate every live C1 observer and interface after the first wave
  ansible.builtin.include_tasks: hybrid-m11-build-stop-origin-script.yml
  loop: "{{ student_state.hybrid.m11.verification.gates.c1_capture_active.observers }}"
