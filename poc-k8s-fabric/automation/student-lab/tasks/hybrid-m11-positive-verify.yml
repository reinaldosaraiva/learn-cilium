      - (student_hybrid_m11_c1_server_after.stdout | from_json).metadata.uid == student_hybrid_m11_server_pod.metadata.uid
      - (student_hybrid_m11_c1_server_after.stdout | from_json).status.podIP == student_hybrid_m11_server_pod.status.podIP
      - ((student_hybrid_m11_c1_server_after.stdout | from_json).status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).ready | bool
      - ((student_hybrid_m11_c1_server_after.stdout | from_json).status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).containerID == 'containerd://' ~ (student_hybrid_m11_server_pod.status.containerStatuses | selectattr('name', 'equalto', 'agnhost') | first).containerID | regex_replace('^containerd://', '')
    fail_msg: "O endpoint de destino mudou ou deixou de estar READY após a segunda onda."
