  become: true
  register: student_hybrid_m11_workload_pods
  changed_when: false
  loop:
    - {key: client, app: p010-hyb-client, deployment_key: client_deployment}
    - {key: server, app: p010-hyb-server, deployment_key: server_deployment}
  no_log: true

- ansible.builtin.include_tasks: hybrid-m11-validate-pod-ownership.yml

- name: Read only the CiliumNode records for the two fixture pod nodes
  ansible.builtin.command:
    argv:
      - "{{ student_tool_dir }}/kubectl"
      - --kubeconfig
      - "{{ student_state.kubeconfig }}"
      - --context
      - "{{ student_state.context }}"
      - get
      - ciliumnodes
