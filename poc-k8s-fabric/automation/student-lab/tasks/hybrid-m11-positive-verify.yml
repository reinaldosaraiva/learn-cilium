- name: Revalidate every live C1 observer and interface after the reverse wave
  ansible.builtin.include_tasks: hybrid-m11-build-stop-origin-script.yml
  loop: "{{ student_state.hybrid.m11.verification.gates.c1_capture_active.observers }}"
  loop_control:
