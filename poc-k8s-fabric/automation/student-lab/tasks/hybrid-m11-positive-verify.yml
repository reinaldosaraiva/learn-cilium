---
- name: Preserve whether this is a create-only up pass or a health recheck of saved resources
  ansible.builtin.set_fact:
    student_hybrid_m11_positive_existing: "{{ student_hybrid_m11_positive_existing | default(false) | bool }}"
    student_hybrid_m11_positive_complete_status: "{{ 'up' if student_hybrid_m11_positive_existing | default(false) | bool else 'partial' }}"
  no_log: true

- name: Require guest DHCP, Neutron binding and the installed Cilium chart before M11 probes
  ansible.builtin.assert:
    that:
      - student_profile_name == 'hibrido'
      - student_state.status in ['partial', 'up']
      - (student_hybrid_m11_positive_existing and student_state.status == 'partial' and student_state.hybrid.m11.phase in ['verified', 'cilium-ready', 'api-ready'] and student_state.hybrid.m11.verification.gates.positive.c1.phase == 'collecting' and student_state.hybrid.m11.verification.gates.c1_capture_active.phase == 'starting' and student_state.hybrid.m11.verification.gates.positive.c1.check_id == student_state.hybrid.m11.verification.gates.c1_capture_active.check_id) or (not student_hybrid_m11_positive_existing and student_state.status == 'partial' and student_state.hybrid.m11.phase == 'guest-ready')
      - student_state.hybrid.guests.ubuntu.pid | int > 1
      - student_state.hybrid.guests.cirros.pid | int > 1
      - student_state.hybrid.m11.api.pending | length == 0
      - student_state.hybrid.m11.verification.gates.port_binding | bool
      - student_state.hybrid.m11.verification.gates.dhcp_lease.phase == 'verified'
      - student_state.hybrid.m11.cilium.values_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "A prova M11 exige guests, binding, DORA e valores Cilium já identificados."
  no_log: true

- name: Refresh the protected Neutron identity map when an initial up has no C1 map
  ansible.builtin.include_tasks: hybrid-m11-run-api.yml
  vars:
    student_hybrid_api_mode: verify
  when: >-
    student_state.hybrid.m11.verification.gates.c1_api_paths is not defined or
    student_state.hybrid.m11.verification.gates.c1_api_paths.run_id != student_state.run_id

- name: Require the live API identity map before resolving C1 observers
  ansible.builtin.assert:
    that:
      - student_state.hybrid.m11.verification.gates.c1_api_paths.schema | int == 1
      - student_state.hybrid.m11.verification.gates.c1_api_paths.run_id == student_state.run_id
      - student_state.hybrid.m11.verification.gates.c1_api_paths.router.id == student_state.hybrid.m11.api.resources.router.primary.id
      - student_state.hybrid.m11.verification.gates.c1_api_paths.tenant_port.id == student_state.hybrid.m11.api.resources.router_interface.primary.id
      - student_state.hybrid.m11.verification.gates.c1_api_paths.provider_port.id == student_state.hybrid.m11.api.resources.router_gateway_port.primary.id
      - student_state.hybrid.m11.verification.gates.c1_api_paths.tenant_port.fixed_ips[0].ip_address == student_state.hybrid.m11.network.tenant_gateway
      - student_state.hybrid.m11.verification.gates.c1_api_paths.provider_port.fixed_ips[0].ip_address == student_state.hybrid.m11.network.provider_router_ip
    fail_msg: "Os IDs de porta da API não permitem resolver os observadores C1 desta execução."
  no_log: true

- name: Reserve the private evidence parent for the first C1 observation
  ansible.builtin.file:
    path: "{{ student_run_dir }}/m11-evidence"
    state: directory
    owner: "{{ student_uid }}"
    mode: '0700'
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Allocate a fresh private C1 check directory for the first observation
  ansible.builtin.tempfile:
    path: "{{ student_run_dir }}/m11-evidence"
    state: directory
    prefix: c1-
  register: student_hybrid_m11_c1_new_dir
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Apply the student's private ownership to the new C1 directory
  ansible.builtin.file:
    path: "{{ student_hybrid_m11_c1_new_dir.path }}"
    state: directory
    owner: "{{ student_uid }}"
    mode: '0700'
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Inspect the new C1 directory before recording its identity
  ansible.builtin.stat:
    path: "{{ student_hybrid_m11_c1_new_dir.path }}"
    follow: false
  register: student_hybrid_m11_c1_new_dir_stat
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Require a distinct check ID and private evidence directory
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_new_dir.path | dirname == student_run_dir ~ '/m11-evidence'
      - student_hybrid_m11_c1_new_dir.path | basename is match('^c1-[A-Za-z0-9_-]{8,64}$')
      - student_hybrid_m11_c1_new_dir_stat.stat.isdir | default(false)
      - not (student_hybrid_m11_c1_new_dir_stat.stat.islnk | default(false))
      - student_hybrid_m11_c1_new_dir_stat.stat.uid | int == student_uid | int
      - student_hybrid_m11_c1_new_dir_stat.stat.mode == '0700'
      - student_hybrid_m11_c1_new_dir_stat.stat.dev | int > 0
      - student_hybrid_m11_c1_new_dir_stat.stat.inode | int > 0
    fail_msg: "A tentativa C1 inicial não tem diretório privado e identidade nova."
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Set the first C1 result and active maps before creating new workload effects
  ansible.builtin.set_fact:
    student_state: >-
      {{ student_state | combine({'status': 'partial', 'phase': 'hybrid-c1-collecting',
        'hybrid': student_state.hybrid | combine({'phase': 'partial', 'm11': student_state.hybrid.m11 | combine({
          'verification': student_state.hybrid.m11.verification | combine({
            'phase': 'collecting',
            'gates': student_state.hybrid.m11.verification.gates | combine({
              'positive': student_state.hybrid.m11.verification.gates.positive | combine({
                'c1': {
                  'schema': 1,
                  'check_id': student_hybrid_m11_c1_new_dir.path | basename,
                  'phase': 'collecting',
                  'previous_receipt': {},
                  'receipt': {'path': '', 'sha256': '', 'device': 0, 'inode': 0, 'owner_uid': 0, 'mode': ''}
                }
              }, recursive=false),
              'c1_capture_active': {
                'schema': 1,
                'check_id': student_hybrid_m11_c1_new_dir.path | basename,
                'phase': 'starting',
                'observers': []
              }
            }, recursive=false)
          }, recursive=false)
        }, recursive=false)}, recursive=false), 'updated_utc': ansible_date_time.iso8601}, recursive=false) }}
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Persist and reload the first C1 collecting checkpoint
  block:
    - ansible.builtin.copy:
        dest: "{{ student_state_file }}"
        content: "{{ student_state | to_nice_json }}\n"
        owner: "{{ student_uid }}"
        mode: '0600'
      no_log: true
    - ansible.builtin.set_fact:
        student_state: "{{ lookup('file', student_state_file) | from_json }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - student_state.status == 'partial'
          - student_state.hybrid.m11.verification.gates.positive.c1.check_id == student_hybrid_m11_c1_new_dir.path | basename
          - student_state.hybrid.m11.verification.gates.positive.c1.phase == 'collecting'
          - student_state.hybrid.m11.verification.gates.c1_capture_active.check_id == student_hybrid_m11_c1_new_dir.path | basename
          - student_state.hybrid.m11.verification.gates.c1_capture_active.phase == 'starting'
          - student_state.hybrid.m11.verification.gates.c1_capture_active.observers == []
        fail_msg: "O primeiro check C1 não sobreviveu ao save/reload antes dos efeitos."
      no_log: true
  when: not student_hybrid_m11_positive_existing

- name: Require a fresh collecting C1 check before reusing live resources
  ansible.builtin.assert:
    that:
      - student_state.hybrid.m11.verification.gates.positive.c1.phase == 'collecting'
      - student_state.hybrid.m11.verification.gates.c1_capture_active.phase == 'starting'
      - student_state.hybrid.m11.verification.gates.positive.c1.check_id == student_state.hybrid.m11.verification.gates.c1_capture_active.check_id
      - student_state.hybrid.m11.verification.gates.positive.c1.receipt.path == ''
  when: student_hybrid_m11_positive_existing
  no_log: true

- name: Revalidate the exact Ubuntu OVS attachment before resolving packet observers
  ansible.builtin.include_tasks: hybrid-m11-verify-c0-ovs.yml

- name: Discover Ubuntu tenant and qrouter interfaces from the saved Neutron port identities
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_guest_link_probe: |-
      set -eu
      exec 3>&1 4>&2
      exec >/dev/null 2>&1
      tenant_mac={{ student_state.hybrid.m11.verification.gates.c1_api_paths.tenant_port.mac_address | lower | quote }}
      tenant_ip={{ student_state.hybrid.m11.verification.gates.c1_api_paths.tenant_port.fixed_ips[0].ip_address | quote }}
      provider_mac={{ student_state.hybrid.m11.verification.gates.c1_api_paths.provider_port.mac_address | lower | quote }}
      provider_ip={{ student_state.hybrid.m11.verification.gates.c1_api_paths.provider_port.fixed_ips[0].ip_address | quote }}
      guest_iface={{ student_state.hybrid.m11.verification.gates.ovs_attach.interface_name | quote }}
      guest_mac={{ student_state.hybrid.m11.verification.gates.ovs_attach.guest_interface_mac | lower | quote }}
      guest_index={{ student_state.hybrid.m11.verification.gates.ovs_attach.ifindex | string | quote }}
      link_row="$(ip -o link show dev "$guest_iface")"
      link_index="$(printf '%s\n' "$link_row" | /usr/bin/awk -F: '{print $1}')"
      link_mac="$(printf '%s\n' "$link_row" | /usr/bin/sed -n 's/.*link\/ether \([^ ]*\).*/\1/p' | tr '[:upper:]' '[:lower:]')"
      [ "$link_index" = "$guest_index" ] && [ "$link_mac" = "$guest_mac" ]
      guest_netns="$(stat -Lc '%d:%i' /proc/self/ns/net)"
      qrouter_matches=''
      for ns in $(sudo -n /usr/sbin/ip netns list | /usr/bin/awk 'NF {print $1}'); do
        ns_path="/run/netns/$ns"
        [ -e "$ns_path" ]
        ns_identity="$(sudo -n /usr/bin/stat -Lc '%d:%i' "$ns_path")"
        tenant_found=''
        provider_found=''
        while IFS=' ' read -r index iface; do
          index="$(printf '%s' "$index" | /usr/bin/tr -d ':')"
          iface="$(printf '%s' "$iface" | /usr/bin/cut -d@ -f1)"
          mac="$(sudo -n /usr/sbin/ip netns exec "$ns" /usr/sbin/ip -o link show dev "$iface" | /usr/bin/sed -n 's/.*link\/ether \([^ ]*\).*/\1/p' | tr '[:upper:]' '[:lower:]')"
          addresses="$(sudo -n /usr/sbin/ip netns exec "$ns" /usr/sbin/ip -o -4 address show dev "$iface" | /usr/bin/awk '{print $4}' | /usr/bin/cut -d/ -f1)"
          if [ "$mac" = "$tenant_mac" ] && printf '%s\n' "$addresses" | /usr/bin/grep -Fxq "$tenant_ip"; then
            tenant_found="$iface|$index|$mac"
          fi
          if [ "$mac" = "$provider_mac" ] && printf '%s\n' "$addresses" | /usr/bin/grep -Fxq "$provider_ip"; then
            provider_found="$iface|$index|$mac"
          fi
        done < <(sudo -n /usr/sbin/ip netns exec "$ns" /usr/sbin/ip -o link show | /usr/bin/awk -F': ' '{print $1, $2}')
        if [ -n "$tenant_found" ] && [ -n "$provider_found" ]; then
          qrouter_matches="$(printf '%s\n%s|%s|%s|%s' "$qrouter_matches" "$ns" "$ns_identity" "$tenant_found" "$provider_found")"
        fi
      done
      [ "$(printf '%s\n' "$qrouter_matches" | /usr/bin/awk 'NF {n++} END {print n+0}')" = 1 ]
      qrouter_record="$(printf '%s\n' "$qrouter_matches" | /usr/bin/awk 'NF {print; exit}')"
      printf 'P010_C1_GUEST_LINKS=%s|%s|%s\n' "$guest_netns" "$guest_iface" "$guest_index" >&3
      printf 'P010_C1_QROUTER=%s\n' "$qrouter_record" >&3
  no_log: true

- name: Resolve Ubuntu and qrouter observer identities through the pinned SSH transport
  ansible.builtin.include_tasks: hybrid-m11-ssh.yml
  vars:
    student_hybrid_ssh_guest_name: ubuntu
    student_hybrid_ssh_remote_command: bash -se
    student_hybrid_ssh_stdin: "{{ student_hybrid_m11_c1_guest_link_probe }}"

- name: Parse the actual Ubuntu attachment and same-namespace qrouter ports
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_guest_link_markers: "{{ student_hybrid_ssh_result.stdout_lines | select('match', '^P010_C1_(GUEST_LINKS|QROUTER)=') | list }}"
    student_hybrid_m11_c1_guest_link_record: "{{ (student_hybrid_ssh_result.stdout_lines | select('match', '^P010_C1_GUEST_LINKS=') | first | regex_replace('^P010_C1_GUEST_LINKS=', '')).split('|') }}"
    student_hybrid_m11_c1_qrouter_record: "{{ (student_hybrid_ssh_result.stdout_lines | select('match', '^P010_C1_QROUTER=') | first | regex_replace('^P010_C1_QROUTER=', '')).split('|') }}"
  no_log: true

- name: Require one exact tenant0 and one qrouter with both API-bound ports
  ansible.builtin.assert:
    that:
      - student_hybrid_ssh_result.rc | int == 0
      - student_hybrid_m11_c1_guest_link_markers | select('match', '^P010_C1_GUEST_LINKS=') | list | length == 1
      - student_hybrid_m11_c1_guest_link_markers | select('match', '^P010_C1_QROUTER=') | list | length == 1
      - student_hybrid_m11_c1_guest_link_record | length == 3
      - student_hybrid_m11_c1_guest_link_record[0] is match('^[1-9][0-9]*:[1-9][0-9]*$')
      - student_hybrid_m11_c1_guest_link_record[1] == student_state.hybrid.m11.verification.gates.ovs_attach.interface_name
      - student_hybrid_m11_c1_guest_link_record[2] | int == student_state.hybrid.m11.verification.gates.ovs_attach.ifindex | int
      - student_hybrid_m11_c1_qrouter_record | length == 8
      - student_hybrid_m11_c1_qrouter_record[0] is match('^[A-Za-z0-9_.-]{1,64}$')
      - student_hybrid_m11_c1_qrouter_record[1] is match('^[1-9][0-9]*:[1-9][0-9]*$')
      - student_hybrid_m11_c1_qrouter_record[2] is match('^[A-Za-z0-9_.:-]{1,15}$')
      - student_hybrid_m11_c1_qrouter_record[3] is match('^[1-9][0-9]*$')
      - student_hybrid_m11_c1_qrouter_record[4] | lower == student_state.hybrid.m11.verification.gates.c1_api_paths.tenant_port.mac_address | lower
      - student_hybrid_m11_c1_qrouter_record[5] is match('^[A-Za-z0-9_.:-]{1,15}$')
      - student_hybrid_m11_c1_qrouter_record[6] is match('^[1-9][0-9]*$')
      - student_hybrid_m11_c1_qrouter_record[7] | lower == student_state.hybrid.m11.verification.gates.c1_api_paths.provider_port.mac_address | lower
    fail_msg: "A ligação Ubuntu/qrouter é ambígua ou não corresponde às portas Neutron atuais."
  no_log: true

- name: Keep only the measured Ubuntu and qrouter link identities
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_ubuntu_links:
      netns: "{{ student_hybrid_m11_c1_guest_link_record[0] }}"
      interface: "{{ student_hybrid_m11_c1_guest_link_record[1] }}"
      ifindex: "{{ student_hybrid_m11_c1_guest_link_record[2] | int }}"
      mac: "{{ student_state.hybrid.m11.verification.gates.ovs_attach.guest_interface_mac | lower }}"
    student_hybrid_m11_c1_qrouter_links:
      name: "{{ student_hybrid_m11_c1_qrouter_record[0] }}"
      netns: "{{ student_hybrid_m11_c1_qrouter_record[1] }}"
      tenant: {interface: "{{ student_hybrid_m11_c1_qrouter_record[2] }}", ifindex: "{{ student_hybrid_m11_c1_qrouter_record[3] | int }}", mac: "{{ student_hybrid_m11_c1_qrouter_record[4] | lower }}"}
      provider: {interface: "{{ student_hybrid_m11_c1_qrouter_record[5] }}", ifindex: "{{ student_hybrid_m11_c1_qrouter_record[6] | int }}", mac: "{{ student_hybrid_m11_c1_qrouter_record[7] | lower }}"}
  no_log: true

- name: Use the deterministic namespace only for a new create-only pass
  ansible.builtin.set_fact:
    student_hybrid_m11_namespace: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}"
  when: not student_hybrid_m11_positive_existing
  no_log: true

- name: Reuse only the namespace recorded by this run for a health recheck
  ansible.builtin.set_fact:
    student_hybrid_m11_namespace: "{{ student_state.hybrid.m11.verification.gates.namespace }}"
  when: student_hybrid_m11_positive_existing
  no_log: true

- name: Checkpoint the Cilium configuration phase before creating run-owned objects
  ansible.builtin.include_tasks: hybrid-m11-api-save.yml
  vars:
    student_hybrid_api_state_patch:
      status: partial
      phase: hybrid-cilium-configuring
      hybrid:
        phase: partial
        m11:
          phase: cilium-configuring
          verification:
            phase: cilium-configuring
  when: not student_hybrid_m11_positive_existing

- name: Reserve a new private directory for this run's Cilium objects
  ansible.builtin.stat:
    path: "{{ student_run_dir }}/m11-k8s"
    follow: false
  register: student_hybrid_m11_k8s_dir_before
  no_log: true
  when: not student_hybrid_m11_positive_existing

- name: Refuse a pre-existing run-owned Kubernetes manifest directory
  ansible.builtin.assert:
    that:
      - not (student_hybrid_m11_k8s_dir_before.stat.exists | default(false))
      - not (student_hybrid_m11_k8s_dir_before.stat.islnk | default(false))
    fail_msg: "Diretório de manifests M11 já existe sem checkpoint desta execução."
  no_log: true
  when: not student_hybrid_m11_positive_existing

- name: Create the private directory for exact M11 object manifests
  ansible.builtin.file:
    path: "{{ student_run_dir }}/m11-k8s"
    state: directory
    owner: "{{ student_uid }}"
    mode: '0700'
  when: not student_hybrid_m11_positive_existing

- name: Record the deterministic namespace for this run's probes
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_namespace == 'p010-hyb-' ~ student_state.run_id.split('-')[-1][:12]
    fail_msg: "Namespace M11 não corresponde ao identificador registrado desta execução."
  when: not student_hybrid_m11_positive_existing

- name: Render create-only BGP and workload objects with owner and run labels
  ansible.builtin.template:
    src: "{{ student_repo_root }}/poc-k8s-fabric/automation/student-lab/templates/{{ item.template }}"
    dest: "{{ student_run_dir }}/m11-k8s/{{ item.key }}.yaml"
    owner: "{{ student_uid }}"
    mode: '0600'
  loop:
    - {key: namespace, template: hybrid-m11-namespace.yml.j2}
    - {key: peer_config, template: hybrid-m11-peer-config.yml.j2}
    - {key: advertisement, template: hybrid-m11-advertisement.yml.j2}
    - {key: cluster_rack1, template: hybrid-m11-cluster-rack1.yml.j2}
    - {key: cluster_rack2, template: hybrid-m11-cluster-rack2.yml.j2}
    - {key: client_deployment, template: hybrid-m11-client.yml.j2}
    - {key: server_deployment, template: hybrid-m11-server.yml.j2}
  no_log: true
  when: not student_hybrid_m11_positive_existing

- name: Create each M11 object only after persisting its individual intent
  ansible.builtin.include_tasks: hybrid-m11-create-k8s-object.yml
  loop:
    - {key: namespace, kind: Namespace, name: "{{ student_hybrid_m11_namespace }}", namespace: '', manifest: "{{ student_run_dir }}/m11-k8s/namespace.yaml"}
    - {key: peer_config, kind: CiliumBGPPeerConfig, name: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-peer", namespace: '', manifest: "{{ student_run_dir }}/m11-k8s/peer_config.yaml"}
    - {key: advertisement, kind: CiliumBGPAdvertisement, name: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-pods", namespace: '', manifest: "{{ student_run_dir }}/m11-k8s/advertisement.yaml"}
    - {key: cluster_rack1, kind: CiliumBGPClusterConfig, name: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-rack1", namespace: '', manifest: "{{ student_run_dir }}/m11-k8s/cluster_rack1.yaml"}
    - {key: cluster_rack2, kind: CiliumBGPClusterConfig, name: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-rack2", namespace: '', manifest: "{{ student_run_dir }}/m11-k8s/cluster_rack2.yaml"}
    - {key: client_deployment, kind: Deployment, name: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-client", namespace: "{{ student_hybrid_m11_namespace }}", manifest: "{{ student_run_dir }}/m11-k8s/client_deployment.yaml"}
    - {key: server_deployment, kind: Deployment, name: "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-server", namespace: "{{ student_hybrid_m11_namespace }}", manifest: "{{ student_run_dir }}/m11-k8s/server_deployment.yaml"}
  loop_control:
    loop_var: student_hybrid_m11_k8s_object
    label: "{{ student_hybrid_m11_k8s_object.key }}"
  vars:
    student_hybrid_m11_k8s_key: "{{ student_hybrid_m11_k8s_object.key }}"
    student_hybrid_m11_k8s_kind: "{{ student_hybrid_m11_k8s_object.kind }}"
    student_hybrid_m11_k8s_name: "{{ student_hybrid_m11_k8s_object.name }}"
    student_hybrid_m11_k8s_namespace: "{{ student_hybrid_m11_k8s_object.namespace }}"
    student_hybrid_m11_k8s_manifest: "{{ student_hybrid_m11_k8s_object.manifest }}"
  when: not student_hybrid_m11_positive_existing

- name: Validate the saved private Kubernetes manifest directory before a health recheck
  ansible.builtin.stat:
    path: "{{ student_run_dir }}/m11-k8s"
    follow: false
  register: student_hybrid_m11_existing_k8s_dir
  when: student_hybrid_m11_positive_existing
  no_log: true

- name: Require the existing Kubernetes manifest directory to remain private and owned
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_existing_k8s_dir.stat.isdir | default(false)
      - not (student_hybrid_m11_existing_k8s_dir.stat.islnk | default(false))
      - student_hybrid_m11_existing_k8s_dir.stat.uid | int == student_uid
      - student_hybrid_m11_existing_k8s_dir.stat.mode == '0700'
      - student_hybrid_m11_namespace == student_state.hybrid.m11.verification.gates.namespace
    fail_msg: "O diretório privado ou namespace gravado da execução M11 divergiu."
  when: student_hybrid_m11_positive_existing
  no_log: true

- ansible.builtin.include_tasks: hybrid-m11-verify-k8s-objects.yml

- name: Wait for the run-owned client and HTTP server deployments
  ansible.builtin.command:
    argv:
      - "{{ student_tool_dir }}/kubectl"
      - --kubeconfig
      - "{{ student_state.kubeconfig }}"
      - --context
      - "{{ student_state.context }}"
      - rollout
      - status
      - "deployment/{{ item }}"
      - --namespace
      - "{{ student_hybrid_m11_namespace }}"
      - --timeout=240s
  become: true
  changed_when: false
  loop:
    - "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-client"
    - "p010-hyb-{{ student_state.run_id.split('-')[-1][:12] }}-server"
  no_log: true

- name: Read the only run-owned client and server pod records
  ansible.builtin.command:
    argv:
      - "{{ student_tool_dir }}/kubectl"
