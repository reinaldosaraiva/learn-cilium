---
- name: Require a fully verified lab before generating its environment
  ansible.builtin.assert:
    that:
      - student_has_state
      - student_state.status == 'up'
      - student_state.profile == student_profile_name
      - student_state.cluster_uid | length == 36
      - student_state.api_server | length > 0
      - student_state.kubeconfig_sha256 | length == 64
    fail_msg: "lab-env exige lab-up/lab-verify concluído e identidade íntegra."

- name: Require an explicit student session for the beginner guide
  ansible.builtin.assert:
    that:
      - student_state.exercise_session is mapping
      - student_state.exercise_session.id | default('') is match('^[0-9]{8}-[0-9a-f]{32}$')
      - student_state.exercise_session.namespace | default('') == 'p010-aluno-' ~ (student_state.exercise_session.id | default(''))
      - student_state.exercise_session.owner_uid | default(-1) | int == student_uid
      - student_state.exercise_session.owner_token | default('') == student_state.owner_token
      - student_state.exercise_session.cluster_uid | default('') == student_state.cluster_uid
    fail_msg: "Execute lab-session depois de lab-up antes de carregar o guia iniciante."
  when: student_state.profile == 'iniciantes'

- name: Read the exact source revision for the guide helpers
  ansible.builtin.command:
    argv: [git, -C, "{{ student_repo_root }}", rev-parse, --short=12, HEAD]
  register: student_guide_revision_result
  changed_when: false

- name: Require a concrete Git revision
  ansible.builtin.assert:
    that:
      - student_guide_revision_result.stdout is match('^[0-9a-f]{7,40}$')
    fail_msg: "Não foi possível identificar a revisão do guia."

- name: Refuse a symlink in the generated environment path
  ansible.builtin.stat:
    path: "{{ student_env_file }}"
    follow: false
  register: student_env_file_stat

- name: Refuse an existing symlink instead of writing through it
  ansible.builtin.assert:
    that:
      - not (student_env_file_stat.stat.islnk | default(false))
      - not (student_env_file_stat.stat.exists | default(false)) or student_env_file_stat.stat.uid | int == student_uid
      - not (student_env_file_stat.stat.exists | default(false)) or student_env_file_stat.stat.mode == '0600'
    fail_msg: "lab-env.sh existe com dono/permissões incorretos; não vou sobrescrevê-lo."

- name: Render only the allowlisted environment assignments
  ansible.builtin.template:
    src: "{{ student_repo_root }}/poc-k8s-fabric/automation/student-lab/templates/env.sh.j2"
    dest: "{{ student_env_file }}"
    owner: "{{ student_uid }}"
    mode: '0600'
  vars:
    student_guide_revision: "{{ student_guide_revision_result.stdout }}"

- name: Confirm the private environment file has the expected owner and mode
  ansible.builtin.stat:
    path: "{{ student_env_file }}"
    follow: false
  register: student_rendered_env_stat

- name: Require a regular private environment file
  ansible.builtin.assert:
    that:
      - student_rendered_env_stat.stat.isreg | default(false)
      - student_rendered_env_stat.stat.uid | int == student_uid
      - student_rendered_env_stat.stat.mode == '0600'
    fail_msg: "Arquivo de ambiente não ficou privado."

- name: Report environment readiness without printing credentials
  ansible.builtin.debug:
    msg: |
      Ambiente gerado em {{ student_env_file }} para {{ student_state.context }}.
      Carregue no shell atual assim, propagando falhas antes do eval:
      lab_env="$(make --no-print-directory lab-env LAB={{ student_profile_name }})" || exit 1
      eval "$lab_env"
      unset lab_env
      Com MAKEFLAGS incluindo w, mantenha --no-print-directory no Make raiz:
      GNU Make escreve seus próprios diagnósticos no stdout antes da receita.
