---
- name: Require saved OVS attachment identities before cleanup
  ansible.builtin.assert:
    that:
      - student_state.profile == 'hibrido'
      - student_state.status in ['partial', 'up']
      - student_state.hybrid.m11.verification.gates.ovs_attach.phase in ['attached', 'detaching']
      - student_state.hybrid.m11.verification.gates.ovs_attach.bridge_name == 'br-int'
      - student_state.hybrid.m11.verification.gates.ovs_attach.interface_name == 'tenant0'
      - student_state.hybrid.m11.verification.gates.ovs_attach.bridge_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - student_state.hybrid.m11.verification.gates.ovs_attach.port_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - student_state.hybrid.m11.verification.gates.ovs_attach.interface_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - student_state.hybrid.m11.verification.gates.ovs_attach.ifindex | int > 0
      - student_state.hybrid.m11.verification.gates.ovs_attach.ofport | int > 0
      - student_state.hybrid.m11.verification.gates.ovs_attach.neutron_port_id == student_state.hybrid.m11.api.resources.cirros_port.primary.id
    fail_msg: "OVS detach exige a interface e os UUIDs registrados; identidade ausente mantém a execução parcial."
  no_log: true

- name: Checkpoint the exact OVS detach intent before inspecting or removing the port
  ansible.builtin.set_fact:
    student_state: >-
      {{ student_state | combine({'status': 'partial', 'phase': 'hybrid-ovs-detach-pending',
        'hybrid': {'phase': 'partial', 'm11': {'phase': 'api-removing', 'verification': {
          'phase': 'api-removing', 'gates': {'ovs_attach': {
            'phase': 'detaching',
            'bridge_name': student_state.hybrid.m11.verification.gates.ovs_attach.bridge_name,
            'interface_name': student_state.hybrid.m11.verification.gates.ovs_attach.interface_name,
            'guest_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.guest_uuid,
            'neutron_port_id': student_state.hybrid.m11.verification.gates.ovs_attach.neutron_port_id,
            'attached_mac': student_state.hybrid.m11.verification.gates.ovs_attach.attached_mac,
            'guest_interface_mac': student_state.hybrid.m11.verification.gates.ovs_attach.guest_interface_mac,
            'bridge_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.bridge_uuid,
            'port_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.port_uuid,
            'interface_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.interface_uuid,
            'ifindex': student_state.hybrid.m11.verification.gates.ovs_attach.ifindex | int,
            'ofport': student_state.hybrid.m11.verification.gates.ovs_attach.ofport | int
          }}}}}, 'updated_utc': ansible_date_time.iso8601}, recursive=true) }}
  no_log: true

- name: Persist the OVS detach intent before the guest OVS query
  ansible.builtin.copy:
    dest: "{{ student_state_file }}"
    content: "{{ student_state | to_nice_json }}\n"
    owner: "{{ student_uid }}"
    mode: '0600'
  no_log: true

- name: Render the identity-checked OVS removal command
  ansible.builtin.set_fact:
    student_hybrid_m11_ovs_detach_script: >-
      {{ lookup('template', student_repo_root ~ '/poc-k8s-fabric/automation/student-lab/templates/hybrid-m11-ovs-detach.sh.j2') }}
  no_log: true

- name: Detach tenant0 only after matching its saved OVS and Neutron identities
  ansible.builtin.include_tasks: hybrid-m11-ssh.yml
  vars:
    student_hybrid_ssh_guest_name: ubuntu
    student_hybrid_ssh_remote_command: bash -se
    student_hybrid_ssh_stdin: "{{ student_hybrid_m11_ovs_detach_script }}"

- name: Require the guest to confirm exact absence after detach
  ansible.builtin.assert:
    that:
      - student_hybrid_ssh_result.stdout_lines | select('equalto', 'P010_OVS_DETACH=absent') | list | length == 1
    fail_msg: "OVS detach não comprovou a ausência da porta; a execução permanece parcial."
  no_log: true

- name: Checkpoint that the saved Neutron port is detached before API deletion
  ansible.builtin.set_fact:
    student_state: >-
      {{ student_state | combine({'phase': 'hybrid-ovs-detached',
        'hybrid': {'phase': 'partial', 'm11': {'phase': 'api-removing', 'verification': {
          'phase': 'api-removing', 'gates': {'ovs_attach': {
            'phase': 'detached',
            'bridge_name': student_state.hybrid.m11.verification.gates.ovs_attach.bridge_name,
            'interface_name': student_state.hybrid.m11.verification.gates.ovs_attach.interface_name,
            'guest_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.guest_uuid,
            'neutron_port_id': student_state.hybrid.m11.verification.gates.ovs_attach.neutron_port_id,
            'attached_mac': student_state.hybrid.m11.verification.gates.ovs_attach.attached_mac,
            'guest_interface_mac': student_state.hybrid.m11.verification.gates.ovs_attach.guest_interface_mac,
            'bridge_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.bridge_uuid,
            'port_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.port_uuid,
            'interface_uuid': student_state.hybrid.m11.verification.gates.ovs_attach.interface_uuid,
            'ifindex': student_state.hybrid.m11.verification.gates.ovs_attach.ifindex | int,
            'ofport': student_state.hybrid.m11.verification.gates.ovs_attach.ofport | int
          }}}}}, 'updated_utc': ansible_date_time.iso8601}, recursive=true) }}
  no_log: true

- name: Persist the detached state before deleting Neutron's port
  ansible.builtin.copy:
    dest: "{{ student_state_file }}"
    content: "{{ student_state | to_nice_json }}\n"
    owner: "{{ student_uid }}"
    mode: '0600'
  no_log: true
