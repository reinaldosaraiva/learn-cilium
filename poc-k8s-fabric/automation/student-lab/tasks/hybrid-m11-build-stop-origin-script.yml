        'text': (((student_hybrid_m11_c1_stop_output.stdout.split('P010_C1_CAPTURE_BEGIN=' ~ student_hybrid_m11_c1_observer.key, 1) | last).lstrip()).split('P010_C1_CAPTURE_END=' ~ student_hybrid_m11_c1_observer.key, 1) | first)
      }] }}
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
  no_log: true

- name: Replace one observer with its stopped but still identity-bound result
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_observer_stopped: "{{ student_hybrid_m11_c1_observer | combine({'phase': 'stopped', 'child_rc': student_hybrid_m11_c1_stop_result_record[1] | int, 'supervisor_rc': student_hybrid_m11_c1_stop_result_record[2] | int, 'transport_rc': student_hybrid_m11_c1_stop_output.rc | int, 'stream_bytes': student_hybrid_m11_c1_stop_result_record[3] | int, 'stream_sha256': student_hybrid_m11_c1_stop_result_record[4]}, recursive=false) }}"
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
  no_log: true

- name: Persist the stopped observer identity without saving packet text
  ansible.builtin.include_tasks: hybrid-m11-api-save.yml
  vars:
    student_hybrid_api_state_patch:
      status: partial
      phase: hybrid-c1-observer-stopped
      hybrid:
        phase: partial
