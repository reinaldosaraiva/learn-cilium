- name: Select this observer's bounded stop output
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_stop_output: "{{ student_hybrid_ssh_result if student_hybrid_m11_c1_observer.transport == 'guest' else student_hybrid_m11_c1_capture_stop_result }}"
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
  no_log: true

- name: Parse the stop status and delimited header-only stream in memory
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_stop_result_lines: "{{ student_hybrid_m11_c1_stop_output.stdout_lines | select('match', '^P010_C1_CAPTURE_RESULT=') | list }}"
    student_hybrid_m11_c1_stop_result_record: "{{ ((student_hybrid_m11_c1_stop_output.stdout_lines | select('match', '^P010_C1_CAPTURE_RESULT=') | first | regex_replace('^P010_C1_CAPTURE_RESULT=', '')).split('|')) }}"
    student_hybrid_m11_c1_stop_begin_lines: "{{ student_hybrid_m11_c1_stop_output.stdout_lines | select('equalto', 'P010_C1_CAPTURE_BEGIN=' ~ student_hybrid_m11_c1_observer.key) | list }}"
    student_hybrid_m11_c1_stop_end_lines: "{{ student_hybrid_m11_c1_stop_output.stdout_lines | select('equalto', 'P010_C1_CAPTURE_END=' ~ student_hybrid_m11_c1_observer.key) | list }}"
    student_hybrid_m11_c1_stop_begin_index: "{{ student_hybrid_m11_c1_stop_output.stdout_lines.index('P010_C1_CAPTURE_BEGIN=' ~ student_hybrid_m11_c1_observer.key) }}"
    student_hybrid_m11_c1_stop_end_index: "{{ student_hybrid_m11_c1_stop_output.stdout_lines.index('P010_C1_CAPTURE_END=' ~ student_hybrid_m11_c1_observer.key) }}"
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
