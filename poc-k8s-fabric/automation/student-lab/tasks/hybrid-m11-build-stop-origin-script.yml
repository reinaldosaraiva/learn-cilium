      - student_hybrid_m11_c1_stop_result_record | length == 5
      - student_hybrid_m11_c1_stop_result_record[0] == student_hybrid_m11_c1_observer.key
      - student_hybrid_m11_c1_stop_result_record[1] | int in [0, 130]
      - student_hybrid_m11_c1_stop_result_record[2] | int in [0, 130]
      - student_hybrid_m11_c1_stop_result_record[3] | int > 0
      - student_hybrid_m11_c1_stop_result_record[3] | int <= 65536
      - student_hybrid_m11_c1_stop_result_record[4] is match('^[0-9a-f]{64}$')
      - student_hybrid_m11_c1_stop_begin_lines | length == 1
      - student_hybrid_m11_c1_stop_end_lines | length == 1
      - student_hybrid_m11_c1_stop_end_index > student_hybrid_m11_c1_stop_begin_index
    fail_msg: "A captura C1 está incompleta, fora do limite ou terminou com erro; o estado permanece parcial."
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
  no_log: true

- name: Retain one raw stream only in transient memory for packet parsing
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_capture_streams: >-
      {{ (student_hybrid_m11_c1_capture_streams | default([])) + [{
        'key': student_hybrid_m11_c1_observer.key,
        'role': student_hybrid_m11_c1_observer.role,
