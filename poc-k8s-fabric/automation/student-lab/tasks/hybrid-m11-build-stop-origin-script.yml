          verification:
            phase: collecting
            gates:
              c1_capture_active:
                schema: 1
                check_id: "{{ student_state.hybrid.m11.verification.gates.c1_capture_active.check_id }}"
                phase: stopping
                observers: >-
                  {{ (student_state.hybrid.m11.verification.gates.c1_capture_active.observers
                     | rejectattr('key', 'equalto', student_hybrid_m11_c1_observer.key) | list) + [student_hybrid_m11_c1_observer_stopped] }}
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
  no_log: true

- name: Reload the exact stopped observer checkpoint before parsing
  ansible.builtin.set_fact:
    student_state: "{{ lookup('file', student_state_file) | from_json }}"
  when: student_hybrid_m11_c1_capture_action | default('') == 'stop'
  no_log: true

- name: Build the exact-file cleanup script for one stopped C1 observer
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_capture_cleanup_script: |-
      set -eu
      exec 3>&1 4>&2
      exec >/dev/null 2>&1
      capture={{ student_hybrid_m11_c1_observer.capture_path | quote }}
      proc_root=/proc
      supervisor_file="$capture.supervisor"
      tcpdump_file="$capture.tcpdump"
      rcfile="$capture.rc"
      tcpdump_pid={{ student_hybrid_m11_c1_observer.tcpdump_pid | int }}
      supervisor_pid={{ student_hybrid_m11_c1_observer.supervisor_pid | int }}
      if [ {{ student_hybrid_m11_c1_observer.transport | quote }} = guest ]; then
        run_as_root() { sudo -n "$@"; }
      else
        run_as_root() { "$@"; }
      fi
      [ -d "$proc_root" ]
      run_as_root /usr/bin/test -r $proc_root/1/stat
      process_present() {
        proc_pid="$1"
        if run_as_root /usr/bin/test -e "$proc_root/$proc_pid/stat"; then
          return 0
        fi
        run_as_root /usr/bin/test -r $proc_root/1/stat || exit 90
        return 1
      }
      if process_present "$tcpdump_pid"; then exit 91; fi
      if process_present "$supervisor_pid"; then exit 92; fi
      [ -f "$capture" ] && [ ! -L "$capture" ]
      [ "$(stat -c '%d|%i|%u|%a' "$capture")" = "{{ student_hybrid_m11_c1_observer.device }}|{{ student_hybrid_m11_c1_observer.inode }}|{{ student_hybrid_m11_c1_observer.file_uid }}|600" ]
      [ -f "$supervisor_file" ] && [ ! -L "$supervisor_file" ]
      [ "$(stat -c '%d|%i|%u|%a' "$supervisor_file")" = "{{ student_hybrid_m11_c1_observer.supervisor_file_device }}|{{ student_hybrid_m11_c1_observer.supervisor_file_inode }}|{{ student_hybrid_m11_c1_observer.supervisor_file_uid }}|{{ student_hybrid_m11_c1_observer.supervisor_file_mode }}" ]
      [ "$(cat "$supervisor_file")" = "$supervisor_pid" ]
      [ -f "$tcpdump_file" ] && [ ! -L "$tcpdump_file" ]
      [ "$(stat -c '%d|%i|%u|%a' "$tcpdump_file")" = "{{ student_hybrid_m11_c1_observer.tcpdump_file_device }}|{{ student_hybrid_m11_c1_observer.tcpdump_file_inode }}|{{ student_hybrid_m11_c1_observer.tcpdump_file_uid }}|{{ student_hybrid_m11_c1_observer.tcpdump_file_mode }}" ]
      [ "$(cat "$tcpdump_file")" = "$tcpdump_pid" ]
      [ -f "$rcfile" ] && [ ! -L "$rcfile" ]
      [ "$(stat -c '%d|%i|%u|%a' "$rcfile")" = "{{ student_hybrid_m11_c1_observer.rc_file_device }}|{{ student_hybrid_m11_c1_observer.rc_file_inode }}|{{ student_hybrid_m11_c1_observer.rc_file_uid }}|{{ student_hybrid_m11_c1_observer.rc_file_mode }}" ]
      [ "$(cat "$rcfile")" = "{{ student_hybrid_m11_c1_observer.child_rc }}|{{ student_hybrid_m11_c1_observer.supervisor_rc }}" ]
      rm -- "$capture" "$supervisor_file" "$tcpdump_file" "$rcfile"
      printf 'P010_C1_CAPTURE_REMOVED=%s\n' {{ student_hybrid_m11_c1_observer.key | quote }} >&3
  when: student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
  no_log: true

- name: Remove stopped C1 files in their measured network namespace
  ansible.builtin.command:
    argv: >-
      {{ [student_hybrid_nsenter_bin | default('/usr/bin/nsenter'), '--net=' ~ student_hybrid_m11_c1_observer.netns_path, '--', '/bin/sh', '-se'] }}
    stdin: "{{ student_hybrid_m11_c1_capture_cleanup_script }}"
    stdin_add_newline: false
  become: true
  register: student_hybrid_m11_c1_capture_cleanup_result
  changed_when: false
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.transport == 'netns'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Remove stopped C1 files through their pinned guest SSH identity
  ansible.builtin.include_tasks: hybrid-m11-ssh.yml
  vars:
    student_hybrid_ssh_guest_name: "{{ student_hybrid_m11_c1_observer.guest }}"
    student_hybrid_ssh_remote_command: sh -se
    student_hybrid_ssh_stdin: "{{ student_hybrid_m11_c1_capture_cleanup_script }}"
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.transport == 'guest'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Select the C1 cleanup output for its observer
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_cleanup_output: "{{ student_hybrid_ssh_result if student_hybrid_m11_c1_observer.transport == 'guest' else student_hybrid_m11_c1_capture_cleanup_result }}"
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Require exact removal marker before checkpointing the observer absent
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_cleanup_output.rc | int == 0
      - student_hybrid_m11_c1_cleanup_output.stdout_lines | select('equalto', 'P010_C1_CAPTURE_REMOVED=' ~ student_hybrid_m11_c1_observer.key) | list | length == 1
    fail_msg: "O cleanup C1 não comprovou a remoção dos arquivos de identidade exata."
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Replace one cleaned observer with an identity-free removed marker
  ansible.builtin.set_fact:
    student_hybrid_m11_c1_observer_removed:
      key: "{{ student_hybrid_m11_c1_observer.key }}"
      role: "{{ student_hybrid_m11_c1_observer.role }}"
      transport: "{{ student_hybrid_m11_c1_observer.transport }}"
      check_id: "{{ student_hybrid_m11_c1_observer.check_id }}"
      phase: removed
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Persist C1 observer file removal without retaining old active identities
  ansible.builtin.include_tasks: hybrid-m11-api-save.yml
  vars:
    student_hybrid_api_state_patch:
      status: partial
      phase: hybrid-c1-observer-removed
      hybrid:
        phase: partial
        m11:
          verification:
            phase: collecting
            gates:
              c1_capture_active:
                schema: 1
                check_id: "{{ student_state.hybrid.m11.verification.gates.c1_capture_active.check_id }}"
                phase: stopping
                observers: >-
                  {{ (student_state.hybrid.m11.verification.gates.c1_capture_active.observers
                     | rejectattr('key', 'equalto', student_hybrid_m11_c1_observer.key) | list) + [student_hybrid_m11_c1_observer_removed] }}
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Reload the exact C1 file-removal checkpoint
  ansible.builtin.set_fact:
    student_state: "{{ lookup('file', student_state_file) | from_json }}"
  when:
    - student_hybrid_m11_c1_capture_action | default('') == 'cleanup'
    - student_hybrid_m11_c1_observer.phase == 'stopped'
  no_log: true

- name: Render the origin-capture stop script with strict process-identity reads
  ansible.builtin.set_fact:
    student_hybrid_m11_stop_origin_script: |-
      set -eu
      exec 3>&1 4>&2
      exec >/dev/null 2>&1
      proc_root=/proc
      capture={{ student_state.hybrid.m11.verification.gates.traffic_capture.path | quote }}
      vm_ip={{ student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address | quote }}
      pod_ip={{ student_state.hybrid.m11.verification.gates.server_pod.ip | quote }}
      pid={{ student_state.hybrid.m11.verification.gates.traffic_capture.pid | quote }}
      expected_start={{ student_state.hybrid.m11.verification.gates.traffic_capture.starttime | quote }}
      expected_uid={{ student_state.hybrid.m11.verification.gates.traffic_capture.process_uid | quote }}
      expected_file={{ ((student_state.hybrid.m11.verification.gates.traffic_capture.device | string) ~ '|' ~ (student_state.hybrid.m11.verification.gates.traffic_capture.inode | string) ~ '|' ~ (student_state.hybrid.m11.verification.gates.traffic_capture.file_uid | string) ~ '|600') | quote }}
      if [ -e "$proc_root/$pid/stat" ]; then
        actual_start="$(sudo -n /usr/bin/awk '{ sub(/^.*\) /, ""); print $20 }' "$proc_root/$pid/stat")"
        if [ "$actual_start" = "$expected_start" ]; then
          [ "$(sudo -n /usr/bin/stat -c '%u' "$proc_root/$pid")" = "$expected_uid" ]
          cmdline="$(sudo -n /usr/bin/cat "$proc_root/$pid/cmdline" | tr '\000' ' ')"
          case "$cmdline" in
            *"/usr/bin/timeout --foreground 60 /usr/sbin/tcpdump -n -l -vv -c 1 -i tenant0 src host $vm_ip and dst host $pod_ip and tcp dst port 8080"*) ;;
            *) exit 71 ;;
          esac
          sudo -n /usr/bin/kill -INT "$pid"
          for _ in $(seq 1 20); do
            if [ -e "$proc_root/$pid/stat" ]; then
              current_start="$(sudo -n /usr/bin/awk '{ sub(/^.*\) /, ""); print $20 }' "$proc_root/$pid/stat")"
            else
              current_start=''
            fi
            [ "$current_start" != "$expected_start" ] && break
            sleep 1
          done
          if [ -e "$proc_root/$pid/stat" ]; then
            current_start="$(sudo -n /usr/bin/awk '{ sub(/^.*\) /, ""); print $20 }' "$proc_root/$pid/stat")"
          else
            current_start=''
          fi
          [ "$current_start" != "$expected_start" ]
        fi
      fi
      if [ -e "$capture" ] || [ -L "$capture" ]; then
        [ -f "$capture" ] && [ ! -L "$capture" ]
        [ "$(stat -c '%d|%i|%u|%a' "$capture")" = "$expected_file" ]
        rm -- "$capture"
      fi
      printf 'P010_M11_ORIGIN_CAPTURE=absent\n' >&3
  when: student_hybrid_m11_c1_capture_action | default('') == ''
  no_log: true

- name: Revalidate the current CRI container list for one saved C1 Pod
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec', student_hybrid_m11_c1_revalidation_target.value.worker_id,
          student_hybrid_m11_c1_runtime_by_key[student_hybrid_m11_c1_revalidation_target.key][4],
          '--runtime-endpoint', student_hybrid_m11_c1_runtime_by_key[student_hybrid_m11_c1_revalidation_target.key][0],
          '--image-endpoint', student_hybrid_m11_c1_runtime_by_key[student_hybrid_m11_c1_revalidation_target.key][0],
          '--timeout', '10s', '--debug=false', 'ps', '-o', 'json'] }}
  become: true
  register: student_hybrid_m11_c1_revalidation_containers
  changed_when: false
  when: student_hybrid_m11_c1_capture_action | default('') == 'revalidate'
  no_log: true

- name: Require the saved C1 container ID, labels, state, and attempt to remain current
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_revalidation_containers.rc | int == 0
      - (student_hybrid_m11_c1_revalidation_containers.stdout | from_json).keys() | list | sort == ['containers']
      - (student_hybrid_m11_c1_revalidation_containers.stdout | from_json).containers | selectattr('id', 'equalto', student_hybrid_m11_c1_revalidation_target.value.container_id) | list | length == 1
      - student_hybrid_m11_c1_revalidation_container.state == 'CONTAINER_RUNNING'
      - student_hybrid_m11_c1_revalidation_container.podSandboxId == student_hybrid_m11_c1_revalidation_target.value.sandbox_id
      - student_hybrid_m11_c1_revalidation_container.metadata.attempt | int == student_hybrid_m11_c1_revalidation_target.value.container_attempt | int
      - student_hybrid_m11_c1_revalidation_container.labels['io.kubernetes.pod.uid'] == student_hybrid_m11_c1_revalidation_target.value.pod_uid
      - student_hybrid_m11_c1_revalidation_container.labels['io.kubernetes.pod.name'] == student_hybrid_m11_c1_revalidation_target.value.pod_name
      - student_hybrid_m11_c1_revalidation_container.labels['io.kubernetes.pod.namespace'] == student_hybrid_m11_c1_revalidation_target.value.namespace
  vars:
    student_hybrid_m11_c1_revalidation_container: >-
      {{ (student_hybrid_m11_c1_revalidation_containers.stdout | from_json).containers
        | selectattr('id', 'equalto', student_hybrid_m11_c1_revalidation_target.value.container_id) | first }}
  when: student_hybrid_m11_c1_capture_action | default('') == 'revalidate'
  no_log: true

- name: Reinspect the saved C1 sandbox ID through the current CRI endpoint
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'exec', student_hybrid_m11_c1_revalidation_target.value.worker_id,
          student_hybrid_m11_c1_runtime_by_key[student_hybrid_m11_c1_revalidation_target.key][4],
          '--runtime-endpoint', student_hybrid_m11_c1_runtime_by_key[student_hybrid_m11_c1_revalidation_target.key][0],
          '--image-endpoint', student_hybrid_m11_c1_runtime_by_key[student_hybrid_m11_c1_revalidation_target.key][0],
          '--timeout', '10s', '--debug=false', 'inspectp', '-o', 'json', student_hybrid_m11_c1_revalidation_target.value.sandbox_id] }}
  become: true
  register: student_hybrid_m11_c1_revalidation_sandbox
  changed_when: false
  when: student_hybrid_m11_c1_capture_action | default('') == 'revalidate'
  no_log: true

- name: Require the current sandbox attempt and running process to match the saved join
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_revalidation_sandbox.rc | int == 0
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).keys() | list | sort == ['info', 'status']
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.id == student_hybrid_m11_c1_revalidation_target.value.sandbox_id
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.metadata.uid == student_hybrid_m11_c1_revalidation_target.value.pod_uid
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.metadata.name == student_hybrid_m11_c1_revalidation_target.value.pod_name
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.metadata.namespace == student_hybrid_m11_c1_revalidation_target.value.namespace
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.state == 'SANDBOX_READY'
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.metadata.attempt | int == student_hybrid_m11_c1_revalidation_target.value.sandbox_attempt | int
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.network.ip == student_hybrid_m11_c1_revalidation_target.value.pod_ip
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).info.pid | int == student_hybrid_m11_c1_revalidation_target.value.sandbox_pid | int
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).info.processStatus == 'running'
      - not (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).info.netNamespaceClosed | bool
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).info.runtimeType == student_hybrid_m11_c1_revalidation_target.value.runtime_type
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.runtimeHandler == student_hybrid_m11_c1_revalidation_target.value.runtime_handler
      - (student_hybrid_m11_c1_revalidation_sandbox.stdout | from_json).status.linux.namespaces.options.network == 'POD'
  when: student_hybrid_m11_c1_capture_action | default('') == 'revalidate'
  no_log: true

- name: Recheck the saved worker, sandbox proc bridge, netns, and Pod interface
  ansible.builtin.command:
    argv: [/bin/sh, -s]
    stdin: |-
      set -eu
      proc_root=/proc
      worker_pid={{ student_hybrid_m11_c1_revalidation_target.value.worker_host_pid | int }}
      sandbox_pid={{ student_hybrid_m11_c1_revalidation_target.value.sandbox_pid | int }}
      expected_worker_start={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[1] | quote }}
      expected_worker_uid={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[2] | quote }}
      expected_pidns={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[3] | quote }}
      expected_sandbox_start={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[5] | quote }}
      expected_sandbox_uid={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[6] | quote }}
      expected_netns={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[7] | quote }}
      expected_boot={{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity[8] | quote }}
      proc_starttime() {
        line="$(/bin/cat "$1")" || return 1
        case "$line" in *") "*) rest="$(printf '%s\n' "$line" | /usr/bin/sed 's/^.*) //')" ;; *) return 1 ;; esac
        set -- $rest
        [ "$#" -ge 20 ] || return 1
        field=0
        start=''
        for value do
          field=$((field + 1))
          if [ "$field" -eq 20 ]; then start="$value"; break; fi
        done
        case "$start" in ''|*[!0-9]*) return 1 ;; esac
        [ "$start" -gt 0 ] || return 1
        printf '%s\n' "$start"
      }
      worker_proc="$proc_root/$worker_pid"
      worker_root="$worker_proc/root/proc"
      sandbox_proc="$worker_root/$sandbox_pid"
      [ -r "$worker_proc/stat" ] && [ -r "$worker_proc/ns/pid" ]
      [ -r "$worker_root/1/ns/pid" ]
      [ "$(proc_starttime "$worker_proc/stat")" = "$expected_worker_start" ]
      [ "$(/usr/bin/stat -Lc '%u' "$worker_proc")" = "$expected_worker_uid" ]
      [ "$(/usr/bin/stat -Lc '%d:%i' "$worker_proc/ns/pid")" = "$expected_pidns" ]
      [ "$(/usr/bin/stat -Lc '%d:%i' "$worker_root/1/ns/pid")" = "$expected_pidns" ]
      [ -r "$sandbox_proc/stat" ] && [ -r "$sandbox_proc/status" ] && [ -r "$sandbox_proc/ns/net" ]
      [ "$(proc_starttime "$sandbox_proc/stat")" = "$expected_sandbox_start" ]
      [ "$(/usr/bin/stat -Lc '%u' "$sandbox_proc")" = "$expected_sandbox_uid" ]
      [ "$(/usr/bin/stat -Lc '%d:%i' "$sandbox_proc/ns/net")" = "$expected_netns" ]
      [ "$(/bin/cat "$worker_root/sys/kernel/random/boot_id")" = "$expected_boot" ]
      links="$(/usr/bin/nsenter --net="$sandbox_proc/ns/net" -- /usr/sbin/ip -j address show)"
      [ "$(proc_starttime "$worker_proc/stat")" = "$expected_worker_start" ]
      [ "$(proc_starttime "$sandbox_proc/stat")" = "$expected_sandbox_start" ]
      printf 'P010_C1_REVALIDATED_IDENTITY=%s|%s|%s|%s|%s|%s|%s|%s|%s\n' \
        "$worker_pid" "$expected_worker_start" "$expected_worker_uid" "$expected_pidns" \
        "$sandbox_pid" "$expected_sandbox_start" "$expected_sandbox_uid" "$expected_netns" "$expected_boot"
      printf 'P010_C1_REVALIDATED_LINKS=%s\n' "$links"
  become: true
  register: student_hybrid_m11_c1_revalidation_proc
  changed_when: false
  when: student_hybrid_m11_c1_capture_action | default('') == 'revalidate'
  no_log: true

- name: Require the revalidated Pod identity and interface to equal the measured values
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_c1_revalidation_proc.rc | int == 0
      - (student_hybrid_m11_c1_revalidation_proc.stdout_lines | select('match', '^P010_C1_REVALIDATED_IDENTITY=') | first | regex_replace('^P010_C1_REVALIDATED_IDENTITY=', '')).split('|') == student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].identity
      - student_hybrid_m11_c1_revalidation_link.ifindex | int == student_hybrid_m11_c1_revalidation_old_link.ifindex | int
      - student_hybrid_m11_c1_revalidation_link.ifname == student_hybrid_m11_c1_revalidation_old_link.ifname
      - student_hybrid_m11_c1_revalidation_link.address | lower == student_hybrid_m11_c1_revalidation_old_link.address | lower
      - student_hybrid_m11_c1_revalidation_link.addr_info | selectattr('family', 'equalto', 'inet') | selectattr('local', 'equalto', student_hybrid_m11_c1_revalidation_target.value.pod_ip) | list | length == 1
  vars:
    student_hybrid_m11_c1_revalidation_links: >-
      {{ (student_hybrid_m11_c1_revalidation_proc.stdout_lines | select('match', '^P010_C1_REVALIDATED_LINKS=') | first
          | regex_replace('^P010_C1_REVALIDATED_LINKS=', '')) | from_json }}
    student_hybrid_m11_c1_revalidation_address: >-
      {{ student_hybrid_m11_c1_revalidation_links | map(attribute='addr_info') | flatten
        | selectattr('family', 'equalto', 'inet')
        | selectattr('local', 'equalto', student_hybrid_m11_c1_revalidation_target.value.pod_ip) | first }}
    student_hybrid_m11_c1_revalidation_link: >-
      {{ student_hybrid_m11_c1_revalidation_links
        | selectattr('addr_info', 'contains', student_hybrid_m11_c1_revalidation_address) | first }}
    student_hybrid_m11_c1_revalidation_old_address: >-
      {{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].links
        | map(attribute='addr_info') | flatten
        | selectattr('family', 'equalto', 'inet')
        | selectattr('local', 'equalto', student_hybrid_m11_c1_revalidation_target.value.pod_ip) | first }}
    student_hybrid_m11_c1_revalidation_old_link: >-
      {{ student_hybrid_m11_c1_pod_observations[student_hybrid_m11_c1_revalidation_target.key].links
        | selectattr('addr_info', 'contains', student_hybrid_m11_c1_revalidation_old_address) | first }}
  when: student_hybrid_m11_c1_capture_action | default('') == 'revalidate'
  no_log: true
