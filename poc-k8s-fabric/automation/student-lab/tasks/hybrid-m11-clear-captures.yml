---
- name: Require confirmed remote capture cleanup before clearing saved identities
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_capture_cleanup_complete | default(false) | bool
    fail_msg: "As identidades da captura só podem ser limpas depois da remoção remota confirmada."
  no_log: true

- name: Record whether either capture map contains an identity to clear
  ansible.builtin.set_fact:
    student_hybrid_m11_capture_cleanup_needed: "{{ student_state.hybrid.m11.verification.gates.traffic_capture.phase | default('absent') != 'absent' or student_state.hybrid.m11.verification.gates.dhcp_capture.phase | default('absent') != 'absent' or student_state.hybrid.m11.verification.gates.c1_capture_active.phase | default('absent') != 'absent' }}"
  no_log: true

- name: Replace both capture maps without retaining old fields
  ansible.builtin.set_fact:
    student_state: >-
      {{ student_state | combine({'hybrid': student_state.hybrid | combine({
        'm11': student_state.hybrid.m11 | combine({
          'verification': student_state.hybrid.m11.verification | combine({
            'gates': student_state.hybrid.m11.verification.gates | combine({
              'traffic_capture': {'phase': 'absent', 'path': '', 'pid': 0, 'starttime': 0, 'process_uid': 0, 'file_uid': 0, 'device': 0, 'inode': 0, 'mode': ''},
              'dhcp_capture': {'phase': 'absent', 'path': '', 'result_path': '', 'client_mac': '', 'address': '', 'gateway': '', 'server_ip': '', 'server_mac': '', 'pid': 0, 'starttime': 0, 'process_uid': 0, 'netns': '', 'ifindex': 0, 'tcpdump_pid': 0, 'tcpdump_starttime': 0, 'tcpdump_uid': 0, 'tcpdump_netns': '', 'supervisor_pid': 0, 'supervisor_starttime': 0, 'supervisor_uid': 0, 'owner_uid': 0, 'device': 0, 'inode': 0, 'result_device': 0, 'result_inode': 0, 'result_owner_uid': 0, 'started_utc': '', 'completed_utc': '', 'capture_rc': -1, 'captured_count': 0, 'stop_requested': false, 'xid': ''},
              'c1_capture_active': {'schema': 1, 'check_id': '', 'phase': 'absent', 'observers': []}
            }, recursive=false)
          }, recursive=false)
        }, recursive=false)
      }, recursive=false)}, recursive=false) }}
  when: student_hybrid_m11_capture_cleanup_needed | bool
  no_log: true

- name: Persist the absent capture maps for repeated cleanup
  ansible.builtin.copy:
    dest: "{{ student_state_file }}"
    content: "{{ student_state | to_nice_json }}\n"
    owner: "{{ student_uid }}"
    mode: '0600'
  when: student_hybrid_m11_capture_cleanup_needed | bool
  no_log: true

- name: Reload the exact capture cleanup checkpoint
  ansible.builtin.set_fact:
    student_state: "{{ lookup('file', student_state_file) | from_json }}"
  when: student_hybrid_m11_capture_cleanup_needed | bool
  no_log: true

- name: Require cleared capture maps to be durable before the next cleanup phase
  ansible.builtin.assert:
    that:
      - student_state.hybrid.m11.verification.gates.traffic_capture == student_hybrid_m11_absent_traffic_capture
      - student_state.hybrid.m11.verification.gates.dhcp_capture == student_hybrid_m11_absent_dhcp_capture
      - student_state.hybrid.m11.verification.gates.c1_capture_active == student_hybrid_m11_absent_c1_capture_active
  when: student_hybrid_m11_capture_cleanup_needed | bool
  vars:
    student_hybrid_m11_absent_traffic_capture:
      phase: absent
      path: ''
      pid: 0
      starttime: 0
      process_uid: 0
      file_uid: 0
      device: 0
      inode: 0
      mode: ''
    student_hybrid_m11_absent_dhcp_capture:
      phase: absent
      path: ''
      result_path: ''
      client_mac: ''
      address: ''
      gateway: ''
      server_ip: ''
      server_mac: ''
      pid: 0
      starttime: 0
      process_uid: 0
      netns: ''
      ifindex: 0
      tcpdump_pid: 0
      tcpdump_starttime: 0
      tcpdump_uid: 0
      tcpdump_netns: ''
      supervisor_pid: 0
      supervisor_starttime: 0
      supervisor_uid: 0
      owner_uid: 0
      device: 0
      inode: 0
      result_device: 0
      result_inode: 0
      result_owner_uid: 0
      started_utc: ''
      completed_utc: ''
      capture_rc: -1
      captured_count: 0
      stop_requested: false
      xid: ''
    student_hybrid_m11_absent_c1_capture_active:
      schema: 1
      check_id: ''
      phase: absent
      observers: []
  no_log: true
