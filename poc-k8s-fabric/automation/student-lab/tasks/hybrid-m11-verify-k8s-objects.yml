---
- ansible.builtin.include_tasks: hybrid-m11-build-delete-k8s-specs.yml

- name: Require the complete saved M11 Kubernetes inventory before health verification
  ansible.builtin.assert:
    that:
      - student_state.hybrid.m11.verification.gates.k8s_pending | default({}) == {}
      - student_state.hybrid.m11.verification.gates.k8s_delete_pending | default({}) == {}
      - student_state.hybrid.m11.verification.gates.k8s_resources is mapping
      - student_state.hybrid.m11.verification.gates.k8s_resources.keys() | list | sort == ['advertisement', 'client_deployment', 'cluster_rack1', 'cluster_rack2', 'namespace', 'peer_config', 'server_deployment']
    fail_msg: "Verificação híbrida exige os sete UIDs Kubernetes salvos e nenhuma intenção incerta."
  no_log: true

- name: Re-read every saved Kubernetes object by its exact resource, namespace, and UID
  ansible.builtin.include_tasks: hybrid-m11-verify-k8s-object.yml
  loop: "{{ student_state.hybrid.m11.verification.gates.k8s_resources | dict2items }}"
  loop_control:
    loop_var: student_hybrid_m11_verify_k8s_entry
    label: "{{ student_hybrid_m11_verify_k8s_entry.key }}"
  vars:
    student_hybrid_m11_verify_k8s_key: "{{ student_hybrid_m11_verify_k8s_entry.key }}"
    student_hybrid_m11_verify_k8s_spec: "{{ student_hybrid_m11_delete_k8s_specs | selectattr('key', 'equalto', student_hybrid_m11_verify_k8s_entry.key) | first }}"
