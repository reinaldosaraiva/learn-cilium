---
- name: Require the captured transaction to match the fixed port, DHCP service, and guest
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_dora_fields.XID is match('^0x[0-9A-Fa-f]{8}$')
      - student_hybrid_m11_dora_fields.EXCHANGE == 'DISCOVER,OFFER,REQUEST,ACK'
      - student_hybrid_m11_dora_fields.CLIENT_MAC | lower == student_state.hybrid.guests.cirros.tenant_mac | lower
      - student_hybrid_m11_dora_fields.ADDRESS == student_state.hybrid.m11.api.resources.cirros_port.primary.fixed_ips[0].ip_address
      - student_hybrid_m11_dora_fields.GATEWAY == student_state.hybrid.m11.network.tenant_gateway
      - student_hybrid_m11_dora_fields.SERVER_IP == student_state.hybrid.m11.verification.gates.dhcp_server.ip_address
      - student_hybrid_m11_dora_fields.SERVER_MAC | lower == student_state.hybrid.m11.verification.gates.dhcp_server.mac_address | lower
      - student_hybrid_m11_dora_fields.CAPTURE_RC | int in [0, 130]
    fail_msg: "A transação DHCP capturada não corresponde ao MAC, endereço, servidor ou gateway desta execução."
  no_log: true
