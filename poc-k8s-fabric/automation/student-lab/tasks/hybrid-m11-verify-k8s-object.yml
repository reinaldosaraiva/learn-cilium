---
- name: Query one saved Kubernetes object by its run-owned name and scope
  ansible.builtin.command:
    argv: >-
      {{ [student_tool_dir ~ '/kubectl', '--kubeconfig', student_state.kubeconfig,
          '--context', student_state.context, 'get', student_hybrid_m11_verify_k8s_spec.resource,
          student_hybrid_m11_verify_k8s_entry.value.name]
         + (['--namespace', student_hybrid_m11_verify_k8s_entry.value.namespace]
            if student_hybrid_m11_verify_k8s_entry.value.namespace | length > 0 else [])
         + ['-o', 'json'] }}
  become: true
  register: student_hybrid_m11_verify_k8s_live
  changed_when: false
  no_log: true

- name: Require the live API object to retain its saved full apiVersion and UID
  ansible.builtin.assert:
    that:
      - student_hybrid_m11_verify_k8s_live.rc == 0
      - student_hybrid_m11_verify_k8s_live.stdout | from_json is mapping
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).apiVersion == student_hybrid_m11_verify_k8s_entry.value.api_version
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).kind == student_hybrid_m11_verify_k8s_entry.value.kind
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).metadata.name == student_hybrid_m11_verify_k8s_spec.name
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).metadata.namespace | default('') == student_hybrid_m11_verify_k8s_entry.value.namespace
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).metadata.uid == student_hybrid_m11_verify_k8s_entry.value.uid
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).metadata.labels['p010-student-owner'] == student_state.owner_token
      - (student_hybrid_m11_verify_k8s_live.stdout | from_json).metadata.labels['p010-student-run'] == student_state.run_id
      - student_hybrid_m11_verify_k8s_entry.value.api_version == student_hybrid_m11_verify_k8s_spec.api_version_full
      - student_hybrid_m11_verify_k8s_entry.value.namespace == student_hybrid_m11_verify_k8s_spec.namespace
    fail_msg: "Objeto Kubernetes ausente, substituído ou fora do namespace/versão registrados."
  no_log: true
