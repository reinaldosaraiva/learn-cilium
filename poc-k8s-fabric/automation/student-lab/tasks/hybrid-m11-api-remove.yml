    student_hybrid_api_resource_key: security_group_rules
    student_hybrid_api_slot: egress_icmp
    student_hybrid_api_collection_path: /security-group-rules
    student_hybrid_api_envelope: security_group_rule
    student_hybrid_api_delete_expected:
      tenant_id: "{{ student_hybrid_api_project_id }}"
      security_group_id: "{{ student_state.hybrid.m11.api.resources.security_group.primary.id }}"
      direction: egress
      ethertype: IPv4
      protocol: icmp
      remote_ip_prefix: "{{ student_profile.hybrid_network.pod_cidr }}"
  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.security_group_rules.egress_icmp.id | default('') is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Delete the explicit CirrOS TCP ingress policy
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: security_group_rules
    student_hybrid_api_slot: ingress_tcp
    student_hybrid_api_collection_path: /security-group-rules
    student_hybrid_api_envelope: security_group_rule
    student_hybrid_api_delete_expected:
      tenant_id: "{{ student_hybrid_api_project_id }}"
      security_group_id: "{{ student_state.hybrid.m11.api.resources.security_group.primary.id }}"
      direction: ingress
      ethertype: IPv4
      protocol: tcp
      port_range_min: "{{ student_profile.hybrid_m11.cirros_probe_tcp_port }}"
      port_range_max: "{{ student_profile.hybrid_m11.cirros_probe_tcp_port }}"
      remote_ip_prefix: "{{ student_profile.hybrid_network.pod_cidr }}"
  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.security_group_rules.ingress_tcp.id | default('') is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Delete the explicit Cilium pod CIDR ICMP ingress policy
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
