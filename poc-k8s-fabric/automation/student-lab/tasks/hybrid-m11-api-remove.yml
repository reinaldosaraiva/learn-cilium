- name: Delete the saved address scope after both pools are absent
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: address_scope
    student_hybrid_api_slot: primary
    student_hybrid_api_collection_path: /address-scopes
    student_hybrid_api_envelope: address_scope
    student_hybrid_api_delete_expected:
      tenant_id: "{{ student_hybrid_api_project_id }}"
