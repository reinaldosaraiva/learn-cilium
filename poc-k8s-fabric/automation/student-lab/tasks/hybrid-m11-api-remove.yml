- name: Detach the tenant subnet from the qrouter through Neutron's action endpoint
  ansible.builtin.include_tasks: hybrid-m11-api-remove-router-interface.yml
  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.router_interface.primary.id is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Clear the external gateway by router ID and verify Neutron removed its generated port
  ansible.builtin.include_tasks: hybrid-m11-api-clear-router-gateway.yml
  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.router.primary.id is match('^[0-9a-f-]{36}$')
    - student_state.hybrid.m11.api.resources.router_gateway_port.primary.id is match('^[0-9a-f-]{36}$')
  no_log: true

