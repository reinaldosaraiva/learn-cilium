- name: Delete the saved security group after all dependent rules and ports are absent
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: security_group
    student_hybrid_api_slot: primary
    student_hybrid_api_collection_path: /security-groups
