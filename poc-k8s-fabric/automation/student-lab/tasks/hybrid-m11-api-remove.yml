      remote_ip_prefix: ::/0
  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.security_group_rules.default_ipv6.id | default('') is match('^[0-9a-f-]{36}$')
  no_log: true

