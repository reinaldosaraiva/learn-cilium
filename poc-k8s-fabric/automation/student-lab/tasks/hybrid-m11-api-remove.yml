---
- name: Withdraw the provider network from the saved NDR speaker
  ansible.builtin.include_tasks: hybrid-m11-api-unlink.yml
  vars:
    student_hybrid_api_link_key: bgp_gateway_network
    student_hybrid_api_path: "/bgp-speakers/{{ student_state.hybrid.m11.api.resources.bgp_speaker.primary.id }}/remove_gateway_network"
    student_hybrid_api_body:
      network_id: "{{ student_state.hybrid.m11.api.resources.external_network.primary.id }}"
  when:
    - student_hybrid_api_remove_phase == 'routing'
    - student_state.hybrid.m11.api.links.bgp_gateway_network | default(false) | bool
  no_log: true

- name: Remove the saved border peer relationship from the NDR speaker
  ansible.builtin.include_tasks: hybrid-m11-api-unlink.yml
  vars:
    student_hybrid_api_link_key: bgp_peer
    student_hybrid_api_path: "/bgp-speakers/{{ student_state.hybrid.m11.api.resources.bgp_speaker.primary.id }}/remove_bgp_peer"
    student_hybrid_api_body:
      bgp_peer_id: "{{ student_state.hybrid.m11.api.resources.bgp_peer.primary.id }}"
  when:
    - student_hybrid_api_remove_phase == 'routing'
    - student_state.hybrid.m11.api.links.bgp_peer | default(false) | bool
  no_log: true

- name: Wait for NDR to withdraw every advertised route before deleting its speaker
  ansible.builtin.uri:
    url: "{{ student_state.hybrid.m11.api.neutron_endpoint }}/bgp-speakers/{{ student_state.hybrid.m11.api.resources.bgp_speaker.primary.id }}/get_advertised_routes"
    method: GET
    headers:
      X-Auth-Token: "{{ student_hybrid_api_token }}"
      Accept: application/json
    return_content: true
    status_code: [200]
    timeout: 15
    use_proxy: false
    follow_redirects: none
  register: student_hybrid_api_withdrawn_routes
  delegate_to: student_hybrid_ubuntu
  no_log: true
  changed_when: false
  retries: 30
  delay: 2
  until: student_hybrid_api_withdrawn_routes.json.advertised_routes | length == 0
  when:
    - student_hybrid_api_remove_phase == 'routing'
    - student_state.hybrid.m11.api.resources.bgp_speaker.primary.id is match('^[0-9a-f-]{36}$')

- ansible.builtin.include_tasks: hybrid-m11-api-unschedule.yml
  when:
    - student_hybrid_api_remove_phase == 'routing'
    - student_state.hybrid.m11.api.links.drinstance | default({}) is mapping
    - student_state.hybrid.m11.api.links.drinstance.agent_id | default('') | length > 0
  no_log: true

- name: Delete only the saved BGP speaker ID after withdrawal
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: bgp_speaker
    student_hybrid_api_slot: primary
    student_hybrid_api_collection_path: /bgp-speakers
    student_hybrid_api_envelope: bgp_speaker
    student_hybrid_api_delete_expected:
      tenant_id: "{{ student_hybrid_api_project_id }}"
      name: "{{ student_state.hybrid.m11.api.resources.bgp_speaker.primary.name }}"
  when:
    - student_hybrid_api_remove_phase == 'routing'
    - student_state.hybrid.m11.api.resources.bgp_speaker.primary.id is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Delete only the saved BGP peer ID after unlinking
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: bgp_peer
    student_hybrid_api_slot: primary
    student_hybrid_api_collection_path: /bgp-peers
    student_hybrid_api_envelope: bgp_peer
    student_hybrid_api_delete_expected:
      tenant_id: "{{ student_hybrid_api_project_id }}"
      name: "{{ student_state.hybrid.m11.api.resources.bgp_peer.primary.name }}"
  when:
    - student_hybrid_api_remove_phase == 'routing'
    - student_state.hybrid.m11.api.resources.bgp_peer.primary.id is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Delete the explicit CirrOS TCP egress policy
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: security_group_rules
    student_hybrid_api_slot: egress_tcp
    student_hybrid_api_collection_path: /security-group-rules
    student_hybrid_api_envelope: security_group_rule
    student_hybrid_api_delete_expected:
      tenant_id: "{{ student_hybrid_api_project_id }}"
      security_group_id: "{{ student_state.hybrid.m11.api.resources.security_group.primary.id }}"
      direction: egress
      ethertype: IPv4
      protocol: tcp
      port_range_min: 8080
      port_range_max: 8080
      remote_ip_prefix: "{{ student_profile.hybrid_network.pod_cidr }}"
  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.security_group_rules.egress_tcp.id | default('') is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Delete the explicit CirrOS ICMP egress policy
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
