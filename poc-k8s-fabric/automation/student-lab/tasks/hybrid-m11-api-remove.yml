  when:
    - student_hybrid_api_remove_phase == 'resources'
    - student_state.hybrid.m11.api.resources.tenant_network.primary.id is match('^[0-9a-f-]{36}$')
  no_log: true

- name: Delete the saved external provider network
  ansible.builtin.include_tasks: hybrid-m11-api-delete.yml
  vars:
    student_hybrid_api_resource_key: external_network
    student_hybrid_api_slot: primary
