apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: default
  labels:
    study: P004
spec:
  ipv4:
    cidrs:
      - 10.251.0.0/16
    maskSize: 24
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: p004-vm
  labels:
    study: P004
spec:
  ipv4:
    cidrs:
      - 10.252.0.0/16
    maskSize: 32
  namespaceSelector:
    matchLabels:
      study: P004
      ipam-pool: p004-vm
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: fabric-advertisements
  labels:
    advertise: fabric
    study: P004
spec:
  advertisements:
    - advertisementType: PodCIDR
      attributes:
        communities:
          standard:
            - "65301:100"
    - advertisementType: Service
      attributes:
        communities:
          standard:
            - "65301:200"
      selector:
        matchExpressions:
          - key: bgp-advertise
            operator: In
            values: ["true"]
      service:
        addresses:
          - LoadBalancerIP
    - advertisementType: CiliumPodIPPool
      attributes:
        communities:
          standard:
            - "65301:100"
      selector:
        matchExpressions:
          - key: study
            operator: In
            values: ["P004", "P003"]
