apiVersion: v1
kind: Namespace
metadata:
  name: p004-vm-reuse
  labels:
    study: P004
    ipam-pool: p004-single-ip
  annotations:
    ipam.cilium.io/require-pool-match: "true"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: default
  labels:
    study: P004
spec:
  ipv4:
    cidrs:
      - 10.251.0.0/16
    maskSize: 24
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: p004-vm
  labels:
    study: P004
spec:
  ipv4:
    cidrs:
      - 10.252.0.0/16
    maskSize: 32
  namespaceSelector:
    matchLabels:
      study: P004
      ipam-pool: p004-vm
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: p004-single-ip
  labels:
    study: P004
spec:
  ipv4:
    cidrs:
      - 10.253.0.100/32
    maskSize: 32
  namespaceSelector:
    matchLabels:
      study: P004
      ipam-pool: p004-single-ip
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: v04-target-allow-vma-identity
  namespace: p004-vm-a
  labels:
    study: P004
spec:
  endpointSelector:
    matchLabels:
      app: p004-target-srv
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: p004-vm-reuse
            app: p004-vm-a
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
