apiVersion: v1
kind: Namespace
metadata:
  name: p004-vm-a
  labels:
    study: P004
    ipam-pool: p004-vm
---
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  namespace: p004-vm-a
  labels:
    app: p004-client-a
    study: P004
spec:
  nodeSelector:
    kubernetes.io/hostname: p003-gw-worker2
  containers:
    - name: net
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: client-b
  namespace: p004-vm-a
  labels:
    app: p004-client-b
    study: P004
spec:
  nodeSelector:
    kubernetes.io/hostname: p003-gw-worker2
  containers:
    - name: net
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: target-srv
  namespace: p004-vm-a
  labels:
    app: p004-target-srv
    study: P004
spec:
  nodeSelector:
    kubernetes.io/hostname: p003-gw-worker2
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      imagePullPolicy: IfNotPresent
      args: ["netexec", "--http-port=8080"]
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
      ports:
        - containerPort: 8080
          name: http
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
