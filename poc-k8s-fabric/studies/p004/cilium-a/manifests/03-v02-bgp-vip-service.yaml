apiVersion: v1
kind: Service
metadata:
  name: vm-a-vip
  namespace: p004-vm-a
  labels:
    app: p004-vm-a
    study: P004
    bgp-advertise: "true"
  annotations:
    lbipam.cilium.io/ips: "10.202.255.20"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: p004-vm-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: echo
      port: 9999
      targetPort: 9999
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
