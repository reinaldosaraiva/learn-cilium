# P004-S005 (V04 / V06) — Cilium 1.20.2 Multi-Pool IPAM (/32 per VM) no p003-gw.
# Base: studies/p003/base/values-p003.yaml + studies/p003/cases/s010/values-m32.yaml.
# Nota: p004-single-ip (usado em V04) fica fora de multiPoolPreAllocation para que o único /32
# (10.253.0.100/32) seja alocado sob demanda exclusivamente ao nó onde a VM de V04 é agendada.

cluster:
  name: p003-gw
  id: 2

routingMode: native
ipv4NativeRoutingCIDR: "10.240.0.0/12"
autoDirectNodeRoutes: true
directRoutingSkipUnreachable: true
endpointRoutes:
  enabled: true

devices: "eth+"

ipam:
  mode: multi-pool
  multiPoolPreAllocation: "default=8,p004-vm=8"

k8s:
  requireIPv4PodCIDR: false

MTU: 1500

kubeProxyReplacement: true
k8sServiceHost: "172.19.0.7"
k8sServicePort: 6443

enableIPv4Masquerade: true
bpf:
  masquerade: true

loadBalancer:
  algorithm: maglev
  mode: snat

bgpControlPlane:
  enabled: true

gatewayAPI:
  enabled: true
  gatewayClass:
    create: true
l7Proxy: true

hubble:
  enabled: false
prometheus:
  enabled: false
operator:
  replicas: 1
