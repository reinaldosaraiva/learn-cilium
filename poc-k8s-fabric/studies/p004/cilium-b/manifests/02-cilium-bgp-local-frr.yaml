apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: local-frr-peer
  labels:
    study: P004
spec:
  transport:
    peerPort: 1790
  timers:
    connectRetryTimeSeconds: 3
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  ebgpMultihop: 2
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: fabric
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: rack1
  labels:
    study: P004
spec:
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/rack: rack1
  bgpInstances:
    - name: "rack1"
      localASN: 65311
      peers:
        - name: "frr-local-rack1"
          peerASN: 65301
          peerAddress: "10.255.255.1"
          peerConfigRef:
            name: "local-frr-peer"
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: rack2
  labels:
    study: P004
spec:
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/rack: rack2
  bgpInstances:
    - name: "rack2"
      localASN: 65312
      peers:
        - name: "frr-local-rack2"
          peerASN: 65302
          peerAddress: "10.255.255.1"
          peerConfigRef:
            name: "local-frr-peer"
