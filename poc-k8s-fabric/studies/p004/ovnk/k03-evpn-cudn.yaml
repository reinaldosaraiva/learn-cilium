apiVersion: v1
kind: Namespace
metadata:
  name: tenant-evpn
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    tenant: tenant-evpn
---
apiVersion: k8s.ovn.org/v1
kind: VTEP
metadata:
  name: vtep-evpn
spec:
  cidrs:
    - "172.18.0.0/16"
  mode: Unmanaged
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: cudnevpn
  labels:
    network: cudnevpn
    evpn: "true"
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: tenant-evpn
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - "10.0.0.0/24"
      ipam:
        lifecycle: Persistent
    transport: EVPN
    evpn:
      vtep: vtep-evpn
      macVRF:
        vni: 20100
        routeTarget: "65000:20100"
      ipVRF:
        vni: 10100
        routeTarget: "65000:10100"
---
apiVersion: k8s.ovn.org/v1
kind: RouteAdvertisements
metadata:
  name: ra-evpn
spec:
  targetVRF: cudnevpn
  advertisements:
    - PodNetwork
  nodeSelector: {}
  frrConfigurationSelector:
    matchLabels:
      evpn-fabric: "true"
  networkSelectors:
    - networkSelectionType: ClusterUserDefinedNetworks
      clusterUserDefinedNetworkSelector:
        networkSelector:
          matchLabels:
            evpn: "true"
