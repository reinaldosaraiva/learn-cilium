apiVersion: k8s.cni.cncf.io/v1alpha1
kind: IPAMClaim
metadata:
  name: vm-a-udn
  namespace: tenant-a
spec:
  network: tenant-a_udn-net-a
  interface: ovn-udn1
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-a
  namespace: tenant-a
  labels:
    app: vm-a
    tenant: tenant-a
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-a
        app: vm-a
        tenant: tenant-a
      annotations:
        k8s.ovn.org/openflow-ports: ""
        v1.multus-cni.io/default-network: '[{"namespace":"ovn-kubernetes","name":"default","ips":["10.0.0.11/24"],"mac":"02:00:10:00:01:11","ipam-claim-reference":"vm-a-udn"}]'
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 192Mi
        devices:
          autoattachSerialConsole: true
          logSerialConsole: true
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              binding:
                name: l2bridge
              macAddress: "02:00:10:00:01:11"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-container-disk-demo:v1.9.0
        - name: cloudinitdisk
          cloudInitNoCloud:
            networkData: |
              version: 2
              ethernets:
                eth0:
                  match:
                    macaddress: "02:00:10:00:01:11"
                  addresses:
                    - 10.0.0.11/24
                  gateway4: 10.0.0.1
            userData: |
              #!/bin/sh
              ip link set eth0 up
              ip addr replace 10.0.0.11/24 dev eth0
              ip route replace default via 10.0.0.1 dev eth0 || true
              rm -f /tmp/k02fifo && mkfifo /tmp/k02fifo
              nohup sh -c 'while true; do cat /tmp/k02fifo | nc -l -p 9999 > /tmp/k02fifo 2>/dev/null || cat /tmp/k02fifo | nc -l 9999 > /tmp/k02fifo 2>/dev/null || sleep 1; done' >/dev/null 2>&1 &
              nohup sh -c 'while true; do ip -4 -o addr show dev eth0 | awk "{print \"GUEST_OS_IP=\" \$4}" > /dev/ttyS0 2>/dev/null || true; sleep 2; done' >/dev/null 2>&1 &
