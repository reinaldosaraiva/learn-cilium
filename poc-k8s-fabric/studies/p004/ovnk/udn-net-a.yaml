apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    tenant: tenant-a
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: udn-net-a
  namespace: tenant-a
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - "10.0.0.0/24"
    ipam:
      lifecycle: Persistent
