frr defaults traditional
hostname evpnfab-gw1
service integrated-vtysh-config
!
vrf vrf-tenant-a
 vni 10100
exit-vrf
!
router bgp 65001
 bgp router-id 170.168.0.5
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 170.168.0.8 remote-as 65002
 neighbor 170.168.0.8 ebgp-multihop 2
 !
 address-family l2vpn evpn
  neighbor 170.168.0.8 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65001 vrf vrf-tenant-a
 bgp router-id 170.168.0.5
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  network 10.0.0.0/24
 exit-address-family
 !
 address-family l2vpn evpn
  rd 170.168.0.5:10100
  route-target import 65000:10100
  route-target export 65000:10100
  advertise ipv4 unicast
 exit-address-family
exit
!
line vty
!
