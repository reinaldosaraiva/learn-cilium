frr defaults traditional
hostname evpnfab-peer
service integrated-vtysh-config
!
vrf vrf-tenant-a
 vni 10100
exit-vrf
!
vrf vrf-tenant-b
 vni 10200
exit-vrf
!
router bgp 65002
 bgp router-id 170.168.0.8
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 170.168.0.5 remote-as 65001
 neighbor 170.168.0.5 ebgp-multihop 2
 neighbor 170.168.0.6 remote-as 65001
 neighbor 170.168.0.6 ebgp-multihop 2
 !
 address-family l2vpn evpn
  neighbor 170.168.0.5 activate
  neighbor 170.168.0.6 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65002 vrf vrf-tenant-a
 bgp router-id 170.168.0.8
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  network 10.251.0.1/32
 exit-address-family
 !
 address-family l2vpn evpn
  rd 170.168.0.8:10100
  route-target import 65000:10100
  route-target export 65000:10100
  advertise ipv4 unicast
 exit-address-family
exit
!
router bgp 65002 vrf vrf-tenant-b
 bgp router-id 170.168.0.8
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  network 10.252.0.1/32
 exit-address-family
 !
 address-family l2vpn evpn
  rd 170.168.0.8:10200
  route-target import 65000:10200
  route-target export 65000:10200
  advertise ipv4 unicast
 exit-address-family
exit
!
line vty
!
