! Explicit BGP EVPN Type-5 route withdrawal sequence (N1 / R7)
! Executed on evpnfab-gw1 and evpnfab-gw2 (AS 65001) and evpnfab-peer (AS 65002)
! before deleting logical switch ports or stopping containers.
!
! On evpnfab-gw1:
!   vtysh -c "configure terminal" -c "no router bgp 65001 vrf vrf-tenant-a" -c "no router bgp 65001" -c "end"
! On evpnfab-gw2:
!   vtysh -c "configure terminal" -c "no router bgp 65001 vrf vrf-tenant-b" -c "no router bgp 65001" -c "end"
! On evpnfab-peer:
!   vtysh -c "configure terminal" -c "no router bgp 65002 vrf vrf-tenant-a" -c "no router bgp 65002 vrf vrf-tenant-b" -c "no router bgp 65002" -c "end"
