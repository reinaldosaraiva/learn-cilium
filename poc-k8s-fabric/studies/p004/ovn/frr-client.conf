!
! Cliente on-prem da réplica. As duas pernas são portas access VLAN 100/200
! no br-ovn-ext; o mesmo formato pode ser instanciado para o cliente X05.
!
frr version 8.4.1
frr defaults traditional
hostname dci-client-1
service integrated-vtysh-config
!
ip prefix-list MG-TO-TENANT seq 10 permit 192.168.100.0/24
ip prefix-list MG-TO-PEER seq 10 permit 10.0.0.0/16
route-map MG-TO-TENANT permit 10
 match ip address prefix-list MG-TO-TENANT
route-map MG-TO-PEER permit 10
 match ip address prefix-list MG-TO-PEER
!
ip route 10.0.0.0/16 Null0
!
router bgp 200
 bgp router-id 10.0.0.1
 neighbor 169.254.254.1 remote-as 100
 neighbor 169.254.254.1 bfd
 neighbor 169.254.254.5 remote-as 100
 neighbor 169.254.254.5 bfd
 address-family ipv4 unicast
  network 10.0.0.0/16
  neighbor 169.254.254.1 activate
  neighbor 169.254.254.1 route-map MG-TO-TENANT in
  neighbor 169.254.254.1 route-map MG-TO-PEER out
  neighbor 169.254.254.5 activate
  neighbor 169.254.254.5 route-map MG-TO-TENANT in
  neighbor 169.254.254.5 route-map MG-TO-PEER out
  maximum-paths 2
 exit-address-family
!
bfd
 peer 169.254.254.1 interface eth1
  no shutdown
  receive-interval 500
  transmit-interval 500
  detect-multiplier 3
 peer 169.254.254.5 interface eth2
  no shutdown
  receive-interval 500
  transmit-interval 500
  detect-multiplier 3
!
