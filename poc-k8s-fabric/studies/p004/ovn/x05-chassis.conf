!
! P004-S002/X05: instância FRR temporária no ovn-chassis-2.
! Ela usa o VRF 400 e o L3VNI 50200; o pathspace x05 é distinto do m03.
!
frr defaults traditional
hostname ovn-chassis-2-x05
service integrated-vtysh-config
!
ip prefix-list X05-TENANT-EXPORT seq 5 permit 192.168.100.0/24
route-map X05-TENANT-EXPORT permit 10
 match ip address prefix-list X05-TENANT-EXPORT
exit
!
vrf ovnvrf-x05-b
 vni 50200
exit-vrf
!
router bgp 65101
 bgp router-id 170.168.0.6
 no bgp ebgp-requires-policy
 neighbor 170.168.0.8 remote-as 65201
 address-family ipv4 unicast
  neighbor 170.168.0.8 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 170.168.0.8 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65101 vrf ovnvrf-x05-b
 bgp router-id 170.168.0.6
 no bgp ebgp-requires-policy
 address-family ipv4 unicast
  redistribute kernel route-map X05-TENANT-EXPORT
  redistribute connected route-map X05-TENANT-EXPORT
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
