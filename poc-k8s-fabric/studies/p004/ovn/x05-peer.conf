!
! P004-S002/X05: peer EVPN temporário do tenant B.
! O peer EVPN usa a fonte exclusiva 10.251.0.1/32. O cliente on-prem B
! continua usando 10.0.0.1/32; os dois papéis não são confundidos.
!
frr defaults traditional
hostname mgc-x05-peer-2
service integrated-vtysh-config
!
ip prefix-list X05-PEER-EXPORT seq 5 permit 10.251.0.1/32
route-map X05-PEER-EXPORT permit 10
 match ip address prefix-list X05-PEER-EXPORT
exit
!
vrf vrf-x05-peer
 vni 50200
exit-vrf
!
router bgp 65201
 bgp router-id 10.251.0.1
 no bgp ebgp-requires-policy
 neighbor 170.168.0.6 remote-as 65101
 address-family ipv4 unicast
  neighbor 170.168.0.6 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 170.168.0.6 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65201 vrf vrf-x05-peer
 bgp router-id 10.251.0.1
 no bgp ebgp-requires-policy
 address-family ipv4 unicast
  redistribute kernel route-map X05-PEER-EXPORT
  redistribute connected route-map X05-PEER-EXPORT
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
