vrf ovnvrf400
exit-vrf
!
router bgp 100 vrf ovnvrf400
 bgp router-id 169.254.254.5
 neighbor 169.254.254.6 remote-as 201
 neighbor 169.254.254.6 bfd
 address-family ipv4 unicast
  network 192.168.100.0/24
  redistribute connected
  neighbor 169.254.254.6 activate
  neighbor 169.254.254.6 route-map MG-FROM-CLIENT in
  neighbor 169.254.254.6 route-map MG-TO-CLIENT out
 exit-address-family
!
bfd
 peer 169.254.254.6 vrf ovnvrf400
  no shutdown
  receive-interval 500
  transmit-interval 500
  detect-multiplier 3
!
