!
! P004-S002/M03: FRR EVPN isolado no chassis do tenant.
! A instância é iniciada no pathspace /run/frr/m03 pelo m03.sh.
!
frr defaults traditional
hostname ovn-chassis-1-m03
service integrated-vtysh-config
!
ip prefix-list M03-TENANT-EXPORT seq 5 permit 192.168.100.0/24
route-map M03-TENANT-EXPORT permit 10
 match ip address prefix-list M03-TENANT-EXPORT
exit
!
vrf ovnvrf-tenant
 vni 50100
exit-vrf
!
router bgp 65100
 bgp router-id 170.168.0.5
 no bgp ebgp-requires-policy
 neighbor 170.168.0.7 remote-as 65200
 address-family ipv4 unicast
  neighbor 170.168.0.7 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 170.168.0.7 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65100 vrf ovnvrf-tenant
 bgp router-id 170.168.0.5
 no bgp ebgp-requires-policy
 address-family ipv4 unicast
  redistribute kernel route-map M03-TENANT-EXPORT
  redistribute connected route-map M03-TENANT-EXPORT
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
