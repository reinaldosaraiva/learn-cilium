!
! P004-S002/X05: cliente on-prem B, separado por VLAN/VRF dos campos 100/200.
! O CIDR anunciado e o router-id são deliberadamente iguais aos de
! dci-client-1; o AS e as interfaces pertencem ao contexto X05.
!
frr version 8.4.1
frr defaults traditional
hostname dci-client-2
service integrated-vtysh-config
!
ip prefix-list X05-TO-TENANT seq 10 permit 192.168.100.0/24
ip prefix-list X05-TO-PEER seq 10 permit 10.0.0.0/16
route-map X05-TO-TENANT permit 10
 match ip address prefix-list X05-TO-TENANT
route-map X05-TO-PEER permit 10
 match ip address prefix-list X05-TO-PEER
!
ip route 10.0.0.0/16 Null0
!
router bgp 201
 bgp router-id 10.0.0.1
 neighbor 169.254.254.1 remote-as 100
 neighbor 169.254.254.1 bfd
 neighbor 169.254.254.5 remote-as 100
 neighbor 169.254.254.5 bfd
 address-family ipv4 unicast
  network 10.0.0.0/16
  neighbor 169.254.254.1 activate
  neighbor 169.254.254.1 route-map X05-TO-TENANT in
  neighbor 169.254.254.1 route-map X05-TO-PEER out
  neighbor 169.254.254.5 activate
  neighbor 169.254.254.5 route-map X05-TO-TENANT in
  neighbor 169.254.254.5 route-map X05-TO-PEER out
  maximum-paths 2
 exit-address-family
!
bfd
 peer 169.254.254.1 interface eth1
  no shutdown
  receive-interval 500
  transmit-interval 500
  detect-multiplier 3
 peer 169.254.254.5 interface eth2
  no shutdown
  receive-interval 500
  transmit-interval 500
  detect-multiplier 3
!
