!
! P004-S002/M03: peer EVPN temporário, sem relação com mgc-client-1.
! O container usa a imagem OVN pinned e seu próprio VRF/VNI.
!
frr defaults traditional
hostname mgc-evpn-client-1
service integrated-vtysh-config
!
ip prefix-list M03-CLIENT-EXPORT seq 5 permit 10.250.0.1/32
route-map M03-CLIENT-EXPORT permit 10
 match ip address prefix-list M03-CLIENT-EXPORT
exit
!
vrf vrf-evpn-client
 vni 50100
exit-vrf
!
router bgp 65200
 bgp router-id 10.250.0.1
 no bgp ebgp-requires-policy
 neighbor 170.168.0.5 remote-as 65100
 address-family ipv4 unicast
  neighbor 170.168.0.5 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 170.168.0.5 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65200 vrf vrf-evpn-client
 bgp router-id 10.250.0.1
 no bgp ebgp-requires-policy
 address-family ipv4 unicast
  redistribute kernel route-map M03-CLIENT-EXPORT
  redistribute connected route-map M03-CLIENT-EXPORT
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
