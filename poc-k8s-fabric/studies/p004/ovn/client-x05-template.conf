!
! Contrato X05. Gere o frr.conf funcional com client-x05-template.sh antes de
! copiar o arquivo para outro container. A chave de isolamento é a VLAN/VRF;
! os endereços /30 e o CIDR anunciado podem ser iguais aos do cliente 1.
!
! CLIENT_NAME=<nome> CLIENT_AS=<AS> ROUTER_ID=<ip-local>
! PEER_1=<gateway-ip> PEER_2=<gateway-ip>
! ONPREM_PREFIX=<cidr-on-prem> TENANT_PREFIX=<cidr-tenant>
! INTERFACE_1=eth1 INTERFACE_2=eth2
!
! O helper do perfil recebe (nome, VLAN, interfaces, endereços /30, AS e
! arquivo FRR), portanto não depende de mgc-client-1 nem de VLAN 100/200.
