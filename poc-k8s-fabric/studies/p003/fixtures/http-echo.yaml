# Fixture HTTP (GW01): agnhost netexec, marcador = hostname do pod no corpo.
# Base: k8s/apps/10-echo-deployment.yaml (k01).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: p003-gateway
  labels: { app: http-echo, study: P003 }
spec:
  replicas: 3
  selector:
    matchLabels: { app: http-echo }
  template:
    metadata:
      labels: { app: http-echo, study: P003 }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: http-echo }
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - { containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: http-echo
  namespace: p003-gateway
  labels: { app: http-echo, study: P003 }
spec:
  selector: { app: http-echo }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
