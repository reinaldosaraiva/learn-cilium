! =============================================================================
! p003 border1 - roteador de borda FRR | AS 65400
! Base: configs/frr/frr.conf (k01), IPs do envelope S003.
! Diferencas do k01:
!   - SEM rota 172.18.0.0/16 (nenhuma exposicao a VPC)
!   - IPv4 only (sem secao ipv6)
!   - anuncia 198.19.0.0/24 (client) em vez de 203.0.113.0/24
! =============================================================================
frr defaults datacenter
hostname p003-border1
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.1.1.254/32
!
interface eth1
 description to-leaf3
 ip address 10.254.0.1/31
 mtu 9216
!
interface eth2
 description to-client
 ip address 198.19.0.1/24
 mtu 1500
!
interface eth3
 description to-host-netns (debug; nao e VPC)
 ip address 10.101.0.2/30
 mtu 1500
!
ip prefix-list PL-FROM-FABRIC seq 10 permit 10.245.0.0/16 le 32
ip prefix-list PL-FROM-FABRIC seq 20 permit 10.202.255.0/24 le 32
ip prefix-list PL-FROM-FABRIC seq 30 permit 10.30.0.0/16 le 24
ip prefix-list PL-FROM-FABRIC seq 40 permit 10.1.0.0/16 le 32
!
ip prefix-list PL-TO-FABRIC seq 10 permit 0.0.0.0/0
ip prefix-list PL-TO-FABRIC seq 20 permit 198.19.0.0/24
!
route-map RM-FROM-FABRIC permit 10
 match ip address prefix-list PL-FROM-FABRIC
!
route-map RM-TO-FABRIC permit 10
 match ip address prefix-list PL-TO-FABRIC
!
router bgp 65400
 bgp router-id 10.1.1.254
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.254.0.0 remote-as 65203
 neighbor 10.254.0.0 description leaf3-border
 neighbor 10.254.0.0 timers 3 9
 neighbor 10.254.0.0 bfd
 !
 address-family ipv4 unicast
  network 198.19.0.0/24
  maximum-paths 16
  neighbor 10.254.0.0 activate
  neighbor 10.254.0.0 soft-reconfiguration inbound
  neighbor 10.254.0.0 default-originate
  neighbor 10.254.0.0 route-map RM-FROM-FABRIC in
  neighbor 10.254.0.0 route-map RM-TO-FABRIC out
 exit-address-family
!
line vty
!
