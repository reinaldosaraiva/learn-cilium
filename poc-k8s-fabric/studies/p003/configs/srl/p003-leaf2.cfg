# =============================================================================
# p003 leaf2 - SR Linux | AS 65202 | system0 10.1.1.2 | rack2
# Sub-rede dos nos k8s do rack2: 10.30.2.0/24 (gateway 10.30.2.1 em irb1.2)
# Nos: node3 10.30.2.11 (e1-1)
# Peering eBGP com o Cilium BGP Control Plane -> AS 65302
# Base: configs/srl/leaf2.cfg (k01), IPs/AS do envelope S003.
# =============================================================================
enter candidate

# ----------------------------------------------------------------- jumbo MTU
set / system mtu default-port-mtu 9232
set / system mtu default-l2-mtu 9232
set / system mtu default-ip-mtu 9194
set / system mtu min-path-mtu 9212

# ------------------------------------------- uplinks para os spines (numerados)
set / interface ethernet-1/49 admin-state enable
set / interface ethernet-1/49 description "to spine1"
set / interface ethernet-1/49 subinterface 0 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 address 10.254.3.1/31
set / interface ethernet-1/50 admin-state enable
set / interface ethernet-1/50 description "to spine2"
set / interface ethernet-1/50 subinterface 0 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 address 10.254.4.1/31

# ------------------------------------------------------------------- loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.1.1.2/32

# ---------------------------------------------- portas de acesso (nos do k8s)
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "node3"
set / interface ethernet-1/1 vlan-tagging false
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 type bridged

# ---------------- IRB: gateway L3 do rack ------------------------------------
set / interface irb1 subinterface 2 admin-state enable
set / interface irb1 subinterface 2 ipv4 admin-state enable
set / interface irb1 subinterface 2 ipv4 address 10.30.2.1/24
set / interface irb1 subinterface 2 ipv4 arp learn-unsolicited true
set / interface irb1 subinterface 2 ipv4 arp host-route populate dynamic
set / interface irb1 subinterface 2 ip-mtu 1500

# ----------------------------- mac-vrf do rack (dominio L2 dos nos do cluster)
set / network-instance rack2 type mac-vrf
set / network-instance rack2 admin-state enable
set / network-instance rack2 interface ethernet-1/1.0
set / network-instance rack2 interface irb1.2
set / network-instance rack2 bridge-table mac-learning admin-state enable

# ----------------------------------------------------- network-instance default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/49.0
set / network-instance default interface ethernet-1/50.0
set / network-instance default interface system0.0
set / network-instance default interface irb1.2

# -------------------------------------------------------------------- policies
set / routing-policy policy all default-action policy-result accept

# ------------------------------------------------------------------------- BGP
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65202
set / network-instance default protocols bgp router-id 10.1.1.2

set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ibgp maximum-paths 64
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath ebgp maximum-paths 64

# --- underlay: eBGP numerado com os spines ----------------------------------
set / network-instance default protocols bgp group spines admin-state enable
set / network-instance default protocols bgp group spines description "underlay eBGP para spines"
set / network-instance default protocols bgp group spines peer-as 65600
set / network-instance default protocols bgp group spines export-policy [ all ]
set / network-instance default protocols bgp group spines import-policy [ all ]
set / network-instance default protocols bgp group spines afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group spines timers hold-time 9
set / network-instance default protocols bgp group spines timers keepalive-interval 3
set / network-instance default protocols bgp neighbor 10.254.3.0 admin-state enable
set / network-instance default protocols bgp neighbor 10.254.3.0 description "spine1"
set / network-instance default protocols bgp neighbor 10.254.3.0 peer-group spines
set / network-instance default protocols bgp neighbor 10.254.4.0 admin-state enable
set / network-instance default protocols bgp neighbor 10.254.4.0 description "spine2"
set / network-instance default protocols bgp neighbor 10.254.4.0 peer-group spines

# --- peering com o Cilium BGP Control Plane (um neighbor por no) -------------
set / network-instance default protocols bgp group rack2-k8s admin-state enable
set / network-instance default protocols bgp group rack2-k8s description "Cilium BGP Control Plane - rack2"
set / network-instance default protocols bgp group rack2-k8s peer-as 65302
set / network-instance default protocols bgp group rack2-k8s export-policy [ all ]
set / network-instance default protocols bgp group rack2-k8s import-policy [ all ]
set / network-instance default protocols bgp group rack2-k8s afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group rack2-k8s timers hold-time 9
set / network-instance default protocols bgp group rack2-k8s timers keepalive-interval 3
set / network-instance default protocols bgp group rack2-k8s graceful-restart admin-state enable

set / network-instance default protocols bgp neighbor 10.30.2.11 admin-state enable
set / network-instance default protocols bgp neighbor 10.30.2.11 description "node3"
set / network-instance default protocols bgp neighbor 10.30.2.11 peer-group rack2-k8s

commit now
