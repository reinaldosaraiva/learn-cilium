apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: p003-edge-tls-gw
  namespace: p003-edge
  labels:
    study: P003
spec:
  gatewayClassName: cilium
  listeners:
  - name: tls
    protocol: HTTPS
    port: 8443
    hostname: edge.p003.study
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: p003-edge-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-edge-tls
  namespace: p003-edge
  labels:
    study: P003
type: kubernetes.io/tls
data:
