# Sanitizado em P006-S001 (A7): segredos e certificados estáticos removidos do git.
# Gere os certificados efêmeros e aplique/renderize o manifesto com:
#   bash gen-tls.sh --render > /tmp/10-tls.rendered.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: p003-edge-tls-gw
  namespace: p003-edge
  labels:
    study: P003
spec:
  gatewayClassName: cilium
  listeners:
  - name: tls
    protocol: HTTPS
    port: 8443
    hostname: edge.p003.study
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: p003-edge-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-edge-tls
  namespace: p003-edge
  labels:
    study: P003
type: kubernetes.io/tls
data:
  tls.crt: <GENERATED_BY_GEN_TLS_SH:EDGE_TLS_CRT_B64>
  tls.key: <GENERATED_BY_GEN_TLS_SH:EDGE_TLS_KEY_B64>
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-a-backend-tls-cert
  namespace: p003-tenant-a
  labels:
    study: P003
type: kubernetes.io/tls
data:
  tls.crt: <GENERATED_BY_GEN_TLS_SH:BACKEND_TLS_CRT_B64>
  tls.key: <GENERATED_BY_GEN_TLS_SH:BACKEND_TLS_KEY_B64>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p003-a-backend-tls-ca
  namespace: p003-tenant-a
  labels:
    study: P003
data:
  ca.crt: |
    <GENERATED_BY_GEN_TLS_SH:LAB_CA_CRT_PEM>
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-a-backend-tls-cert-wrongsan
  namespace: p003-tenant-a
  labels:
    study: P003
type: kubernetes.io/tls
data:
  tls.crt: <GENERATED_BY_GEN_TLS_SH:WRONGSAN_TLS_CRT_B64>
  tls.key: <GENERATED_BY_GEN_TLS_SH:WRONGSAN_TLS_KEY_B64>
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-a-backend-tls-cert-expired
  namespace: p003-tenant-a
  labels:
    study: P003
type: kubernetes.io/tls
data:
  tls.crt: <GENERATED_BY_GEN_TLS_SH:EXPIRED_TLS_CRT_B64>
  tls.key: <GENERATED_BY_GEN_TLS_SH:EXPIRED_TLS_KEY_B64>
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-a-backend-tls-cert-foreignca
  namespace: p003-tenant-a
  labels:
    study: P003
type: kubernetes.io/tls
data:
  tls.crt: <GENERATED_BY_GEN_TLS_SH:FOREIGNCA_TLS_CRT_B64>
  tls.key: <GENERATED_BY_GEN_TLS_SH:FOREIGNCA_TLS_KEY_B64>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p003-a-backend-tls
  namespace: p003-tenant-a
  labels:
    app: p003-a-backend-tls
    study: P003
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p003-a-backend-tls
  template:
    metadata:
      labels:
        app: p003-a-backend-tls
        tenant: a
        study: P003
    spec:
      serviceAccountName: p003-tenant-a-app
      nodeSelector:
        kubernetes.io/hostname: p003-gw-worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tlsecho
        image: p003-tlsecho:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: tls
          containerPort: 8443
        readinessProbe:
          tcpSocket:
            port: tls
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: certs
        secret:
          secretName: p003-a-backend-tls-cert
---
apiVersion: v1
kind: Service
metadata:
  name: p003-a-backend-tls
  namespace: p003-tenant-a
  labels:
    app: p003-a-backend-tls
    study: P003
spec:
  selector:
    app: p003-a-backend-tls
  ports:
  - name: tls
    port: 8443
    targetPort: tls
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: p003-edge-backend-a-tls
  namespace: p003-tenant-a
  labels:
    study: P003
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: p003-edge
  to:
  - group: ''
    kind: Service
    name: p003-a-backend-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p003-edge-tls
  namespace: p003-edge
  labels:
    study: P003
spec:
  parentRefs:
  - name: p003-edge-tls-gw
    sectionName: tls
  hostnames:
  - edge.p003.study
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /tls
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - namespace: p003-tenant-a
      name: p003-a-backend-tls
      port: 8443
---
apiVersion: v1
kind: Secret
metadata:
  name: p003-a-backend-tls-ca-foreign
  namespace: p003-tenant-a
  labels:
    study: P003
type: Opaque
data:
  ca.crt: <GENERATED_BY_GEN_TLS_SH:FOREIGN_CA_CRT_B64>
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: p003-a-backend-tls-policy
  namespace: p003-tenant-a
  labels:
    study: P003
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: p003-a-backend-tls
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: p003-a-backend-tls-ca
    hostname: p003-a-backend-tls.p003-tenant-a.svc.cluster.local
