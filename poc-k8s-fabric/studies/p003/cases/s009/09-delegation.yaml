# P003-S009: delegação ListenerSet (T09)
# ListenerSet é servido em v1 neste cluster (CRD listenersets.gateway.networking.k8s.io,
# Cilium 1.20.2) — v1beta1 dá 404 na API.
# allowedListeners do Gateway p003-didactic (06-didactic.yaml) seleciona
# delegated=true + tenant=a: p003-delegated-a é aceito; p003-delegated-b recebe
# Accepted=False reason=NotAllowed ("not allowed by the Gateway's allowedListeners policy").
# O Grant do Gateway pai (p003-didactic-parentref) cobre o parentRef cross-ns;
# o backend cross-ns (http-echo em p003-gateway) precisa de grant próprio —
# o grant do Gateway NÃO é herdado pelo ListenerSet.
# Conflitos observados (mesma porta):
#   - ListenerSet 8081 (porta do listener base do Gateway) → Conflicted=True
#     HostnameConflict; o listener base do Gateway segue Accepted/Programmed.
#   - 2º ListenerSet 8090 (mesma porta do t09-a) → Conflicted=True HostnameConflict;
#     o t09-a (criado primeiro) segue servindo.
# Route com parentRef sem kind (default Gateway) NÃO anexa ao ListenerSet por
# coincidência: status.parents vazio, tráfego 404.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: p003-delegated-a-backend
  namespace: p003-gateway
  labels: { study: P003 }
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: p003-delegated-a
  to:
    - group: ""
      kind: Service
      name: http-echo
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: t09-a
  namespace: p003-delegated-a
  labels: { study: P003 }
spec:
  parentRef:
    name: p003-didactic
    namespace: p003-edge
  listeners:
    - name: l1
      protocol: HTTP
      port: 8090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t09-a-route
  namespace: p003-delegated-a
  labels: { study: P003 }
spec:
  parentRefs:
    - kind: ListenerSet
      name: t09-a
      sectionName: l1
  hostnames:
    - delegated.p003.study
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - namespace: p003-gateway
          name: http-echo
          port: 80
