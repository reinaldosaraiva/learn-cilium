# P003-S006 A14: externalAuth backendRef porta inexistente no Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p003-broken-port
  namespace: p003-gateway
  labels: { study: P003 }
spec:
  parentRefs:
    - name: p003-main
      sectionName: web
  hostnames:
    - echo.p003.study
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /broken-port
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: p003-authz
              port: 9999
            http: {}
      backendRefs:
        - name: http-echo
          port: 80
---
# P003-S006 A14 (gRPC): mesma porta inexistente, protocolo GRPC
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p003-broken-port-grpc
  namespace: p003-gateway
  labels: { study: P003 }
spec:
  parentRefs:
    - name: p003-main
      sectionName: web
  hostnames:
    - echo.p003.study
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /broken-port-grpc
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            backendRef:
              name: p003-authz
              port: 9999
            grpc: {}
      backendRefs:
        - name: http-echo
          port: 80
