# P003-S013: fixture auth reconstruída (teardown S009 removeu; imagem
# p003-authz:1.0.0 permanece nos nós). nodeSelector worker2 (imagem
# confirmada via crictl). Semântica: X-Lab-Decision allow→200, deny→403,
# ausente→401 (default deny).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p003-authz
  namespace: p003-gateway
  labels: { app: p003-authz, study: P003 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: p003-authz }
  template:
    metadata:
      labels: { app: p003-authz, study: P003 }
    spec:
      nodeSelector:
        kubernetes.io/hostname: p003-gw-worker2
      containers:
        - name: authz
          image: p003-authz:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9000 }
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: p003-authz
  namespace: p003-gateway
  labels: { app: p003-authz, study: P003 }
spec:
  selector: { app: p003-authz }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9000, targetPort: grpc }
