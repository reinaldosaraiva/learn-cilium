# S010 — I06/I07: single pod pinned to a node.
# Replace __NS__ (p003-ipam|p003-ipam32), __NAME__ and __NODE__
# (p003-gw-control-plane|p003-gw-worker|p003-gw-worker2).
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: __NS__
  labels:
    study: P003
spec:
  nodeSelector:
    kubernetes.io/hostname: __NODE__
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: echo
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: [netexec, --http-port=8080]
      ports:
        - containerPort: 8080
