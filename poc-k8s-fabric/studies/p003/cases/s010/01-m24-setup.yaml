# S010 — M24 arm setup: dedicated namespace + pools (default infra + p003-m24)
# require-pool-match annotation blocks silent fallback to the default pool.
apiVersion: v1
kind: Namespace
metadata:
  name: p003-ipam
  labels:
    study: P003
    ipam-pool: p003-m24
  annotations:
    ipam.cilium.io/require-pool-match: "true"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: default
  labels:
    study: P003
spec:
  ipv4:
    cidrs:
      - 10.251.0.0/16
    maskSize: 24
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: p003-m24
  labels:
    study: P003
spec:
  ipv4:
    cidrs:
      - 10.250.0.0/16
    maskSize: 24
  namespaceSelector:
    matchLabels:
      study: P003
      ipam-pool: p003-m24
