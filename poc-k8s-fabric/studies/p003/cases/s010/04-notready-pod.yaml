# S010 — I04: pod that stays Running but NotReady (readiness probe on closed port).
# Namespace is parameterized: replace __NS__ with p003-ipam or p003-ipam32.
apiVersion: v1
kind: Pod
metadata:
  name: p003-ipam-notready
  namespace: __NS__
  labels:
    study: P003
spec:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: echo
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: [netexec, --http-port=8080]
      readinessProbe:
        tcpSocket:
          port: 9999
        periodSeconds: 2
        failureThreshold: 1000
