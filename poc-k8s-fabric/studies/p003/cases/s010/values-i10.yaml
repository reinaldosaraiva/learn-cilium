# S010 — I10 sensitivity trial: preallocation 1 on the pools under test.
MTU: 1500
autoDirectNodeRoutes: true
bgpControlPlane:
  enabled: true
bpf:
  masquerade: true
cluster:
  id: 2
  name: p003-gw
devices: eth+
directRoutingSkipUnreachable: true
enableIPv4Masquerade: true
endpointRoutes:
  enabled: true
gatewayAPI:
  enabled: true
  gatewayClass:
    create: true
hubble:
  enabled: false
ipam:
  mode: multi-pool
  multiPoolPreAllocation: "default=8,p003-m24=1,p003-m32=1"
ipv4NativeRoutingCIDR: 10.248.0.0/14
k8s:
  requireIPv4PodCIDR: false
k8sServiceHost: 172.19.0.5
k8sServicePort: 6443
kubeProxyReplacement: true
l7Proxy: true
loadBalancer:
  algorithm: maglev
  mode: snat
operator:
  replicas: 1
prometheus:
  enabled: false
routingMode: native
