apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  names:
    plural: network-attachment-definitions
    singular: network-attachment-definition
    kind: NetworkAttachmentDefinition
    shortNames:
      - net-attach-def
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: p007-e37
  labels:
    study: e37-multus-ipvlan-dualhomed
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: e37-ipvlan-l2-9000
  namespace: p007-e37
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "e37-ipvlan-l2-9000",
    "type": "ipvlan",
    "master": "eth0",
    "mode": "l2",
    "mtu": 9000,
    "ipam": {
      "type": "host-local",
      "subnet": "10.254.37.0/24",
      "rangeStart": "10.254.37.10",
      "rangeEnd": "10.254.37.50"
    }
  }'
---
apiVersion: v1
kind: Pod
metadata:
  name: e37-vm-a
  namespace: p007-e37
  labels:
    app: e37-vm
    role: vm-a
  annotations:
    k8s.v1.cni.cncf.io/networks: e37-ipvlan-l2-9000
spec:
  terminationGracePeriodSeconds: 0
  nodeName: p003-gw-worker
  containers:
    - name: launcher
      image: python:3.11-alpine
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: e37-vm-b
  namespace: p007-e37
  labels:
    app: e37-vm
    role: vm-b
  annotations:
    k8s.v1.cni.cncf.io/networks: e37-ipvlan-l2-9000
spec:
  terminationGracePeriodSeconds: 0
  nodeName: p003-gw-worker
  containers:
    - name: launcher
      image: python:3.11-alpine
      command:
        - python3
        - -c
        - |
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = f"E37-DUALHOMED local_ip={self.connection.getsockname()[0]}\n".encode()
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: e37-primary-eth0-policy
  namespace: p007-e37
spec:
  endpointSelector:
    matchLabels:
      role: vm-b
  ingress:
    - fromEndpoints:
        - matchLabels:
            role: vm-a
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
