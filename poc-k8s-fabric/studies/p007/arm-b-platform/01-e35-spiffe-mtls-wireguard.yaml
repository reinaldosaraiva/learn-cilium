apiVersion: v1
kind: Namespace
metadata:
  name: p007-e35
  labels:
    study: e35-spiffe-mtls-wireguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e35-server-vault
  namespace: p007-e35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e35-client-trusted
  namespace: p007-e35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e35-client-rogue
  namespace: p007-e35
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: e35-vault-zero-trust
  namespace: p007-e35
spec:
  endpointSelector:
    matchLabels:
      app: e35-vault
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: p007-e35
            io.cilium.k8s.policy.serviceaccount: e35-client-trusted
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: p007-e35
            io.cilium.k8s.policy.serviceaccount: e35-client-rogue
