# ==============================================================================
# E39 — Cilium Service Mesh L7 Traffic Management via CiliumEnvoyConfig
# (Canary Split 90/10 + Header Routing, Token-Bucket Rate Limit HTTP 429 & Retries)
# Plano P008-S001 (Braço B)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: p008-e39
  labels:
    study: e39-cilium-envoy-l7
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e39-envoy-bootstrap
  namespace: p008-e39
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: e39_l7_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 18080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: e39_ingress_http
                    route_config:
                      name: e39_local_route
                      virtual_hosts:
                        - name: e39_api_vhost
                          domains: ["*"]
                          routes:
                            # Célula 1B: Roteamento determinístico por Header X-Canary: true -> 100% v2
                            - match:
                                prefix: "/version"
                                headers:
                                  - name: "x-canary"
                                    string_match:
                                      exact: "true"
                              route:
                                cluster: cluster_v2
                              response_headers_to_add:
                                - header:
                                    key: "x-cilium-envoy-tier"
                                    value: "canary-v2"
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            # Célula 1A: Canary Traffic Split 90% v1 / 10% v2
                            - match:
                                prefix: "/version"
                              route:
                                weighted_clusters:
                                  clusters:
                                    - name: cluster_v1
                                      weight: 90
                                    - name: cluster_v2
                                      weight: 10
                            # Célula 2: Rota com Local Rate Limit por Token Bucket (5 req / 60s -> HTTP 429)
                            - match:
                                prefix: "/ratelimited"
                              route:
                                cluster: cluster_v1
                              typed_per_filter_config:
                                envoy.filters.http.local_ratelimit:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                                  stat_prefix: e39_route_ratelimit
                                  token_bucket:
                                    max_tokens: 5
                                    tokens_per_fill: 5
                                    fill_interval: 60s
                                  filter_enabled:
                                    runtime_key: local_rate_limit_enabled
                                    default_value:
                                      numerator: 100
                                      denominator: HUNDRED
                                  filter_enforced:
                                    runtime_key: local_rate_limit_enforced
                                    default_value:
                                      numerator: 100
                                      denominator: HUNDRED
                                  response_headers_to_add:
                                    - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                      header:
                                        key: x-envoy-ratelimited
                                        value: "true"
                            # Célula 3A-1: Upstream instável SEM política de retry
                            - match:
                                prefix: "/flaky-noretry"
                              route:
                                prefix_rewrite: "/flaky"
                                cluster: cluster_flaky
                            # Célula 3A-2: Upstream instável COM política de retry L7 (retry_on: 5xx, num_retries: 3)
                            - match:
                                prefix: "/flaky-retry"
                              route:
                                prefix_rewrite: "/flaky"
                                cluster: cluster_flaky
                                retry_policy:
                                  retry_on: "5xx,connect-failure,reset"
                                  num_retries: 3
                                  per_try_timeout: 0.5s
                    http_filters:
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: http_local_rate_limiter
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: cluster_v1
          connect_timeout: 0.5s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: cluster_v1
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8081
        - name: cluster_v2
          connect_timeout: 0.5s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: cluster_v2
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8082
        - name: cluster_flaky
          connect_timeout: 0.5s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: cluster_flaky
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: e39-api-svc
  namespace: p008-e39
spec:
  selector:
    app: e39-api
  ports:
    - name: http
      port: 8080
      targetPort: 18080
---
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: e39-l7-traffic-mgmt
  namespace: p008-e39
spec:
  services:
    - name: e39-api-svc
      namespace: p008-e39
      ports: [8080]
  resources:
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: e39-cec-listener
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: e39_cec_http
                rds:
                  route_config_name: e39-cec-route
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
      name: e39-cec-route
      virtual_hosts:
        - name: e39-cec-vhost
          domains: ["*"]
          routes:
            - match:
                prefix: "/"
              route:
                cluster: "p008-e39/e39-api-svc:8080"
