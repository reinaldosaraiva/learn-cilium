# ==============================================================================
# P005-S003 (Braço B — Estudos E17 + E25): Workloads e Políticas L3/L4/L7 (HTTP/DNS/TLS)
# Imagens 100% em cache nos nós kind de p003-gw (IfNotPresent).
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: e17-e25-obs
  labels:
    study: P005
    case: e17-e25
---
apiVersion: v1
kind: Pod
metadata:
  name: obs-backend
  namespace: e17-e25-obs
  labels:
    app: obs-backend
    role: backend
    study: P005
spec:
  nodeSelector:
    kubernetes.io/hostname: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
    - name: http
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      imagePullPolicy: IfNotPresent
      args: ["netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
          name: http
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 1
        periodSeconds: 2
    - name: tls
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/tls.key -out /tmp/tls.crt -days 1 \
            -subj "/CN=obs-backend.e17-e25-obs.svc" >/dev/null 2>&1
          exec openssl s_server -accept 8443 -www -cert /tmp/tls.crt -key /tmp/tls.key -quiet
      ports:
        - containerPort: 8443
          name: https
---
apiVersion: v1
kind: Service
metadata:
  name: obs-backend
  namespace: e17-e25-obs
  labels:
    app: obs-backend
    study: P005
spec:
  selector:
    app: obs-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: e25-obs-vip-advertisement
  labels:
    advertise: fabric
    study: P005
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          e25-bgp-advertise: "true"
      attributes:
        communities:
          standard:
            - "65301:100"
---
apiVersion: v1
kind: Service
metadata:
  name: obs-backend-vip
  namespace: e17-e25-obs
  labels:
    app: obs-backend
    e25-bgp-advertise: "true"
    study: P005
  annotations:
    lbipam.cilium.io/ips: "10.202.255.190"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: obs-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: obs-client-allowed
  namespace: e17-e25-obs
  labels:
    app: obs-client-allowed
    role: client-allowed
    study: P005
spec:
  nodeSelector:
    kubernetes.io/hostname: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
    - name: net
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: obs-client-denied
  namespace: e17-e25-obs
  labels:
    app: obs-client-denied
    role: client-denied
    study: P005
spec:
  nodeSelector:
    kubernetes.io/hostname: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
    - name: net
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
