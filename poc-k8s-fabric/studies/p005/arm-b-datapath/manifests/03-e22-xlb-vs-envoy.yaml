# ==============================================================================
# P005-S002 (Onda 2 — Braço B): E22 — Workloads, Service ClusterIP :8080
# e CiliumNetworkPolicy L7 HTTP (Envoy Proxy vs SocketLB L4 vs XLB Sockmap)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: e22-xlb-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e22-backend
  namespace: e22-xlb-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e22-backend
  template:
    metadata:
      labels:
        app: e22-backend
    spec:
      nodeName: p003-gw-worker
      containers:
      - name: backend
        image: registry.k8s.io/e2e-test-images/agnhost:2.47
        args: ["netexec", "--http-port=8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: e22-svc
  namespace: e22-xlb-test
spec:
  selector:
    app: e22-backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: e22-client
  namespace: e22-xlb-test
  labels:
    app: e22-client
    role: trusted
spec:
  nodeName: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
  - name: client
    image: nicolaka/netshoot:latest
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: e22-untrusted
  namespace: e22-xlb-test
  labels:
    app: e22-untrusted
    role: untrusted
spec:
  nodeName: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
  - name: client
    image: nicolaka/netshoot:latest
    command: ["sleep", "3600"]
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: e22-l7-http
  namespace: e22-xlb-test
spec:
  endpointSelector:
    matchLabels:
      app: e22-backend
  ingress:
  - fromEndpoints:
    - matchLabels:
        role: trusted
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/hostname"
        - method: "GET"
          path: "/echo.*"
