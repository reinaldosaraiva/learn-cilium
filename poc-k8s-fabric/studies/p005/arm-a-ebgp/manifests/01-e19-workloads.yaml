apiVersion: v1
kind: Namespace
metadata:
  name: p005-e19
  labels:
    study: p005-e19
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e19-echo-a
  namespace: p005-e19
  labels:
    app: e19-svc-a
    study: p005-e19
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e19-svc-a
  template:
    metadata:
      labels:
        app: e19-svc-a
        study: p005-e19
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          imagePullPolicy: IfNotPresent
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e19-echo-b
  namespace: p005-e19
  labels:
    app: e19-svc-b
    study: p005-e19
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e19-svc-b
  template:
    metadata:
      labels:
        app: e19-svc-b
        study: p005-e19
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          imagePullPolicy: IfNotPresent
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
              name: http
