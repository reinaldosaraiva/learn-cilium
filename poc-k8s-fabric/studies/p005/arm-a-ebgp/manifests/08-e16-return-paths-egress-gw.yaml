# ==============================================================================
# P005-S004 (Onda 4 — Braço A): E16 — Terminação PE/CE, 3 Modos de Retorno e
# CiliumEgressGatewayPolicy (VIP 10.202.255.197/32, Egress IP 10.255.216.10)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: p005-e16
  labels:
    study: p005-e16
---
apiVersion: v1
kind: Pod
metadata:
  name: e16-vip-backend
  namespace: p005-e16
  labels:
    app: e16-vip-backend
spec:
  nodeName: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.47
    imagePullPolicy: IfNotPresent
    args: ["netexec", "--http-port=8080"]
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: e16-egress-client
  namespace: p005-e16
  labels:
    app: e16-egress-client
    egress-authorized: "true"
spec:
  nodeName: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.47
    imagePullPolicy: IfNotPresent
    args: ["netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Pod
metadata:
  name: e16-unmatched-client
  namespace: p005-e16
  labels:
    app: e16-unmatched-client
    egress-authorized: "false"
spec:
  nodeName: p003-gw-worker
  terminationGracePeriodSeconds: 0
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.47
    imagePullPolicy: IfNotPresent
    args: ["netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: e16-vip-svc
  namespace: p005-e16
  labels:
    e16-bgp-advertise: "true"
  annotations:
    lbipam.cilium.io/ips: "10.202.255.197"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: e16-vip-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: e16-vip-adv
  labels:
    e16-adv: vip
spec:
  advertisements:
  - advertisementType: "Service"
    service:
      addresses:
      - LoadBalancerIP
    selector:
      matchLabels:
        e16-bgp-advertise: "true"
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: e16-peer-pe
spec:
  timers:
    connectRetryTimeSeconds: 2
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  ebgpMultihop: 1
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  families:
  - afi: ipv4
    safi: unicast
    advertisements:
      matchLabels:
        e16-adv: vip
---
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: e16-egress-policy
spec:
  selectors:
  - podSelector:
      matchLabels:
        app: e16-egress-client
        egress-authorized: "true"
    namespaceSelector:
      matchLabels:
        study: p005-e16
  destinationCIDRs:
  - "198.19.16.0/24"
  egressGateway:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: p003-gw-worker
    egressIP: "10.255.216.10"
