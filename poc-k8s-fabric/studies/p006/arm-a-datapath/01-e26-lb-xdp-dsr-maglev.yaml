---
apiVersion: v1
kind: Service
metadata:
  name: e26-svc-snat-random
  namespace: p006-e26
  labels:
    study: P006
    case: E26
    bgp-advertise: "true"
    e26-bgp-advertise: "true"
    lb-mode: snat-random
  annotations:
    lbipam.cilium.io/ips: "10.202.255.26"
    service.cilium.io/forwarding-mode: "snat"
    service.cilium.io/lb-algorithm: "random"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: e26-echo
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
---
