apiVersion: v1
kind: Namespace
metadata:
  name: p006-e26
  labels:
    study: P006
    case: E26
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: e26-vip-advertisement
  labels:
    advertise: fabric
    study: P006
    case: E26
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          e26-bgp-advertise: "true"
      attributes:
        communities:
          standard:
            - "65301:100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e26-echo-w1
  namespace: p006-e26
  labels:
    app: e26-echo
    instance: w1
    study: P006
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e26-echo
      instance: w1
  template:
    metadata:
      labels:
        app: e26-echo
        instance: w1
        study: P006
    spec:
      nodeSelector:
        kubernetes.io/hostname: p003-gw-worker
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.47
        imagePullPolicy: IfNotPresent
        args: ["netexec", "--http-port=8080"]
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
