# =============================================================================
# Cilium 1.20.x - CENARIOS A / B / C : NATIVE ROUTING + BGP Control Plane v2 (Dual-Stack)
# -----------------------------------------------------------------------------
# helm repo add cilium https://helm.cilium.io
# helm upgrade --install cilium cilium/cilium -n kube-system --version 1.20.2 \
#   -f k8s/cilium/values-dualstack.yaml
#
# Sem encapsulamento: o IP do pod entra no fabric como esta. Quem sabe alcancar
# cada PodCIDR e o leaf SR Linux, que aprendeu o prefixo por BGP do proprio no.
# =============================================================================

cluster:
  name: k8s-fabric-poc
  id: 1

# ----------------------------------------------------------------- datapath
routingMode: native
ipv4NativeRoutingCIDR: "10.244.0.0/16"
# rota direta no-a-no quando os nos estao na mesma L2 (mesmo rack);
# skipUnreachable evita erro quando o outro no esta em outro rack/sub-rede.
autoDirectNodeRoutes: true
directRoutingSkipUnreachable: true
endpointRoutes:
  enabled: true

ipam:
  mode: kubernetes          # /24 IPv4 e /64 IPv6 por no, distribuidos pelo kube-controller-manager

k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true

# MTU 1500: padrao da bancada (Jumbo MTU 9000 avaliado nos Estudos E23 e E27).
# No overlay VXLAN isso custa 50 bytes = 3,3% do payload (medido no Cenario D).
MTU: 1500

# ------------------------------------------------- kube-proxy replacement (eBPF)
kubeProxyReplacement: true
# ajuste para o endereco/porta do seu API server (obrigatorio sem kube-proxy;
# o script 02-install-cilium.sh detecta automaticamente o IP do control-plane)
k8sServiceHost: "10.10.1.11"
k8sServicePort: 6443

# ------------------------------------------------------------- masquerading
enableIPv4Masquerade: true
bpf:
  masquerade: true
# trafego DENTRO de ipv4NativeRoutingCIDR nunca e mascarado -> o fabric ve o IP do pod

# --------------------------------------------------------- load balancing L4
loadBalancer:
  # maglev = hashing consistente; importante para anycast/ECMP: se o fabric
  # trocar o no de destino, a conexao ainda cai no mesmo backend.
  algorithm: maglev
  mode: snat

# ------------------------------------------------------- BGP Control Plane v2
bgpControlPlane:
  enabled: true

# ------------------------------------------------------------- observabilidade
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution

prometheus:
  enabled: true
operator:
  replicas: 2
  prometheus:
    enabled: true

# bpf-lb precisa estar em eth1 (fabric) - veth sem rota default e pulado pelo devices-controller
devices: "eth+"

# =============================================================================
# DUAL-STACK (IPv6)
# PodCIDR IPv6 (fd13::/48) e ServiceCIDR IPv6 (fd12::/108) sao definidos no
# manifesto do cluster kind (topo/kind-cluster.yaml) sob ipam.mode=kubernetes.
# =============================================================================
ipv6:
  enabled: true
ipv6NativeRoutingCIDR: "fd13::/48"
enableIPv6Masquerade: true
