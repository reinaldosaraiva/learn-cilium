# =============================================================================
# Cilium 1.20.x - CENARIO D : modo OVERLAY (VXLAN) para comparacao
# -----------------------------------------------------------------------------
# helm upgrade --install cilium cilium/cilium -n kube-system --version 1.20.2 \
#   -f k8s/cilium/values-overlay-poc.yaml
#
# Diferenca essencial em relacao a values-native.yaml:
#   - routingMode: tunnel (VXLAN, UDP/8472) -> o fabric so ve IP de NO
#   - o fabric NAO precisa conhecer PodCIDR; BGP fica so para os VIPs
#   - MTU efetivo do pod cai 50 bytes (VXLAN)
# =============================================================================

cluster:
  name: k8s-fabric-poc
  id: 1

routingMode: tunnel
tunnelProtocol: vxlan          # alternativa: geneve (UDP/6081)

ipam:
  mode: kubernetes

MTU: 1500

kubeProxyReplacement: true
k8sServiceHost: "10.10.1.11"
k8sServicePort: 6443

enableIPv4Masquerade: true
bpf:
  masquerade: true

loadBalancer:
  algorithm: maglev
  mode: snat

# BGP continua util no overlay: anunciar os VIPs de LoadBalancer.
# Nesse modo NAO anuncie PodCIDR (o fabric nao roteia IP de pod).
bgpControlPlane:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

prometheus:
  enabled: true
operator:
  replicas: 2
  prometheus:
    enabled: true

# bpf-lb precisa estar em eth1 (fabric) - veth sem rota default e pulado pelo devices-controller
devices: "eth+"

# Cenario D: em Kind + Containerlab, os nos possuem dois IPs (rede Docker/Kind
# em eth0 e rede do fabric em eth1). Para forcar o VTEP VXLAN nos IPs do fabric
# (10.10.1.0/24 e 10.10.2.0/24), atualize o InternalIP do Node ou ajuste as
# rotas entre racks conforme documentado em docs/lab-results.md (§Cenario D).
extraConfig: {}
