apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-content
data:
  index.html: |
    <!doctype html>
    <html lang="pt-BR">
    <meta charset="utf-8">
    <title>Backend didático</title>
    <body>resposta-served-backend</body>
    </html>
  health: |
    healthy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log stderr notice;

    events {
      worker_connections 128;
    }

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp;
      proxy_temp_path /tmp;
      fastcgi_temp_path /tmp;
      uwsgi_temp_path /tmp;
      scgi_temp_path /tmp;

      server {
        listen 8080;
        server_name _;

        location = /ready {
          default_type text/plain;
          return 200 "api-process-ready";
        }

        location / {
          proxy_set_header Host $host;
          proxy_set_header X-Lab-Path "via-api-proxy";
          add_header X-Lab-Route "via-api-proxy" always;
          proxy_pass http://backend:80;
        }
      }
    }
